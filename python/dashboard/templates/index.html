<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agent-manager dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2e3446; --text: #e6e8eb; --muted: #8a90a0;
    --accent: #5b9dff; --ok: #4caf7d; --warn: #e0a940; --bad: #e0575c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .pipeline-dir { color: var(--muted); font-size: 12px; }
  .layout { display: flex; }
  nav { width: 200px; padding: 16px 0; border-right: 1px solid var(--border); min-height: calc(100vh - 53px); }
  nav button { display: flex; justify-content: space-between; width: 100%; padding: 10px 20px; background: none; border: none; color: var(--text); text-align: left; cursor: pointer; font-size: 13px; }
  nav button:hover { background: var(--panel); }
  nav button.active { background: var(--panel); border-left: 3px solid var(--accent); color: var(--accent); }
  nav .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: rgba(76,175,125,.15); color: var(--ok); }
  .badge.warn { background: rgba(224,169,64,.15); color: var(--warn); }
  .badge.bad { background: rgba(224,87,92,.15); color: var(--bad); }
  .badge.idle { background: rgba(138,144,160,.15); color: var(--muted); }
  .badge-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  /* Brain Dump entry serial number -- a short, stable handle ("#12") to reference a
     specific entry by in conversation instead of its long slugified id. Monospace so
     digits stay visually distinct from the surrounding prose text they're prefixed to. */
  .bd-serial { font-family: monospace; font-weight: 700; color: var(--accent); }
  /* Nav sidebar tab-count severity dot (harnss UI pattern, adapted 2026-07-26): a solid
     small circle, distinct from .badge's translucent pill -- a tiny dot needs a solid
     fill to read at a glance, especially next to a bare number in the nav rail. */
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .status-dot.ok { background: var(--ok); }
  .status-dot.warn { background: var(--warn); }
  .status-dot.bad { background: var(--bad); }
  .stale-timer { color: var(--bad); font-size: 11px; font-variant-numeric: tabular-nums; }
  .state-timer { color: var(--muted, #8b949e); font-size: 11px; font-variant-numeric: tabular-nums; }
  .worker-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .worker-card .row { display: flex; justify-content: space-between; align-items: center; }
  .worker-card .id { font-weight: 600; }
  .worker-card .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  tr.top-row td:first-child { border-left: 2px solid var(--ok); }
  tr.needs-clarification-row td:first-child { border-left: 2px solid var(--warn); }
  .bar-track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; max-width: 900px; width: 100%; }
  .modal h2 { margin-top: 0; font-size: 15px; }
  .modal pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; max-height: 400px; overflow-y: auto; }
  .modal .close { float: right; cursor: pointer; color: var(--muted); background: none; border: none; font-size: 18px; }
  .field-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 14px; }
  .task-history { border-left: 2px solid var(--border); padding-left: 10px; margin-top: 4px; }
  .task-history-row { font-size: 12px; padding: 3px 0; }
  .task-history-stage { font-family: monospace; font-weight: 600; }
  .task-history-row .meta { display: inline; }
  /* Base state (Ornith) also gets its own look, not just the Claude state -- previously
     only .provider-toggle-claude had a distinct color, so the default Ornith state was
     visually identical to a plain .secondary button (Discuss/Edit/Delete), which is how
     a Discuss session got started against the wrong provider without anyone noticing
     (confirmed live 2026-08-17: a human-simulated test clicked Discuss right past it).
     Both states now read as "this is a mode switch," not "this is another action". */
  .provider-toggle { border-color: var(--muted); }
  .provider-toggle-claude { background: var(--accent); color: #0b1220; border-color: var(--accent); }
  #toast { position: fixed; bottom: 20px; right: 20px; max-width: 420px; padding: 10px 16px; border-radius: 8px; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 9999; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .15s ease, transform .15s ease; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.toast-error { background: var(--bad); color: #fff; }
  #toast.toast-info { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .path-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .path-row input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-family: monospace; font-size: 13px; }
  button.action { background: var(--accent); color: #0b1220; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.action:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.danger { background: var(--bad); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.danger:disabled { opacity: .5; cursor: not-allowed; }
  .worker-filter-bar { display: flex; gap: 8px; }
  .worker-filter-bar button { background: var(--panel); color: var(--muted); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .worker-filter-bar button.active { color: var(--accent); border-color: var(--accent); }
  .browser-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
  .browser-crumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; word-break: break-all; }
  .browser-crumb .crumb-link { color: var(--accent); cursor: pointer; }
  .browser-crumb .crumb-link:hover { text-decoration: underline; }
  .browser-entry { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .browser-entry:hover { background: var(--bg); }
  .browser-entry .git-badge { font-size: 10px; color: var(--ok); border: 1px solid var(--ok); padding: 1px 6px; border-radius: 8px; }
  .browser-entry .entry-count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .browser-entry .set-active-project, .browser-entry .create-github-project { font-size: 11px; padding: 3px 9px; }
  .stat-row { display: flex; gap: 24px; margin: 14px 0; }
  .stat { color: var(--muted); font-size: 12px; }
  .stat strong { color: var(--text); font-size: 16px; display: block; }
  .build-log { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: 12px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
  .build-log div { color: var(--muted); }
  iframe.viz { width: 100%; flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: 8px; margin-top: 16px; }
  .split-pane { display: flex; gap: 16px; align-items: flex-start; }
  .split-pane > div { flex: 1; min-width: 0; }
  .capture-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .capture-row input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .bd-entry { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .bd-entry .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bd-entry .text { font-size: 13px; }
  .bd-entry .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .bd-entry a.jump { color: var(--accent); font-size: 12px; text-decoration: none; }
  .note-content { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 13px; max-height: 500px; overflow-y: auto; font-family: monospace; }
  .grill-transcript { max-height: 360px; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
  .grill-msg-role { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .grill-msg-assistant .grill-msg-role { color: var(--accent); }
  .grill-msg-text { font-size: 13px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .grill-msg-user { align-self: flex-end; max-width: 85%; }
  .grill-msg-user .grill-msg-role { text-align: right; }
  .grill-msg-user .grill-msg-text { background: var(--panel); border-radius: 6px; padding: 6px 10px; }
  .grill-session .grill-answer { display: block; width: 100%; box-sizing: border-box; resize: vertical; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-top: 10px; font-family: inherit; }
  .grill-enriched-badge { color: var(--ok); font-size: 12px; margin-top: 10px; }
  .browser-entry.active { background: var(--bg); color: var(--accent); }
  .priority-input { width: 60px; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  .priority-input:focus { outline: 1px solid var(--accent); }
</style>
</head>
<body>
<header>
  <h1>agent-manager</h1>
  <span class="pipeline-dir" id="pipeline-status">loading...</span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="empty">Loading...</div></main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const TABS = [
  { key: 'project', label: 'Project' },
  { key: 'workers', label: 'Workers' },
  { key: 'models', label: 'Models' },
  { key: 'joblist', label: 'Job List' },
  { key: 'deepdive', label: 'Scouted Repos' },
  { key: 'brain-dump', label: 'Brain Dump' },
  { key: 'branches', label: '🌿 Unmerged Branches' },
  { group: 'Job Status', children: [
    { key: 'drafting', label: 'Drafting' },
    { key: 'pending', label: 'Pending' },
    { key: 'review', label: 'Review' },
    { key: 'approved', label: 'Approved' },
    { key: 'blocked', label: 'Blocked' },
    { key: 'needs-clarification', label: '⚠ Needs Clarification' },
    { key: 'awaiting-confirm', label: '🗑 Awaiting Confirm' },
    { key: 'done', label: 'Done' },
  ] },
];
let activeTab = 'project';
let counts = {};

function isGroupExpanded(groupName) {
  return localStorage.getItem('agentManagerNavGroup_' + groupName) !== 'collapsed';
}

// Project tab state -- kept separate from the generic 5s poll-and-rerender cycle used by
// every other tab, since re-rendering over a user's in-progress folder navigation every
// 5s would be a bad experience. See renderProject()/enterProjectTab()/leaveProjectTab().
let projectPath = localStorage.getItem('agentManagerProjectPath') || '';
let grepDirs = localStorage.getItem('agentManagerGrepDirs') || '';
// Removed 2026-07-23 at Grimmethy's request: which job TYPES run is no longer a bundled
// "mode" choice here -- see the Job List tab's isActive checkboxes, a top-level setting
// independent of which project this starts against. What's left here is the two
// safety-critical toggles mode used to imply: whether apply-runner runs at all, and
// whether it's allowed to push. Both default to the SAFEST setting (off) rather than
// mirroring the backend's own permissive fallback -- a fresh browser with no prior choice
// should have to opt INTO write access, not fall into it silently.
let includeApply = localStorage.getItem('agentManagerIncludeApply') === 'true';
let skipPush = localStorage.getItem('agentManagerSkipPush') !== 'false'; // default true (don't push)
let browsePath = '';
let browserOpen = false;
let historyOpen = false;
let projectStatusInterval = null;
// Tracks which click this is on the Start/Stop/Force-Stop toggle button while the
// pipeline is running: false = not yet clicked (button reads "Stop Pipeline"), true =
// a graceful stop was already requested and is in flight (button reads "Force Stop
// Pipeline" so a stuck daemon can be killed without waiting out the grace period).
// Reset to false whenever the pipeline is confirmed not running.
let stopRequested = false;
// Set the moment startPipeline() is clicked, cleared once the pipeline is actually
// confirmed running (or the start attempt fails). Without this, refreshPipelineStatus()
// has no way to tell "not running yet because daemons are still spinning up" apart from
// "not running because nothing was asked to start" -- it would flip the button straight
// back to a fully bright, enabled "Start Pipeline" the moment startPipeline()'s own
// disabled/"Starting..." state got overwritten by the next status poll, then to the red
// Stop button a moment later once daemons actually report running. Confirmed live
// 2026-08-17 (brain-dump entry: "it darkens briefly then goes back to bright blue for a
// moment before shifting to the red pipeline stop button... I'd prefer it stay the
// darker blue while waiting"). This flag lets the button stay in its disabled/loading
// look for that whole gap instead of visibly bouncing through the wrong state twice.
let pipelineStarting = false;
let projectHistory = [];

// Brain Dump tab state -- same "own render lifecycle, not the generic 5s cycle" reasoning
// as the Project tab above: re-rendering from scratch every 5s would wipe a half-typed
// capture note and reset the second-brain folder browser back to its root every tick.
let brainDumpBrowsePath = localStorage.getItem('agentManagerBrainDumpBrowsePath') || '';
let brainDumpSelectedFile = null;
let brainDumpEntriesInterval = null;

// Single choke point for every place that changes which project is active (typed input,
// History panel, Browse panel, and the server-sync in refreshPipelineStatus). grepDirs is
// scoped to whichever project it was typed for -- carrying it over to a different path is
// exactly how "none of the given grepDirs exist under this path" happens (e.g. a leftover
// "frontend/src, backend/src" from a prior project, or here, a stale value that happened to
// equal the old project's own folder name).
function setProjectPath(newPath) {
  if (newPath !== projectPath) {
    grepDirs = '';
    localStorage.setItem('agentManagerGrepDirs', '');
    const grepInput = document.getElementById('project-grepdirs-input');
    if (grepInput) grepInput.value = '';
  }
  projectPath = newPath;
  localStorage.setItem('agentManagerProjectPath', projectPath);
}

// Retrofits #project-path-input into a searchable dropdown of previously-loaded
// projects via a native <datalist> -- typing filters/suggests past paths, picking one
// fills the input, and the existing 'change' handler (below) fires exactly as it already
// does for manual typing or the Browse panel, no other wiring needed.
async function loadProjectHistory() {
  try {
    const data = await fetchJson('/api/projects/history');
    projectHistory = data.projects || [];
  } catch (e) {
    projectHistory = [];
  }
  const list = document.getElementById('project-history-list');
  if (list) list.innerHTML = projectHistory.map((p) => `<option value="${escapeAttr(p)}">`).join('');
}

// Explicit "show me everything" affordance, separate from the datalist above.
// Confirmed live (2026-07-22): Chrome's native datalist popup filters suggestions to
// substring-matches of whatever's currently TYPED in the input -- with a different
// project's path already filled in, every unrelated history entry (e.g. mission-control
// while TaxHarvest is showing) silently disappears from the native popup even though
// it's still correctly in the DOM. That's real browser behavior, not fixable by fixing
// the data -- this panel (same interaction pattern as the Browse... folder panel) lists
// every history entry unconditionally, regardless of the input's current value.
function renderHistoryPanel() {
  const panel = document.getElementById('history-panel');
  if (!panel) return;
  if (projectHistory.length === 0) {
    panel.innerHTML = `<div class="empty">No projects loaded yet.</div>`;
    return;
  }
  panel.innerHTML = projectHistory.map((p) => `
    <div class="browser-entry" data-select="${escapeAttr(p)}">
      <span>${escapeHtml(p)}</span><span>&rarr;</span>
    </div>
  `).join('');
  panel.querySelectorAll('[data-select]').forEach((el) => {
    el.onclick = () => {
      setProjectPath(el.dataset.select);
      document.getElementById('project-path-input').value = projectPath;
      lastRenderedStatusKey = null;
      historyOpen = false;
      panel.style.display = 'none';
      refreshProjectStatus();
    };
  });
}

// 8s timeout on every dashboard fetch. Without this, a request in flight during a server
// restart (or any other network hiccup) can hang indefinitely rather than reject -- and
// since enterProjectTab() awaits this before rendering anything, a single hung request
// left the whole Project tab looking normal but with no working click handlers (found live
// 2026-07-19, right after adding that pre-render status check). Every existing call site
// already wraps fetchJson in a try/catch, so a clean timeout error is handled the same way
// a network error already was -- this only changes "hangs forever" to "fails after 8s".
async function fetchJson(url) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 8000);
  let r;
  try {
    r = await fetch(url, { signal: controller.signal });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(url + ' -> timed out after 8s');
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
  if (!r.ok) throw new Error(url + ' -> ' + r.status);
  return r.json();
}

// Nav tab-count severity thresholds (harnss UI pattern, adapted 2026-07-26): 'blocked' is
// the one state that always deserves attention -- see this whole session's worth of
// "entry stuck forever, no automatic path back" bugs -- so ANY count there is bad, not
// just a large one. 'pending' only escalates once the backlog itself is the anomaly, not
// its everyday size (60-90 pending items was completely normal pipeline behavior today).
// Every other tab stays a plain, uncolored count -- an expected/transient state (drafting,
// review, approved, done) doesn't need a severity read at a glance.
const TAB_COUNT_SEVERITY_THRESHOLDS = {
  blocked: { bad: 1 },
  pending: { warn: 50, bad: 150 },
  // Orange, not red -- a held task isn't broken (see 'blocked'), it's just waiting on a
  // human decision path-prefetch couldn't make safely on its own (no anchor match, or an
  // ambiguous one). Any count at all deserves the same "don't silently sit forever"
  // visibility 'blocked' already gets, just a calmer color for a calmer kind of pending.
  'needs-clarification': { warn: 1 },
  // Red like 'blocked', not orange like 'needs-clarification' -- this is holding a delete
  // specifically, not just an ambiguous path match, so it deserves the same "don't
  // silently sit forever" urgency as blocked, any count at all.
  'awaiting-confirm': { bad: 1 },
  // Orange, same reasoning as 'needs-clarification': a pushed-but-unmerged branch isn't
  // broken, it's already-reviewed work just sitting invisible until someone merges it --
  // exactly the "sandbox" gap this tab exists to surface (2026-08-18).
  branches: { warn: 1 },
};

function severityForTab(tabKey, count) {
  const thresholds = TAB_COUNT_SEVERITY_THRESHOLDS[tabKey];
  if (!thresholds || typeof count !== 'number') return null;
  if (thresholds.bad !== undefined && count >= thresholds.bad) return 'bad';
  if (thresholds.warn !== undefined && count >= thresholds.warn) return 'warn';
  return null;
}

function renderTabButton(tab, indent) {
  const btn = document.createElement('button');
  btn.className = tab.key === activeTab ? 'active' : '';
  if (indent) btn.style.paddingLeft = '36px';
  const count = (tab.key === 'workers' || tab.key === 'models' || tab.key === 'joblist' || tab.key === 'deepdive') ? '' : (counts[tab.key] ?? '');
  const severity = severityForTab(tab.key, count);
  const dot = severity ? `<span class="status-dot ${severity}"></span>` : '';
  btn.innerHTML = `<span>${tab.label}</span><span class="count">${dot}${count}</span>`;
  btn.onclick = () => {
    if (activeTab === 'project' && tab.key !== 'project') leaveProjectTab();
    if (activeTab === 'brain-dump' && tab.key !== 'brain-dump') leaveBrainDumpTab();
    activeTab = tab.key;
    renderNav();
    if (tab.key === 'project') enterProjectTab();
    else if (tab.key === 'brain-dump') enterBrainDumpTab();
    else renderMain();
  };
  return btn;
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  for (const tab of TABS) {
    if (tab.group) {
      const expanded = isGroupExpanded(tab.group);
      const header = document.createElement('button');
      header.innerHTML = `<span>${expanded ? '▾' : '▸'} ${tab.group}</span><span class="count"></span>`;
      header.onclick = () => {
        localStorage.setItem('agentManagerNavGroup_' + tab.group, expanded ? 'collapsed' : 'expanded');
        renderNav();
      };
      nav.appendChild(header);
      if (expanded) {
        for (const child of tab.children) nav.appendChild(renderTabButton(child, true));
      }
    } else {
      nav.appendChild(renderTabButton(tab, false));
    }
  }
}

function fmtAge(sec) {
  if (sec == null) return '?';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.round(sec / 60) + 'm';
  return Math.round(sec / 3600) + 'h';
}

function statusBadgeClass(status, stale) {
  if (stale) return 'bad';
  if (status === 'working' || status === 'checking') return 'ok';
  if (status === 'idle') return 'idle';
  return 'warn';
}

// Which worker lane the Workers tab shows -- 'all' | 'ornith' | 'claude'. Kept in memory
// only (like modelsSortKey below), not localStorage: this is a quick glance-time filter,
// not a durable preference worth surviving a page reload. Lane is derived from
// instanceId's 'worker-claude*' vs everything-else convention (see ornith-worker.sh's
// IS_CLAUDE_LANE), the same distinction the two worker-* lanes already use to split
// which tasks they claim -- there's no separate "type" field on the instance record to
// filter on instead.
let workersTypeFilter = 'all';

function laneForInstance(inst) {
  return inst.instanceId.startsWith('worker-claude') ? 'claude' : 'ornith';
}

async function renderWorkers() {
  const instances = await fetchJson('/api/instances');
  const main = document.getElementById('main');
  const fetchedAt = Date.now();
  instances.forEach(i => { i._fetchedAtMs = fetchedAt; });
  instancesForTimers = instances;
  const filterBar = `
    <div class="worker-filter-bar" style="margin-bottom:10px">
      ${[['all', 'All'], ['ornith', 'Ornith (grunt)'], ['claude', 'Claude (reasoning)']].map(([key, label]) => `
        <button class="${workersTypeFilter === key ? 'active' : ''}" data-worker-filter="${key}">${label}</button>
      `).join('')}
    </div>
  `;
  const shown = instances.filter(inst => workersTypeFilter === 'all' || laneForInstance(inst) === workersTypeFilter);
  if (instances.length === 0) { main.innerHTML = '<div class="empty">No instances found -- is the pipeline running?</div>'; return; }
  main.innerHTML = filterBar + (shown.length === 0
    ? '<div class="empty">No workers match this filter.</div>'
    : shown.map(inst => `
    <div class="worker-card ${inst.currentTaskId ? 'clickable' : ''}" ${inst.currentTaskId ? `data-task-id="${escapeAttr(inst.currentTaskId)}"` : ''}>
      <div class="row">
        <span class="id">${inst.instanceId}</span>
        <div class="badge-col">
          <span class="badge ${statusBadgeClass(inst.status, inst.stale)}">${inst.stale ? 'STALE' : inst.status}</span>
          ${inst.stale ? `<span class="stale-timer" id="stale-timer-${inst.instanceId}"></span>` : ''}
          <span class="state-timer" id="state-timer-${inst.instanceId}">${inst.stateAgeSeconds != null ? 'in this state ' + fmtDuration(inst.stateAgeSeconds) : ''}</span>
        </div>
      </div>
      <div class="meta">
        pid ${inst.pid} · model ${inst.model || '-'} · heartbeat ${fmtAge(inst.heartbeatAgeSeconds)} ago
        ${inst.currentTaskId ? ' · working on <strong>' + inst.currentTaskId + '</strong>' + (inst.currentPass ? ' (' + inst.currentPass + ')' : '') : ''}
      </div>
    </div>
  `).join(''));
  main.querySelectorAll('.worker-card[data-task-id]').forEach((card) => {
    card.onclick = () => openTaskAnywhere(card.dataset.taskId);
  });
  main.querySelectorAll('[data-worker-filter]').forEach((btn) => {
    btn.onclick = () => { workersTypeFilter = btn.dataset.workerFilter; renderWorkers(); };
  });
  updateStaleTimers();
}

// Raw instance list from the last /api/instances fetch, kept around so the 1s ticking
// timer below can recompute stale duration client-side without re-polling every second.
let instancesForTimers = [];

function fmtDuration(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

// Ticks every second independent of the 5s /api/instances poll, so "stale for" reads as a
// live counter instead of jumping in 5s increments. Computed purely from lastHeartbeat +
// staleThresholdSeconds (both already on each instance) -- no extra fetch needed.
function updateStaleTimers() {
  for (const inst of instancesForTimers) {
    // State-runtime tracker: ticks for every instance that reports stateSince. Anchored
    // to the server-computed stateAgeSeconds at fetch time rather than parsing stateSince
    // locally, so a client/server clock skew can't distort the reading.
    const st = document.getElementById('state-timer-' + inst.instanceId);
    if (st && inst.stateAgeSeconds != null) {
      const elapsed = inst.stateAgeSeconds + (Date.now() - inst._fetchedAtMs) / 1000;
      st.textContent = 'in this state ' + fmtDuration(elapsed);
    }
    if (!inst.stale) continue;
    const el = document.getElementById('stale-timer-' + inst.instanceId);
    if (!el) continue;
    const staleSinceMs = new Date(inst.lastHeartbeat).getTime() + inst.staleThresholdSeconds * 1000;
    el.textContent = 'Stale for ' + fmtDuration((Date.now() - staleSinceMs) / 1000);
  }
}
setInterval(updateStaleTimers, 1000);

function fmtPct(x) { return x == null ? '-' : Math.round(x * 100) + '%'; }
function fmtNum(x, digits) { return x == null ? '-' : Number(x).toFixed(digits); }

// Sort state lives outside the function so it survives the 5s poll re-rendering the
// whole table from scratch each time (same rebuild-from-fetch pattern renderQueueTab uses).
let modelsSortKey = 'approveRate';
let modelsSortDir = 'desc';

const MODELS_COLUMNS = [
  { key: 'model', label: 'Model', sortable: false },
  { key: 'callCount', label: 'Calls', sortable: true },
  { key: 'approveRate', label: 'Approve Rate', sortable: true, bar: 'ok' },
  { key: 'avgTokensPerSec', label: 'Avg Tok/s', sortable: true, bar: 'accent' },
  { key: 'minTokensPerSec', label: 'Low Tok/s', sortable: true },
  { key: 'maxTokensPerSec', label: 'High Tok/s', sortable: true },
  { key: 'avgLatencyMs', label: 'Avg Latency (ms)', sortable: true },
  { key: 'degenerateCount', label: 'Degenerate', sortable: true },
  { key: 'errorCount', label: 'Errors', sortable: true },
];

function renderBarCell(value, max, colorVar, fmt) {
  const label = fmt(value);
  if (value == null || !max) return label;
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return `<div>${label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%; background:var(--${colorVar})"></div></div>`;
}

// Populated on every renderModelsTab() call so the discuss/grill toggle buttons
// elsewhere in this file (renderProviderToggle()) always reflect the saved default
// without a separate fetch of their own -- Models tab is the one place this gets
// refreshed from the server; everywhere else just reads this cache.
let claudeSettingsCache = null;

// Local/Claude toggle placed next to any button that starts a conversation (Discuss,
// eventually Grill Me/Grill With Docs). A plain two-state button rather than a
// dropdown -- there are only ever two choices, and a click-to-flip pill reads faster at
// a glance than opening a select. `idAttr` must be unique per instance (one entry's
// toggle must not flip a different entry's). Server-side, sending only {provider:
// "claude"} with no model/effort is enough -- _discuss_provider_args() in app.py fills
// in the Models tab's saved defaults itself, so this toggle doesn't need
// claudeSettingsCache to be populated to work.
//
// providerChoices persists the flipped state across re-renders, keyed by idAttr (stable
// across renders since callers always pass the same deterministic id for a given
// entry/panel). Without this, the Brain Dump tab's periodic 5s refresh
// (refreshBrainDumpEntries's setInterval) redraws every entry's card from scratch --
// including a freshly-defaulted-to-"local" toggle -- wiping a click the user made but
// hadn't yet acted on. Confirmed live 2026-08-16: clicking the toggle to "Claude" and
// waiting a few seconds before clicking Discuss silently reverted it to "Local" with no
// indication why, and no actual error had occurred -- the toggle was never wired to
// anything that could error just by being clicked. brainDumpDiscussingId's own existing
// "don't wipe in-progress state" guard doesn't cover this case: it's set only once a
// discussion has actually STARTED, not from the moment the toggle is flipped.
// Brief, auto-dismissing notification -- e.g. surfacing the real reason a Claude-
// provider Discuss call failed (most commonly: CLAUDE_CODE_OAUTH_TOKEN isn't set yet)
// without leaving a permanent error block sitting in the page. Reuses one DOM node
// across calls rather than stacking multiple toasts -- a second error while one is
// still showing replaces it and restarts the 3s timer, it doesn't queue.
let toastHideTimer = null;
function showToast(message, kind = 'error') {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.className = kind === 'error' ? 'toast-error' : 'toast-info';
  // Force a reflow before adding "show" so the fade-in transition actually plays when
  // the same node is reused back-to-back (toggling a class that's already set doesn't
  // retrigger a CSS transition).
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastHideTimer);
  toastHideTimer = setTimeout(() => { el.classList.remove('show'); }, 3000);
}

const providerChoices = {};

// Label says "Ornith", not "Local" -- naming the actual model instead of its deployment
// mode reads as a real choice between two named things, not a vague default vs. an
// override (see this function's CSS comment for the same "make it read as a switch, not
// a stray button" fix applied to the styling).
function renderProviderToggle(idAttr) {
  const provider = providerChoices[idAttr] || 'local';
  const claudeClass = provider === 'claude' ? ' provider-toggle-claude' : '';
  const label = provider === 'claude' ? 'Claude' : 'Ornith';
  return `<button type="button" class="secondary provider-toggle${claudeClass}" id="${idAttr}" data-provider="${provider}" title="Ornith (local model) vs. your Claude subscription -- click to switch">${label}</button>`;
}

function wireProviderToggle(idAttr) {
  const btn = document.getElementById(idAttr);
  if (!btn) return;
  btn.onclick = (e) => {
    e.stopPropagation();
    const next = btn.dataset.provider === 'local' ? 'claude' : 'local';
    providerChoices[idAttr] = next;
    btn.dataset.provider = next;
    btn.textContent = next === 'local' ? 'Ornith' : 'Claude';
    btn.classList.toggle('provider-toggle-claude', next === 'claude');
  };
}

function providerPayload(idAttr) {
  const btn = document.getElementById(idAttr);
  return { provider: (btn && btn.dataset.provider) || 'local' };
}

async function renderClaudeSettingsPanel() {
  const settings = await fetchJson('/api/settings/claude');
  claudeSettingsCache = settings;
  const modelOpts = settings.modelChoices.map(m => `<option value="${m}" ${m === settings.model ? 'selected' : ''}>${m}</option>`).join('');
  const effortOpts = settings.effortChoices.map(e => `<option value="${e}" ${e === settings.effort ? 'selected' : ''}>${e}</option>`).join('');
  const tokenStatus = settings.tokenConfigured
    ? '<span style="color:var(--ok)">Subscription token configured</span>'
    : '<span style="color:var(--warn)">No subscription token set -- Claude toggle will fail until one is added</span>';
  return `
    <div class="grill-session" style="margin-bottom:16px">
      <div class="field-label">Claude Subscription Defaults</div>
      <div class="meta" style="margin-bottom:8px">Used whenever a Discuss/Grill conversation is switched to Claude via its toggle, unless that conversation picks a different model/effort itself.</div>
      <div class="row" style="gap:8px;align-items:center">
        <label>Model <select id="claude-default-model">${modelOpts}</select></label>
        <label>Effort <select id="claude-default-effort">${effortOpts}</select></label>
        <button type="button" class="action" id="claude-settings-save">Save</button>
        <span id="claude-settings-status" class="meta"></span>
      </div>
      <div class="field-label" style="margin-top:14px">Subscription Token</div>
      <div class="meta" style="margin-bottom:6px">${tokenStatus} -- generate one with <code>claude setup-token</code> (opens a browser to approve, then prints a token good for about a year). Pasted here, it's saved to <code>agent-manager.env</code> and never shown again, including to this page -- only whether one is set.</div>
      <div class="row" style="gap:8px;align-items:center">
        <input type="password" id="claude-token-input" placeholder="Paste token from \`claude setup-token\`" autocomplete="off" style="flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-family:monospace;font-size:12px">
        <button type="button" class="action" id="claude-token-save">Save Token</button>
        ${settings.tokenConfigured ? '<button type="button" class="secondary" id="claude-token-clear">Clear</button>' : ''}
      </div>
    </div>`;
}

function wireClaudeSettingsPanel() {
  const btn = document.getElementById('claude-settings-save');
  if (btn) btn.onclick = async () => {
    const model = document.getElementById('claude-default-model').value;
    const effort = document.getElementById('claude-default-effort').value;
    const status = document.getElementById('claude-settings-status');
    try {
      claudeSettingsCache = await (await fetch('/api/settings/claude', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, effort }),
      })).json();
      status.textContent = 'Saved.';
      setTimeout(() => { status.textContent = ''; }, 2000);
    } catch (e) {
      status.textContent = 'Save failed: ' + e.message;
    }
  };

  const tokenBtn = document.getElementById('claude-token-save');
  if (tokenBtn) tokenBtn.onclick = async () => {
    const input = document.getElementById('claude-token-input');
    const token = input.value.trim();
    if (!token) { showToast('Paste a token first.'); return; }
    try {
      const res = await fetch('/api/settings/claude-token', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.description || ('HTTP ' + res.status));
      // Wipe the field immediately rather than leaving the pasted secret sitting in a
      // form input (and in the browser's own form-autofill history) any longer than
      // the single click it took to save it.
      input.value = '';
      showToast(result.restarted ? 'Token saved -- pipeline restarted to pick it up.' : 'Token saved.', 'info');
      renderModelsTab();
    } catch (e) {
      showToast('Could not save token: ' + e.message);
    }
  };

  const clearBtn = document.getElementById('claude-token-clear');
  if (clearBtn) clearBtn.onclick = async () => {
    if (!confirm('Remove the saved Claude subscription token? The toggle will stop working until a new one is added.')) return;
    try {
      await fetch('/api/settings/claude-token', { method: 'DELETE' });
      showToast('Token cleared.', 'info');
      renderModelsTab();
    } catch (e) {
      showToast('Could not clear token: ' + e.message);
    }
  };
}

// budget-monitor.js's own signal, unchanged here -- see /api/claude-usage's docstring
// for exactly what this is (a real rate-limit hit/reset history plus a rolling volume
// trend) and isn't (a live "% of quota used" gauge -- Claude Code doesn't expose one).
async function renderClaudeUsagePanel() {
  let usage;
  try {
    usage = await fetchJson('/api/claude-usage');
  } catch (e) {
    return '';
  }
  if (!usage.available) {
    return `<div class="grill-session" style="margin-bottom:16px"><div class="field-label">Claude Usage</div><div class="meta">Not available: ${escapeHtml(usage.reason || 'unknown')}</div></div>`;
  }
  const healthLabel = usage.healthy
    ? '<span style="color:var(--ok)">healthy</span>'
    : `<span style="color:var(--bad)">rate-limited</span>`;
  const resetLine = usage.lastRateLimit && usage.lastRateLimit.resetsAt
    ? `<div class="meta">Resets: ${new Date(usage.lastRateLimit.resetsAt).toLocaleString()}</div>` : '';
  return `
    <div class="grill-session" style="margin-bottom:16px">
      <div class="field-label">Claude Usage</div>
      <div>${healthLabel} <span class="meta">-- ${escapeHtml(usage.reason || '')}</span></div>
      ${resetLine}
      <div class="row" style="gap:24px;margin-top:6px">
        <div class="stat"><strong>${usage.rolling5h.calls}</strong>calls / last 5h</div>
        <div class="stat"><strong>${usage.rolling5h.tokens.toLocaleString()}</strong>tokens / last 5h</div>
        <div class="stat"><strong>${usage.rolling7d.calls}</strong>calls / last 7d</div>
        <div class="stat"><strong>${usage.rolling7d.tokens.toLocaleString()}</strong>tokens / last 7d</div>
      </div>
      <div class="meta" style="margin-top:6px">Rolling volume trend, not a live quota gauge -- Claude Code only ever reports a rate-limit hit reactively, after it happens. Includes both interactive \`claude\` sessions and this pipeline's own headless calls on this machine.</div>
    </div>`;
}

async function renderModelsTab() {
  const [models, usageRows, settingsPanel, usagePanel] = await Promise.all([
    fetchJson('/api/models'),
    fetchJson('/api/models/usage'),
    renderClaudeSettingsPanel(),
    renderClaudeUsagePanel(),
  ]);
  const main = document.getElementById('main');

  const sorted = models.slice().sort((a, b) => {
    const av = a[modelsSortKey], bv = b[modelsSortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;   // nulls last regardless of direction
    if (bv == null) return -1;
    if (av < bv) return modelsSortDir === 'asc' ? -1 : 1;
    if (av > bv) return modelsSortDir === 'asc' ? 1 : -1;
    return 0;
  });

  const maxApprove = Math.max(...models.map(m => m.approveRate ?? 0), 0);
  const maxTokS = Math.max(...models.map(m => m.avgTokensPerSec ?? 0), 0);

  const headCells = MODELS_COLUMNS.map(col => {
    if (!col.sortable) return `<th>${col.label}</th>`;
    const arrow = modelsSortKey === col.key ? (modelsSortDir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th class="sortable" data-key="${col.key}">${col.label}${arrow}</th>`;
  }).join('');

  const rows = sorted.map((m, i) => `
    <tr class="${i === 0 ? 'top-row' : ''}">
      <td>${m.model}</td>
      <td>${m.callCount}</td>
      <td>${renderBarCell(m.approveRate, maxApprove, 'ok', fmtPct)}</td>
      <td>${renderBarCell(m.avgTokensPerSec, maxTokS, 'accent', (v) => fmtNum(v, 1))}</td>
      <td>${fmtNum(m.minTokensPerSec, 1)}</td>
      <td>${fmtNum(m.maxTokensPerSec, 1)}</td>
      <td>${fmtNum(m.avgLatencyMs, 0)}</td>
      <td>${m.degenerateCount}</td>
      <td>${m.errorCount}</td>
    </tr>
  `).join('');

  const implementTable = models.length === 0
    ? '<div class="empty">No implement-pass stats yet -- set AGENT_MANAGER_CLAUDE_SOURCES or ORNITH_AB_MODELS to compare candidates.</div>'
    : `<table><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;

  const usageTableRows = usageRows.map(r => `
    <tr>
      <td>${escapeHtml(r.model)}</td>
      <td>${escapeHtml(r.stage)}</td>
      <td>${r.callCount}</td>
      <td>${fmtNum(r.avgLatencyMs, 0)}</td>
      <td>${r.lastUsedAt ? new Date(r.lastUsedAt).toLocaleString() : ''}</td>
    </tr>
  `).join('');
  const usageTable = usageRows.length === 0 ? '' : `
    <div class="field-label" style="margin-top:20px">All Calls (every stage, both providers)</div>
    <table><thead><tr><th>Model</th><th>Stage</th><th>Calls</th><th>Avg Latency (ms)</th><th>Last Used</th></tr></thead>
    <tbody>${usageTableRows}</tbody></table>`;

  main.innerHTML = settingsPanel + usagePanel + '<div class="field-label">Implement-Pass Quality</div>' + implementTable + usageTable;
  wireClaudeSettingsPanel();
  main.querySelectorAll('th.sortable').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      modelsSortDir = (modelsSortKey === key && modelsSortDir === 'desc') ? 'asc' : 'desc';
      modelsSortKey = key;
      renderModelsTab();
    };
  });
}

// Manual archive/requeue (Job Status > Blocked/Done tabs) and manual apply (Approved tab,
// three-tier approval mode, 2026-07-26) -- per-row action buttons on renderQueueTab's
// generic table, the same POST-then-rerender-then-alert-on-failure pattern the second
// brain's set-active-project/create-github-project buttons already use. event.stopPropagation()
// is load-bearing: the row's own onclick (openDetail) must not also fire when a button
// inside that row is clicked.
async function postTaskAction(state, id, action, confirmMessage) {
  if (confirmMessage && !confirm(confirmMessage)) return;
  try {
    const res = await fetch(`/api/task/${state}/${encodeURIComponent(id)}/${action}`, { method: 'POST' });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.description || `${res.status}`);
    }
    await renderQueueTab(state);
  } catch (e) {
    alert(`Could not ${action} '${id}': ` + e.message);
  }
}

// Incremental loading (2026-07-26, Grimmethy: "long task lists take a while to load,
// we should do incremental loading, 10 at a time, expanding as the user scrolls to the
// bottom"). queueLoadedCount/queueHasMore persist per-state across the generic 5s
// refresh() poll and across tab switches (switching away and back keeps your scroll
// depth) -- only a full page reload resets them to the first page.
const QUEUE_PAGE_SIZE = 10;
const QUEUE_STATE_TABS = ['drafting', 'pending', 'review', 'approved', 'blocked', 'needs-clarification', 'awaiting-confirm', 'done'];
const queueLoadedCount = {};
const queueHasMore = {};
let queueLoadInFlight = false;

// Task-type filter (Job Status > Done, 2026-08-17: "Done is getting huge, need to
// filter by task type"). Per-state so switching tabs doesn't carry a filter over to an
// unrelated list; '' means unfiltered. Options come from /api/job-types (same source
// catalog the Job List tab's own rows are built from) fetched once and cached module-
// scope -- it barely changes, and re-fetching on every 5s poll would be wasteful for a
// dropdown that just needs the name list.
const queueSourceFilter = {};
let allSourceNamesPromise = null;
function allSourceNames() {
  if (!allSourceNamesPromise) {
    allSourceNamesPromise = fetchJson('/api/job-types').then((jobTypes) => jobTypes.map((j) => j.name).sort());
  }
  return allSourceNamesPromise;
}

window.addEventListener('scroll', () => {
  if (!QUEUE_STATE_TABS.includes(activeTab)) return;
  if (!queueHasMore[activeTab] || queueLoadInFlight) return;
  if (window.innerHeight + window.scrollY < document.body.offsetHeight - 200) return;
  queueLoadedCount[activeTab] = (queueLoadedCount[activeTab] || QUEUE_PAGE_SIZE) + QUEUE_PAGE_SIZE;
  renderQueueTab(activeTab);
});

function wireQueueSourceFilter(state) {
  const select = document.getElementById('queue-source-filter');
  if (!select) return;
  select.onchange = () => {
    queueSourceFilter[state] = select.value;
    // A new filter means a new result set -- start back at page 1, same reasoning
    // scroll-triggered pagination already resets per-state, not just appends onto
    // whatever page depth the PREVIOUS filter had scrolled to.
    queueLoadedCount[state] = QUEUE_PAGE_SIZE;
    renderQueueTab(state);
  };
}

async function renderQueueTab(state) {
  if (!queueLoadedCount[state]) queueLoadedCount[state] = QUEUE_PAGE_SIZE;
  queueLoadInFlight = true;
  const sourceFilter = queueSourceFilter[state] || '';
  const filterQS = sourceFilter ? `&source=${encodeURIComponent(sourceFilter)}` : '';
  let tasks, total;
  try {
    const resp = await fetchJson(`/api/queue/${state}?limit=${queueLoadedCount[state]}&offset=0${filterQS}`);
    tasks = resp.items;
    total = resp.total;
  } finally {
    queueLoadInFlight = false;
  }
  queueHasMore[state] = queueLoadedCount[state] < total;
  const main = document.getElementById('main');

  const sourceNames = await allSourceNames();
  const filterOptionsHtml = ['<option value="">All task types</option>']
    .concat(sourceNames.map((n) => `<option value="${escapeAttr(n)}" ${n === sourceFilter ? 'selected' : ''}>${escapeHtml(n)}</option>`))
    .join('');
  const filterHtml = `<div class="row" style="margin-bottom:10px"><label class="meta">Task type: <select id="queue-source-filter">${filterOptionsHtml}</select></label></div>`;

  if (tasks.length === 0) {
    main.innerHTML = filterHtml + `<div class="empty">${sourceFilter ? `No "${escapeHtml(sourceFilter)}" tasks here.` : 'Nothing here.'}</div>`;
    wireQueueSourceFilter(state);
    return;
  }
  const showArchiveRequeue = state === 'blocked' || state === 'done';
  // Archive alone (no generic Requeue -- that moves to pending/, wrong for an
  // adhoc-domain task; resolving happens via the detail modal's own picker instead, see
  // renderTaskDetailModal).
  const showArchiveOnly = state === 'needs-clarification';
  // apply-task.js's awaiting-confirm gate (src/apply-group-b.js's batchContainsDeleteMode):
  // Confirm re-runs this exact task for real (stamps deleteConfirmedAt, moves to approved/
  // for the next apply-task.sh pass); Deny is the existing generic Archive action -- no
  // separate deny endpoint needed, giving up on a delete-containing batch is exactly what
  // Archive already means everywhere else in this table.
  const showConfirmDeny = state === 'awaiting-confirm';
  const showApply = state === 'approved';

  // 'prompt'-tier tasks get an active badge here instead of a plain row -- the whole
  // point of that tier vs 'approve' is not sitting unnoticed (see /api/job-types'
  // approvalMode field). Best-effort: a failed fetch just means no badges render, same
  // "degrade gracefully" convention JOB_TYPES' own jobTypes-null fallback already uses.
  let approvalModeBySource = {};
  if (showApply) {
    try {
      const jobTypes = await fetchJson('/api/job-types');
      jobTypes.forEach((j) => { approvalModeBySource[j.name] = j.approvalMode; });
    } catch (e) { /* badges just won't render */ }
  }

  const rows = tasks.map(t => {
    const isPrompt = showApply && approvalModeBySource[t.source] === 'prompt';
    // Orange left-border + ⚠ prefix on every row here -- the actual ask (Discuss session
    // on context-aware-file-path-prefetch-job.md): surface these prominently rather than
    // let them blend into an ordinary-looking list and get silently orphaned.
    const rowClass = state === 'needs-clarification' ? 'clickable needs-clarification-row' : 'clickable';
    // awaiting-confirm holds two different things behind one shared gate/endpoint (see
    // apply-task.js's own two gates and api_task_confirm_delete's comment) -- the delete-
    // mode Group B batch this tab/copy was originally written for, and (Brain Dump #67,
    // 2026-08-17) an adhoc task with a real agentic-drafted code diff. Same domain/source
    // signal resolveSourceName() itself checks, cheap enough to duplicate client-side
    // rather than adding a field just for this label.
    const isAdhocConfirm = state === 'awaiting-confirm' && (t.domain === 'adhoc' || t.source === 'manual');
    // A third thing this same shared gate/endpoint holds (Brain Dump #1 follow-up,
    // 2026-08-17) -- a research task with a real agentic web-research write-up, same
    // "check the task's own domain" signal as isAdhocConfirm above.
    const isResearchConfirm = state === 'awaiting-confirm' && t.domain === 'research';
    const detailCell = t.needsClarification
      ? `<span style="color:var(--warn)">⚠ ${t.needsClarification.reason === 'ambiguous' ? 'ambiguous match' : 'no anchor match'}</span>`
      : isAdhocConfirm
        ? '<span style="color:var(--warn)">⚠ real code diff ready to apply</span>'
        : isResearchConfirm
          ? '<span style="color:var(--warn)">📚 research write-up ready to file</span>'
          : state === 'awaiting-confirm'
            ? '<span style="color:var(--bad)">🗑 contains a delete</span>'
            : (t.blockedReason ? '<span style="color:var(--bad)">' + escapeHtml(t.blockedReason).slice(0, 80) + '</span>' : (t.branch || t.doneMarker || ''));
    return `
    <tr class="${rowClass}" data-id="${t.id}" data-state="${state}">
      <td>${t.id}</td>
      <td>${t.title || ''}${isPrompt ? ' <span class="badge warn" title="This source is set to \'prompt\' -- it still needs your explicit Apply click, same as approve, but is actively badged so it does not sit unnoticed">needs review</span>' : ''}</td>
      <td>${t.domain || ''}/${t.source || ''}</td>
      <td>${detailCell}</td>
      ${showArchiveRequeue ? `<td>
        <button type="button" class="secondary task-archive-btn" data-id="${escapeAttr(t.id)}">Archive</button>
        <button type="button" class="secondary task-requeue-btn" data-id="${escapeAttr(t.id)}">Requeue</button>
      </td>` : ''}
      ${showArchiveOnly ? `<td>
        <button type="button" class="secondary task-archive-btn" data-id="${escapeAttr(t.id)}">Reject</button>
      </td>` : ''}
      ${showConfirmDeny ? `<td>
        <button type="button" class="secondary task-confirm-delete-btn" data-id="${escapeAttr(t.id)}" data-adhoc="${isAdhocConfirm}" data-research="${isResearchConfirm}">${isAdhocConfirm ? 'Confirm & Apply' : isResearchConfirm ? 'Confirm & File' : 'Confirm Delete'}</button>
        <button type="button" class="secondary task-archive-btn" data-id="${escapeAttr(t.id)}" data-adhoc="${isAdhocConfirm}" data-research="${isResearchConfirm}">Deny</button>
      </td>` : ''}
      ${showApply ? `<td><button type="button" class="secondary task-apply-btn" data-id="${escapeAttr(t.id)}">Apply</button></td>` : ''}
    </tr>
  `;
  }).join('');
  const actionHeader = (showArchiveRequeue || showArchiveOnly || showConfirmDeny || showApply) ? '<th>Actions</th>' : '';
  const footer = `<div class="meta" style="padding:10px 4px">Showing ${tasks.length} of ${total}${queueHasMore[state] ? ' -- scroll for more' : ''}</div>`
    + (state === 'needs-clarification' ? '<div class="meta" style="padding:0 4px">Click a row to pick a file path (or proceed with no prefetch) and send it to drafting.</div>' : '');
  main.innerHTML = filterHtml + `<table><thead><tr><th>ID</th><th>Title</th><th>Domain/Source</th><th>Detail</th>${actionHeader}</tr></thead><tbody>${rows}</tbody></table>${footer}`;
  wireQueueSourceFilter(state);
  main.querySelectorAll('tr.clickable').forEach(row => {
    row.onclick = () => openDetail(row.dataset.state, row.dataset.id);
  });
  main.querySelectorAll('.task-archive-btn').forEach((btn) => {
    const msg = state === 'needs-clarification'
      ? `Reject '${btn.dataset.id}'? This holds it aside without ever drafting it -- the original brain-dump entry is unaffected.`
      : state === 'awaiting-confirm'
        ? (btn.dataset.adhoc === 'true'
          ? `Deny '${btn.dataset.id}'? This gives up on the drafted code diff entirely -- nothing will be committed.`
          : btn.dataset.research === 'true'
            ? `Deny '${btn.dataset.id}'? This gives up on the drafted research write-up entirely -- nothing will be filed into SecondBrain.`
            : `Deny the delete in '${btn.dataset.id}'? This gives up on the batch entirely -- nothing in it (including any non-delete items in the same batch) will be applied.`)
        : `Archive '${btn.dataset.id}'? This frees up its underlying item for reconsideration but does not apply anything.`;
    btn.onclick = (e) => { e.stopPropagation(); postTaskAction(state, btn.dataset.id, 'archive', msg); };
  });
  main.querySelectorAll('.task-confirm-delete-btn').forEach((btn) => {
    const msg = btn.dataset.adhoc === 'true'
      ? `Confirm '${btn.dataset.id}'? Click into the row first to review the real diff this agentic pass drafted -- confirming lets the next apply pass commit and push it for real.`
      : btn.dataset.research === 'true'
        ? `Confirm '${btn.dataset.id}'? Click into the row first to review the real research write-up this agentic pass drafted -- confirming lets the next apply pass file it into SecondBrain for real.`
        : `Confirm the delete in '${btn.dataset.id}'? This lets the next apply pass run the batch for real, including the delete.`;
    btn.onclick = (e) => { e.stopPropagation(); postTaskAction(state, btn.dataset.id, 'confirm', msg); };
  });
  main.querySelectorAll('.task-requeue-btn').forEach((btn) => {
    btn.onclick = (e) => { e.stopPropagation(); postTaskAction(state, btn.dataset.id, 'requeue', `Requeue '${btn.dataset.id}' for a fresh draft? This resets its retry history.`); };
  });
  main.querySelectorAll('.task-apply-btn').forEach((btn) => {
    btn.onclick = (e) => { e.stopPropagation(); postTaskAction(state, btn.dataset.id, 'apply', `Apply '${btn.dataset.id}' now? This runs the real git branch/commit/push (or vault-note write) for this one task.`); };
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTaskDetailModal(task) {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  let html = `<button class="close" onclick="closeDetail()">&times;</button><h2>${task.id}</h2>`;
  if (task._foundState) html += `<div class="field-label">Queue State</div><div>${escapeHtml(task._foundState)}</div>`;
  html += `<div><strong>${escapeHtml(task.title || '')}</strong></div>`;
  html += `<div class="field-label">Domain / Source</div><div>${task.domain || ''} / ${task.source || ''}</div>`;
  if (task.blockedReason) html += `<div class="field-label">Blocked Reason</div><div style="color:var(--bad)">${escapeHtml(task.blockedReason)}</div>`;
  if (task.branch) html += `<div class="field-label">Branch</div><div>${task.branch}</div>`;
  if (task.promptContext && task.promptContext.prefetchedPaths && task.promptContext.prefetchedPaths.length) {
    html += `<div class="field-label">Prefetched Paths</div><div>${task.promptContext.prefetchedPaths.map(p => `<code>${escapeHtml(p)}</code>`).join('<br>')}</div>`;
  }
  if (task.needsClarification) html += renderClarificationPicker(task);
  // Pipeline History: task.history[] (task-history.js's appendHistoryEvent -- see that
  // module for the schema). Was written correctly the whole time this session but never
  // rendered anywhere in the app -- the data existed only if you went and read the raw
  // task JSON off disk yourself, which defeats the point of a per-step timeline being a
  // dashboard feature at all. Entries come in two shapes: older ones only ever have
  // `status` (no `stage`, no `detail`) from before task-history.js existed -- render both
  // so a task whose life started before this feature shipped doesn't just show a gap.
  if (task.history && task.history.length) {
    html += `<div class="field-label">Pipeline History</div><div class="task-history">`;
    html += task.history.map(h => {
      const label = h.stage || h.status || '?';
      const when = h.at ? new Date(h.at).toLocaleString() : '';
      const detail = h.detail || h.note || '';
      return `<div class="task-history-row"><span class="task-history-stage">${escapeHtml(label)}</span> `
        + `<span class="meta">${escapeHtml(when)}</span>`
        + (detail ? `<div class="meta">${escapeHtml(detail)}</div>` : '')
        + `</div>`;
    }).join('') + `</div>`;
  }
  if (task.planResponse) html += `<div class="field-label">Plan</div><pre>${escapeHtml(task.planResponse)}</pre>`;
  if (task.implementResponse) html += `<div class="field-label">Implement</div><pre>${escapeHtml(task.implementResponse)}</pre>`;
  content.innerHTML = html;
  backdrop.classList.add('open');
  if (task.needsClarification) wireClarificationPicker(task.id);
}

// Path-prefetch's "needs clarification" resolution UI (context-aware-file-path-prefetch-
// job.md): 'ambiguous' shows every candidate file per matched keyword as its own pick
// button (never auto-picks -- the actual ask); 'no-match' just offers a manual path
// input. Both cases also get "Proceed without prefetch" -- the explicit escape hatch for
// when prefetch genuinely has nothing useful to offer, rather than blocking the task
// forever over it.
function renderClarificationPicker(task) {
  const nc = task.needsClarification;
  let html = `<div class="field-label">⚠ Needs Clarification</div>`;
  // LLM-assisted fallback suggestion (path_prefetch_resolve, hybrid design 2026-08-16) --
  // shown FIRST and most prominent, since accepting it is the one-click path that's the
  // whole point of the hybrid: still a human decision (never auto-applied), just a much
  // faster one than manually knowing the codebase. Sits above the raw candidate/manual
  // options below it, which stay available as a fallback if the suggestion is wrong.
  if (nc.suggested) {
    const s = nc.suggested;
    const confidenceLabel = s.confident ? 'confident' : 'best guess';
    if (s.paths && s.paths.length) {
      html += `<div class="grill-session" style="margin-top:8px;border:1px solid var(--warn)">`;
      html += `<div class="field-label">Suggested (${confidenceLabel})</div>`;
      html += `<div>${s.paths.map(p => `<code>${escapeHtml(p)}</code>`).join('<br>')}</div>`;
      if (s.rationale) html += `<div class="meta" style="margin-top:6px">${escapeHtml(s.rationale)}</div>`;
      html += `<button type="button" class="action clarify-accept-suggestion-btn" data-suggested-paths="${escapeAttr(JSON.stringify(s.paths))}" style="margin-top:8px">Accept Suggestion</button>`;
      html += `</div>`;
    } else {
      html += `<div class="grill-session" style="margin-top:8px"><div class="field-label">Suggestion attempted</div><div class="meta">The model couldn't find a match either${s.rationale ? ': ' + escapeHtml(s.rationale) : '.'}</div></div>`;
    }
  }
  if (nc.reason === 'ambiguous' && nc.candidates) {
    html += `<div class="meta">One or more keywords matched more than one file -- pick which one(s) belong:</div>`;
    for (const [keyword, files] of Object.entries(nc.candidates)) {
      html += `<div style="margin-top:6px"><strong>${escapeHtml(keyword)}</strong><br>`;
      html += files.map(f => `<button type="button" class="secondary clarify-pick-btn" data-path="${escapeAttr(f)}" style="margin:3px 6px 0 0">${escapeHtml(f)}</button>`).join('');
      html += `</div>`;
    }
  } else {
    html += `<div class="meta">No file in the project graph matched anything in this task's text. Type a path by hand, or proceed without one.</div>`;
  }
  html += `<div style="margin-top:10px"><input type="text" id="clarify-manual-path" placeholder="relative/path/to/file.ts" style="width:60%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-family:monospace;font-size:12px">`;
  html += `<button type="button" class="action" id="clarify-add-manual" style="margin-left:6px">Use This Path</button></div>`;
  html += `<div id="clarify-selected-paths" style="margin-top:8px"></div>`;
  html += `<div style="margin-top:10px"><button type="button" class="action" id="clarify-resolve-btn">Send to Drafting</button> <button type="button" class="secondary" id="clarify-skip-btn">Proceed Without Prefetch</button> <button type="button" class="secondary" id="clarify-discuss-btn">Discuss</button> ${renderProviderToggle('clarify-discuss-provider')}</div>`;
  html += `<div id="clarify-discuss-panel" style="margin-top:10px"></div>`;
  return html;
}

// "Discuss" on a held task -- the actual ask: "rather than inputting a file path manually
// we should open a 'discuss' to get more information about the task itself." Shares
// discuss_sessions.py and the generic /api/discuss/* endpoints with the other two Discuss
// integrations; only /start and /for-note are needs-clarification-specific. Ending the
// conversation re-opens the held task for a fresh path_prefetch_resolve attempt with the
// enriched text (see app.py's api_discuss_end 'needs-clarification' branch) -- so this
// isn't just note-taking, it's a real second shot at automatic resolution.
function clarifyDiscussRenderPanel(taskId, session) {
  const el = document.getElementById('clarify-discuss-panel');
  if (!el) return;
  const transcriptHtml = grillRenderTranscript(session.transcript, session);
  if (session.status === 'ended') {
    const actionHtml = session.summary
      ? `<div class="grill-enriched-badge">Added to task ✓ -- re-queued for another resolution attempt with this context.</div>`
      : `<div class="meta" style="margin-top:8px">Ended with nothing said -- task unchanged.</div>`;
    el.innerHTML = `<div class="grill-session"><div class="field-label">Discussion ended</div>${transcriptHtml}${actionHtml}</div>`;
  } else {
    el.innerHTML = `<div class="grill-session">${transcriptHtml}<textarea class="grill-answer" rows="3" placeholder="Say more... (Enter to send, Shift+Enter for a new line)"></textarea><div class="row" style="margin-top:8px"><button type="button" class="secondary" id="clarify-discuss-end">End Discussion</button><button type="button" class="action" id="clarify-discuss-send">Send</button></div></div>`;
    const answerEl = el.querySelector('.grill-answer');
    const sendBtn = el.querySelector('#clarify-discuss-send');
    const endBtn = el.querySelector('#clarify-discuss-end');
    const send = () => clarifyDiscussSend(taskId, session.id, answerEl.value, sendBtn);
    sendBtn.onclick = send;
    endBtn.onclick = () => clarifyDiscussEnd(taskId, session.id, endBtn);
    answerEl.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    };
    answerEl.focus();
  }
  const scrollEl = el.querySelector('.grill-transcript');
  if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
}

async function clarifyDiscussStart(taskId) {
  const el = document.getElementById('clarify-discuss-panel');
  try {
    const existing = await fetchJson('/api/task/needs-clarification/' + encodeURIComponent(taskId) + '/discuss/latest');
    if (existing && existing.status === 'active') {
      clarifyDiscussRenderPanel(taskId, existing);
      return;
    }
  } catch (e) { /* best-effort check -- fall through to starting normally */ }
  if (el) el.innerHTML = '<div class="empty">Starting discussion...</div>';
  try {
    const resp = await fetch('/api/task/needs-clarification/' + encodeURIComponent(taskId) + '/discuss/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(providerPayload('clarify-discuss-provider')),
    });
    const session = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(session.description || ('HTTP ' + resp.status));
    clarifyDiscussRenderPanel(taskId, session);
  } catch (e) {
    if (el) el.innerHTML = '';
    showToast('Could not start discussion: ' + e.message);
  }
}

async function clarifyDiscussSend(taskId, sessionId, message, btn) {
  if (!message || !message.trim()) return;
  btn.disabled = true;
  btn.textContent = 'Thinking...';
  try {
    const resp = await fetch('/api/discuss/' + encodeURIComponent(sessionId) + '/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const session = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(session.description || ('HTTP ' + resp.status));
    clarifyDiscussRenderPanel(taskId, session);
  } catch (e) {
    showToast('Could not send message: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Send';
  }
}

async function clarifyDiscussEnd(taskId, sessionId, btn) {
  btn.disabled = true;
  btn.textContent = 'Ending...';
  try {
    const resp = await fetch('/api/discuss/' + encodeURIComponent(sessionId) + '/end', { method: 'POST' });
    const result = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(result.description || ('HTTP ' + resp.status));
    clarifyDiscussRenderPanel(taskId, result.session);
    // The held task was just re-opened for another resolution attempt server-side --
    // close the modal and refresh the list rather than leaving a stale picker open
    // against a task that's no longer in the state it shows.
    if (result.heldTask) {
      setTimeout(() => {
        closeDetail();
        if (activeTab === 'needs-clarification') renderQueueTab('needs-clarification');
      }, 1200);
    }
  } catch (e) {
    showToast('Could not end discussion: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'End Discussion';
  }
}

function wireClarificationPicker(taskId) {
  const selected = [];
  const renderSelected = () => {
    const el = document.getElementById('clarify-selected-paths');
    if (!el) return;
    el.innerHTML = selected.length
      ? '<div class="meta">Selected: ' + selected.map(escapeHtml).join(', ') + '</div>'
      : '';
  };
  document.querySelectorAll('.clarify-pick-btn').forEach((btn) => {
    btn.onclick = () => {
      const p = btn.dataset.path;
      if (!selected.includes(p)) selected.push(p);
      btn.disabled = true;
      renderSelected();
    };
  });
  const manualInput = document.getElementById('clarify-manual-path');
  const addManualBtn = document.getElementById('clarify-add-manual');
  if (addManualBtn) {
    addManualBtn.onclick = () => {
      const p = (manualInput.value || '').trim();
      if (!p) return;
      if (!selected.includes(p)) selected.push(p);
      manualInput.value = '';
      renderSelected();
    };
  }
  const resolveBtn = document.getElementById('clarify-resolve-btn');
  if (resolveBtn) resolveBtn.onclick = () => resolveNeedsClarification(taskId, selected);
  const skipBtn = document.getElementById('clarify-skip-btn');
  if (skipBtn) skipBtn.onclick = () => resolveNeedsClarification(taskId, []);
  const acceptSuggestionBtn = document.querySelector('.clarify-accept-suggestion-btn');
  if (acceptSuggestionBtn) {
    acceptSuggestionBtn.onclick = () => {
      let paths = [];
      try { paths = JSON.parse(acceptSuggestionBtn.dataset.suggestedPaths || '[]'); } catch (e) { /* leave empty */ }
      resolveNeedsClarification(taskId, paths);
    };
  }
  const discussBtn = document.getElementById('clarify-discuss-btn');
  if (discussBtn) discussBtn.onclick = () => clarifyDiscussStart(taskId);
  wireProviderToggle('clarify-discuss-provider');
  // Surface an existing (active or already-ended) discussion instead of leaving the
  // picker looking like nothing has been tried yet -- same "don't bury prior work"
  // reasoning as every other Discuss integration's own for-note/latest check.
  fetchJson('/api/task/needs-clarification/' + encodeURIComponent(taskId) + '/discuss/latest')
    .then((existing) => { if (existing) clarifyDiscussRenderPanel(taskId, existing); })
    .catch(() => { /* best-effort -- no prior session is the common case */ });
}

async function resolveNeedsClarification(taskId, paths) {
  try {
    const res = await fetch(`/api/task/needs-clarification/${encodeURIComponent(taskId)}/resolve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.description || `${res.status}`);
    }
    closeDetail();
    if (activeTab === 'needs-clarification') renderQueueTab('needs-clarification');
  } catch (e) {
    alert(`Could not resolve '${taskId}': ` + e.message);
  }
}

async function openDetail(state, id) {
  const task = await fetchJson(`/api/task/${state}/${encodeURIComponent(id)}`);
  renderTaskDetailModal(task);
}

// Workers tab click-through: an instance's currentTaskId doesn't say which queue state
// to look in (worker=drafting, review-runner=review, apply-runner=approved) -- the
// backend searches for us (see /api/task-anywhere) instead of guessing here.
async function openTaskAnywhere(taskId) {
  try {
    const task = await fetchJson(`/api/task-anywhere/${encodeURIComponent(taskId)}`);
    renderTaskDetailModal(task);
  } catch (e) {
    alert('Could not load task details: ' + e.message);
  }
}

function closeDetail() {
  document.getElementById('modal-backdrop').classList.remove('open');
  deepDiveDetailCache = null; // force a fresh fetch next time any project's modal opens
}
document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') closeDetail(); });

// Static reference data, not fetched from the server -- mirrors the task sources this
// package's own src/task-sources.js registers (priority order documented there). A
// consumer project can register additional sources at priority 30/50/60; this encyclopedia
// only documents what ships with agent-manager itself.
// source values must exactly match src/task-sources.js's registerTaskSource() names --
// that's what AGENT_MANAGER_TASK_SOURCES (the isActive checkboxes below) actually lists.
// Confirmed live (2026-07-23): this table had drifted from the real registry -- missing
// brain_dump_sort entirely, and 'deadcode_triage' didn't match the real 'unused_export'
// name, which would have made that row's checkbox a silent no-op. Fixed alongside adding
// isActive, since the mismatch is exactly the kind of bug this feature would otherwise hide.

  { source: 'adhoc', domain: 'adhoc', priority: 10, description: 'Manually submitted one-off task, queued via queue-adhoc-task.js. Drop-everything priority lane.' },
  { source: 'research_task', domain: 'research_task', priority: 10, description: 'A captured Brain Dump entry brain_dump_sort classified as requiresResearch (queue/research/*.json), drafted by research-agentic-draft.js\'s WebSearch/WebFetch-backed agentic call instead of the code-repo one. Always high-reasoning-tier (Claude) -- Ornith has no web tools. Same "drop everything" priority as adhoc.' },
  { source: 'trouble_log', domain: '(project default)', priority: 20, description: "Entries in the project's trouble-log doc flagged ready-for-agent (🤖 marker)." },
  { source: 'secondbrain', domain: 'secondbrain', priority: 40, description: 'Oldest unprocessed note in a SecondBrain-style Inbox/ folder.' },
  { source: 'brain_dump_sort', domain: 'brain_dump_sort', priority: 42, description: 'Sorts a captured Brain Dump entry into a second-brain destination and marks it filed. Always active -- sits above any single project, see the Brain Dump tab.' },
  { source: 'path_prefetch_resolve', domain: 'path_prefetch_resolve', priority: 45, description: 'LLM-assisted fallback for a queue/needs-clarification/ held task path-prefetch\'s deterministic keyword match could not resolve on its own -- suggests file path(s) + rationale for a human to accept or override, never auto-resolves. Always active -- see the Needs Clarification job status tab.' },

  { source: 'arch_discovery', domain: '(project default)', priority: 80, description: 'Generates new architecture candidates for one graphify community at a time.' },
  { source: 'observability_review', domain: '(project default)', priority: 80, description: 'Triages a deterministically-flagged observability-hygiene issue (silent catch, unguarded long-running loop, OTel naming violation) in a deep_dive-onboarded project as genuine or false-positive.' },
  { source: 'arch_import', domain: '(project default)', priority: 81, description: 'Promotes a reviewed deep_dive Use/Adapt finding into a real, agent-manager-grounded architecture-import candidate (ADR-0020): proposes search terms, a harness greps agent-manager\'s own repo, then drafts a candidate grounded in the real matches.' },
  { source: 'deep_dive', domain: 'deep_dive', priority: 82, description: 'Reviews one import-graph community at a time from a project_search Strong lead\'s cloned repo, rating each finding Use/Adapt/Ignore (ADR-0019). See the Scouted Repos tab.' },
  { source: 'project_search', domain: 'project_search', priority: 85, description: 'Proposes external open-source leads relevant to the project. Discovery-only, no auto-fulfillment.' },
  { source: 'unused_export', domain: '(project default)', priority: 90, description: 'Triages a flagged dead-code candidate (exported symbol with few call sites) as genuine-dead or false-positive.' },

// Unmerged Branches tab (2026-08-18): closes the "sandbox" visibility gap -- a pushed
// agent/<task.id> branch previously sat invisible until someone happened to go looking,
// which is exactly what let a real apply failure quietly mask itself as "done" with
// nothing actually landed. One click here does the full fetch/merge/push/live-sync
// sequence server-side (see app.py's api_git_merge_branch) instead of the manual clone/
// branch/merge/push dance that incident required by hand.
async function renderBranchesTab() {
  const main = document.getElementById('main');
  let branches;
  try {
    branches = await fetchJson('/api/git/unmerged-branches');
  } catch (e) {
    main.innerHTML = `<div class="empty">Error loading branches: ${escapeHtml(e.message)}</div>`;
    return;
  }
  if (branches.length === 0) {
    main.innerHTML = '<div class="empty">Nothing pushed-but-unmerged -- the live copy is caught up.</div>';
    return;
  }
  main.innerHTML = branches.map((b) => `
    <div class="worker-card" data-branch-row="${escapeAttr(b.branch)}">
      <div class="row">
        <span class="id">${escapeHtml(b.title)}</span>
        <div class="badge-col">
          <span class="badge warn">${b.ahead} commit${b.ahead === 1 ? '' : 's'} ahead</span>
        </div>
      </div>
      <div class="meta">
        ${b.domain ? `domain <strong>${escapeHtml(b.domain)}</strong>${b.source ? ' · source <strong>' + escapeHtml(b.source) + '</strong>' : ''} · ` : ''}
        pushed ${fmtAge((Date.now() - new Date(b.pushedAt).getTime()) / 1000)} ago
        ${!b.matchedTaskState ? ' · <span title="No matching queue/ task file found -- label is the branch\'s own last commit subject.">no task record found</span>' : ''}
      </div>
      <div class="meta" style="font-family:monospace;font-size:11px;margin-top:4px">${escapeHtml(b.branch)}</div>
      <div class="row" style="margin-top:8px">
        <button class="action" data-merge-branch="${escapeAttr(b.branch)}">Merge to ${escapeHtml(b.mainBranch)}</button>
      </div>
    </div>
  `).join('');

  main.querySelectorAll('[data-merge-branch]').forEach((btn) => {
    btn.onclick = async () => {
      const branch = btn.dataset.mergeBranch;
      if (!confirm(`Merge "${branch}" into master and sync the live dashboard?`)) return;
      btn.disabled = true;
      btn.textContent = 'Merging...';
      try {
        const resp = await fetch(`/api/git/branches/${encodeURIComponent(branch)}/merge`, { method: 'POST' });
        const result = await resp.json();
        if (!resp.ok || !result.succeeded) throw new Error(result.reason || `HTTP ${resp.status}`);
        if (result.liveSync && result.liveSync.restartTriggered) {
          btn.textContent = 'Merged -- dashboard reloading...';
          // Werkzeug's reloader restart is near-instant but not synchronous with this
          // response -- give it a moment, then just re-render; if it's still mid-restart
          // renderMain()'s own try/catch shows a normal "disconnected" state until the
          // next 5s poll succeeds, same as any other brief connection drop.
          setTimeout(() => renderMain(), 1500);
        } else {
          await renderBranchesTab();
        }
      } catch (e) {
        alert('Merge failed: ' + e.message);
        await renderBranchesTab();
      }
    };
  });
}

async function renderJobListTab() {
  const main = document.getElementById('main');
  let jobTypes;
  try {
    jobTypes = await fetchJson('/api/job-types');
