<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agent-manager dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38; --text: #e6e8eb; --muted: #8a90a0;
    --accent: #5b9dff; --ok: #4caf7d; --warn: #e0a940; --bad: #e0575c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .pipeline-dir { color: var(--muted); font-size: 12px; }
  .layout { display: flex; }
  nav { width: 200px; padding: 16px 0; border-right: 1px solid var(--border); min-height: calc(100vh - 53px); }
  nav button { display: flex; justify-content: space-between; width: 100%; padding: 10px 20px; background: none; border: none; color: var(--text); text-align: left; cursor: pointer; font-size: 13px; }
  nav button:hover { background: var(--panel); }
  nav button.active { background: var(--panel); border-left: 3px solid var(--accent); color: var(--accent); }
  nav .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: rgba(76,175,125,.15); color: var(--ok); }
  .badge.warn { background: rgba(224,169,64,.15); color: var(--warn); }
  .badge.bad { background: rgba(224,87,92,.15); color: var(--bad); }
  .badge.idle { background: rgba(138,144,160,.15); color: var(--muted); }
  .badge-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .stale-timer { color: var(--bad); font-size: 11px; font-variant-numeric: tabular-nums; }
  .state-timer { color: var(--muted, #8b949e); font-size: 11px; font-variant-numeric: tabular-nums; }
  .worker-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .worker-card .row { display: flex; justify-content: space-between; align-items: center; }
  .worker-card .id { font-weight: 600; }
  .worker-card .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  tr.top-row td:first-child { border-left: 2px solid var(--ok); }
  .bar-track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; max-width: 900px; width: 100%; }
  .modal h2 { margin-top: 0; font-size: 15px; }
  .modal pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; max-height: 400px; overflow-y: auto; }
  .modal .close { float: right; cursor: pointer; color: var(--muted); background: none; border: none; font-size: 18px; }
  .field-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 14px; }
  .path-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .path-row input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-family: monospace; font-size: 13px; }
  button.action { background: var(--accent); color: #0b1220; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.action:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .browser-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
  .browser-crumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; word-break: break-all; }
  .browser-entry { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .browser-entry:hover { background: var(--bg); }
  .browser-entry .git-badge { font-size: 10px; color: var(--ok); border: 1px solid var(--ok); padding: 1px 6px; border-radius: 8px; }
  .stat-row { display: flex; gap: 24px; margin: 14px 0; }
  .stat { color: var(--muted); font-size: 12px; }
  .stat strong { color: var(--text); font-size: 16px; display: block; }
  .build-log { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: 12px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
  .build-log div { color: var(--muted); }
  iframe.viz { width: 100%; flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: 8px; margin-top: 16px; }
  .split-pane { display: flex; gap: 16px; align-items: flex-start; }
  .split-pane > div { flex: 1; min-width: 0; }
  .capture-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .capture-row input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .bd-entry { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .bd-entry .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bd-entry .text { font-size: 13px; }
  .bd-entry .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .bd-entry a.jump { color: var(--accent); font-size: 12px; text-decoration: none; }
  .note-content { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 13px; max-height: 500px; overflow-y: auto; font-family: monospace; }
  .browser-entry.active { background: var(--bg); color: var(--accent); }
  .priority-input { width: 60px; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  .priority-input:focus { outline: 1px solid var(--accent); }
</style>
</head>
<body>
<header>
  <h1>agent-manager</h1>
  <span class="pipeline-dir" id="pipeline-status">loading...</span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="empty">Loading...</div></main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const TABS = [
  { key: 'project', label: 'Project' },
  { key: 'workers', label: 'Workers' },
  { key: 'models', label: 'Models' },
  { key: 'joblist', label: 'Job List' },
  { key: 'deepdive', label: 'Scouted Repos' },
  { key: 'brain-dump', label: 'Brain Dump' },
  { group: 'Job Status', children: [
    { key: 'drafting', label: 'Drafting' },
    { key: 'pending', label: 'Pending' },
    { key: 'review', label: 'Review' },
    { key: 'approved', label: 'Approved' },
    { key: 'blocked', label: 'Blocked' },
    { key: 'done', label: 'Done' },
  ] },
];
let activeTab = 'project';
let counts = {};

function isGroupExpanded(groupName) {
  return localStorage.getItem('agentManagerNavGroup_' + groupName) !== 'collapsed';
}

// Project tab state -- kept separate from the generic 5s poll-and-rerender cycle used by
// every other tab, since re-rendering over a user's in-progress folder navigation every
// 5s would be a bad experience. See renderProject()/enterProjectTab()/leaveProjectTab().
let projectPath = localStorage.getItem('agentManagerProjectPath') || '';
let grepDirs = localStorage.getItem('agentManagerGrepDirs') || '';
// Removed 2026-07-23 at Grimmethy's request: which job TYPES run is no longer a bundled
// "mode" choice here -- see the Job List tab's isActive checkboxes, a top-level setting
// independent of which project this starts against. What's left here is the two
// safety-critical toggles mode used to imply: whether apply-runner runs at all, and
// whether it's allowed to push. Both default to the SAFEST setting (off) rather than
// mirroring the backend's own permissive fallback -- a fresh browser with no prior choice
// should have to opt INTO write access, not fall into it silently.
let includeApply = localStorage.getItem('agentManagerIncludeApply') === 'true';
let skipPush = localStorage.getItem('agentManagerSkipPush') !== 'false'; // default true (don't push)
let browsePath = '';
let browserOpen = false;
let historyOpen = false;
let projectStatusInterval = null;
let projectHistory = [];

// Brain Dump tab state -- same "own render lifecycle, not the generic 5s cycle" reasoning
// as the Project tab above: re-rendering from scratch every 5s would wipe a half-typed
// capture note and reset the second-brain folder browser back to its root every tick.
let brainDumpBrowsePath = localStorage.getItem('agentManagerBrainDumpBrowsePath') || '';
let brainDumpSelectedFile = null;
let brainDumpEntriesInterval = null;

// Retrofits #project-path-input into a searchable dropdown of previously-loaded
// projects via a native <datalist> -- typing filters/suggests past paths, picking one
// fills the input, and the existing 'change' handler (below) fires exactly as it already
// does for manual typing or the Browse panel, no other wiring needed.
async function loadProjectHistory() {
  try {
    const data = await fetchJson('/api/projects/history');
    projectHistory = data.projects || [];
  } catch (e) {
    projectHistory = [];
  }
  const list = document.getElementById('project-history-list');
  if (list) list.innerHTML = projectHistory.map((p) => `<option value="${escapeAttr(p)}">`).join('');
}

// Explicit "show me everything" affordance, separate from the datalist above.
// Confirmed live (2026-07-22): Chrome's native datalist popup filters suggestions to
// substring-matches of whatever's currently TYPED in the input -- with a different
// project's path already filled in, every unrelated history entry (e.g. mission-control
// while TaxHarvest is showing) silently disappears from the native popup even though
// it's still correctly in the DOM. That's real browser behavior, not fixable by fixing
// the data -- this panel (same interaction pattern as the Browse... folder panel) lists
// every history entry unconditionally, regardless of the input's current value.
function renderHistoryPanel() {
  const panel = document.getElementById('history-panel');
  if (!panel) return;
  if (projectHistory.length === 0) {
    panel.innerHTML = `<div class="empty">No projects loaded yet.</div>`;
    return;
  }
  panel.innerHTML = projectHistory.map((p) => `
    <div class="browser-entry" data-select="${escapeAttr(p)}">
      <span>${escapeHtml(p)}</span><span>&rarr;</span>
    </div>
  `).join('');
  panel.querySelectorAll('[data-select]').forEach((el) => {
    el.onclick = () => {
      projectPath = el.dataset.select;
      localStorage.setItem('agentManagerProjectPath', projectPath);
      document.getElementById('project-path-input').value = projectPath;
      lastRenderedStatusKey = null;
      historyOpen = false;
      panel.style.display = 'none';
      refreshProjectStatus();
    };
  });
}

// 8s timeout on every dashboard fetch. Without this, a request in flight during a server
// restart (or any other network hiccup) can hang indefinitely rather than reject -- and
// since enterProjectTab() awaits this before rendering anything, a single hung request
// left the whole Project tab looking normal but with no working click handlers (found live
// 2026-07-19, right after adding that pre-render status check). Every existing call site
// already wraps fetchJson in a try/catch, so a clean timeout error is handled the same way
// a network error already was -- this only changes "hangs forever" to "fails after 8s".
async function fetchJson(url) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 8000);
  let r;
  try {
    r = await fetch(url, { signal: controller.signal });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(url + ' -> timed out after 8s');
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
  if (!r.ok) throw new Error(url + ' -> ' + r.status);
  return r.json();
}

function renderTabButton(tab, indent) {
  const btn = document.createElement('button');
  btn.className = tab.key === activeTab ? 'active' : '';
  if (indent) btn.style.paddingLeft = '36px';
  const count = (tab.key === 'workers' || tab.key === 'models' || tab.key === 'joblist' || tab.key === 'deepdive') ? '' : (counts[tab.key] ?? '');
  btn.innerHTML = `<span>${tab.label}</span><span class="count">${count}</span>`;
  btn.onclick = () => {
    if (activeTab === 'project' && tab.key !== 'project') leaveProjectTab();
    if (activeTab === 'brain-dump' && tab.key !== 'brain-dump') leaveBrainDumpTab();
    activeTab = tab.key;
    renderNav();
    if (tab.key === 'project') enterProjectTab();
    else if (tab.key === 'brain-dump') enterBrainDumpTab();
    else renderMain();
  };
  return btn;
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  for (const tab of TABS) {
    if (tab.group) {
      const expanded = isGroupExpanded(tab.group);
      const header = document.createElement('button');
      header.innerHTML = `<span>${expanded ? '▾' : '▸'} ${tab.group}</span><span class="count"></span>`;
      header.onclick = () => {
        localStorage.setItem('agentManagerNavGroup_' + tab.group, expanded ? 'collapsed' : 'expanded');
        renderNav();
      };
      nav.appendChild(header);
      if (expanded) {
        for (const child of tab.children) nav.appendChild(renderTabButton(child, true));
      }
    } else {
      nav.appendChild(renderTabButton(tab, false));
    }
  }
}

function fmtAge(sec) {
  if (sec == null) return '?';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.round(sec / 60) + 'm';
  return Math.round(sec / 3600) + 'h';
}

function statusBadgeClass(status, stale) {
  if (stale) return 'bad';
  if (status === 'working' || status === 'checking') return 'ok';
  if (status === 'idle') return 'idle';
  return 'warn';
}

async function renderWorkers() {
  const instances = await fetchJson('/api/instances');
  const main = document.getElementById('main');
  const fetchedAt = Date.now();
  instances.forEach(i => { i._fetchedAtMs = fetchedAt; });
  instancesForTimers = instances;
  if (instances.length === 0) { main.innerHTML = '<div class="empty">No instances found -- is the pipeline running?</div>'; return; }
  main.innerHTML = instances.map(inst => `
    <div class="worker-card ${inst.currentTaskId ? 'clickable' : ''}" ${inst.currentTaskId ? `data-task-id="${escapeAttr(inst.currentTaskId)}"` : ''}>
      <div class="row">
        <span class="id">${inst.instanceId}</span>
        <div class="badge-col">
          <span class="badge ${statusBadgeClass(inst.status, inst.stale)}">${inst.stale ? 'STALE' : inst.status}</span>
          ${inst.stale ? `<span class="stale-timer" id="stale-timer-${inst.instanceId}"></span>` : ''}
          <span class="state-timer" id="state-timer-${inst.instanceId}">${inst.stateAgeSeconds != null ? 'in this state ' + fmtDuration(inst.stateAgeSeconds) : ''}</span>
        </div>
      </div>
      <div class="meta">
        pid ${inst.pid} · model ${inst.model || '-'} · heartbeat ${fmtAge(inst.heartbeatAgeSeconds)} ago
        ${inst.currentTaskId ? ' · working on <strong>' + inst.currentTaskId + '</strong>' + (inst.currentPass ? ' (' + inst.currentPass + ')' : '') : ''}
      </div>
    </div>
  `).join('');
  main.querySelectorAll('.worker-card[data-task-id]').forEach((card) => {
    card.onclick = () => openTaskAnywhere(card.dataset.taskId);
  });
  updateStaleTimers();
}

// Raw instance list from the last /api/instances fetch, kept around so the 1s ticking
// timer below can recompute stale duration client-side without re-polling every second.
let instancesForTimers = [];

function fmtDuration(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

// Ticks every second independent of the 5s /api/instances poll, so "stale for" reads as a
// live counter instead of jumping in 5s increments. Computed purely from lastHeartbeat +
// staleThresholdSeconds (both already on each instance) -- no extra fetch needed.
function updateStaleTimers() {
  for (const inst of instancesForTimers) {
    // State-runtime tracker: ticks for every instance that reports stateSince. Anchored
    // to the server-computed stateAgeSeconds at fetch time rather than parsing stateSince
    // locally, so a client/server clock skew can't distort the reading.
    const st = document.getElementById('state-timer-' + inst.instanceId);
    if (st && inst.stateAgeSeconds != null) {
      const elapsed = inst.stateAgeSeconds + (Date.now() - inst._fetchedAtMs) / 1000;
      st.textContent = 'in this state ' + fmtDuration(elapsed);
    }
    if (!inst.stale) continue;
    const el = document.getElementById('stale-timer-' + inst.instanceId);
    if (!el) continue;
    const staleSinceMs = new Date(inst.lastHeartbeat).getTime() + inst.staleThresholdSeconds * 1000;
    el.textContent = 'Stale for ' + fmtDuration((Date.now() - staleSinceMs) / 1000);
  }
}
setInterval(updateStaleTimers, 1000);

function fmtPct(x) { return x == null ? '-' : Math.round(x * 100) + '%'; }
function fmtNum(x, digits) { return x == null ? '-' : Number(x).toFixed(digits); }

// Sort state lives outside the function so it survives the 5s poll re-rendering the
// whole table from scratch each time (same rebuild-from-fetch pattern renderQueueTab uses).
let modelsSortKey = 'approveRate';
let modelsSortDir = 'desc';

const MODELS_COLUMNS = [
  { key: 'model', label: 'Model', sortable: false },
  { key: 'callCount', label: 'Calls', sortable: true },
  { key: 'approveRate', label: 'Approve Rate', sortable: true, bar: 'ok' },
  { key: 'avgTokensPerSec', label: 'Avg Tok/s', sortable: true, bar: 'accent' },
  { key: 'minTokensPerSec', label: 'Low Tok/s', sortable: true },
  { key: 'maxTokensPerSec', label: 'High Tok/s', sortable: true },
  { key: 'avgLatencyMs', label: 'Avg Latency (ms)', sortable: true },
  { key: 'degenerateCount', label: 'Degenerate', sortable: true },
  { key: 'errorCount', label: 'Errors', sortable: true },
];

function renderBarCell(value, max, colorVar, fmt) {
  const label = fmt(value);
  if (value == null || !max) return label;
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return `<div>${label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%; background:var(--${colorVar})"></div></div>`;
}

async function renderModelsTab() {
  const models = await fetchJson('/api/models');
  const main = document.getElementById('main');
  if (models.length === 0) { main.innerHTML = '<div class="empty">No model-call stats yet -- set ORNITH_AB_MODELS to compare candidates on the implement pass.</div>'; return; }

  const sorted = models.slice().sort((a, b) => {
    const av = a[modelsSortKey], bv = b[modelsSortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;   // nulls last regardless of direction
    if (bv == null) return -1;
    if (av < bv) return modelsSortDir === 'asc' ? -1 : 1;
    if (av > bv) return modelsSortDir === 'asc' ? 1 : -1;
    return 0;
  });

  const maxApprove = Math.max(...models.map(m => m.approveRate ?? 0));
  const maxTokS = Math.max(...models.map(m => m.avgTokensPerSec ?? 0));

  const headCells = MODELS_COLUMNS.map(col => {
    if (!col.sortable) return `<th>${col.label}</th>`;
    const arrow = modelsSortKey === col.key ? (modelsSortDir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th class="sortable" data-key="${col.key}">${col.label}${arrow}</th>`;
  }).join('');

  const rows = sorted.map((m, i) => `
    <tr class="${i === 0 ? 'top-row' : ''}">
      <td>${m.model}</td>
      <td>${m.callCount}</td>
      <td>${renderBarCell(m.approveRate, maxApprove, 'ok', fmtPct)}</td>
      <td>${renderBarCell(m.avgTokensPerSec, maxTokS, 'accent', (v) => fmtNum(v, 1))}</td>
      <td>${fmtNum(m.minTokensPerSec, 1)}</td>
      <td>${fmtNum(m.maxTokensPerSec, 1)}</td>
      <td>${fmtNum(m.avgLatencyMs, 0)}</td>
      <td>${m.degenerateCount}</td>
      <td>${m.errorCount}</td>
    </tr>
  `).join('');

  main.innerHTML = `<table><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
  main.querySelectorAll('th.sortable').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      modelsSortDir = (modelsSortKey === key && modelsSortDir === 'desc') ? 'asc' : 'desc';
      modelsSortKey = key;
      renderModelsTab();
    };
  });
}

async function renderQueueTab(state) {
  const tasks = await fetchJson('/api/queue/' + state);
  const main = document.getElementById('main');
  if (tasks.length === 0) { main.innerHTML = '<div class="empty">Nothing here.</div>'; return; }
  const rows = tasks.map(t => `
    <tr class="clickable" data-id="${t.id}" data-state="${state}">
      <td>${t.id}</td>
      <td>${t.title || ''}</td>
      <td>${t.domain || ''}/${t.source || ''}</td>
      <td>${t.blockedReason ? '<span style="color:var(--bad)">' + escapeHtml(t.blockedReason).slice(0, 80) + '</span>' : (t.branch || t.doneMarker || '')}</td>
    </tr>
  `).join('');
  main.innerHTML = `<table><thead><tr><th>ID</th><th>Title</th><th>Domain/Source</th><th>Detail</th></tr></thead><tbody>${rows}</tbody></table>`;
  main.querySelectorAll('tr.clickable').forEach(row => {
    row.onclick = () => openDetail(row.dataset.state, row.dataset.id);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTaskDetailModal(task) {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  let html = `<button class="close" onclick="closeDetail()">&times;</button><h2>${task.id}</h2>`;
  if (task._foundState) html += `<div class="field-label">Queue State</div><div>${escapeHtml(task._foundState)}</div>`;
  html += `<div><strong>${escapeHtml(task.title || '')}</strong></div>`;
  html += `<div class="field-label">Domain / Source</div><div>${task.domain || ''} / ${task.source || ''}</div>`;
  if (task.blockedReason) html += `<div class="field-label">Blocked Reason</div><div style="color:var(--bad)">${escapeHtml(task.blockedReason)}</div>`;
  if (task.branch) html += `<div class="field-label">Branch</div><div>${task.branch}</div>`;
  if (task.planResponse) html += `<div class="field-label">Plan</div><pre>${escapeHtml(task.planResponse)}</pre>`;
  if (task.implementResponse) html += `<div class="field-label">Implement</div><pre>${escapeHtml(task.implementResponse)}</pre>`;
  content.innerHTML = html;
  backdrop.classList.add('open');
}

// Static reference data, not fetched from the server -- mirrors the task sources this
// package's own src/task-sources.js registers (priority order documented there). A
// consumer project can register additional sources at priority 30/50/60; this encyclopedia
// only documents what ships with agent-manager itself.
// source values must exactly match src/task-sources.js's registerTaskSource() names --
// that's what AGENT_MANAGER_TASK_SOURCES (the isActive checkboxes below) actually lists.
// Confirmed live (2026-07-23): this table had drifted from the real registry -- missing
// brain_dump_sort entirely, and 'deadcode_triage' didn't match the real 'unused_export'
// name, which would have made that row's checkbox a silent no-op. Fixed alongside adding
// isActive, since the mismatch is exactly the kind of bug this feature would otherwise hide.
const JOB_TYPES = [
  { source: 'adhoc', domain: 'adhoc', priority: 10, description: 'Manually submitted one-off task, queued via queue-adhoc-task.js. Drop-everything priority lane.' },
  { source: 'trouble_log', domain: '(project default)', priority: 20, description: "Entries in the project's trouble-log doc flagged ready-for-agent (🤖 marker)." },
  { source: 'secondbrain', domain: 'secondbrain', priority: 40, description: 'Oldest unprocessed note in a SecondBrain-style Inbox/ folder.' },
  { source: 'brain_dump_sort', domain: 'brain_dump_sort', priority: 42, description: 'Sorts a captured Brain Dump entry into a second-brain destination and marks it filed. Always active -- sits above any single project, see the Brain Dump tab.' },
  { source: 'arch_review', domain: '(project default)', priority: 70, description: 'Strong-rated architecture candidates awaiting a fulfillment task.' },
  { source: 'arch_import_review', domain: '(project default)', priority: 71, description: 'Strong-rated architecture-IMPORT candidates (from arch_import) awaiting a fulfillment task -- same logic as arch_review, parameterized, against a separate doc.' },
  { source: 'arch_discovery', domain: '(project default)', priority: 80, description: 'Generates new architecture candidates for one graphify community at a time.' },
  { source: 'arch_import', domain: '(project default)', priority: 81, description: 'Promotes a reviewed deep_dive Use/Adapt finding into a real, agent-manager-grounded architecture-import candidate (ADR-0020): proposes search terms, a harness greps agent-manager\'s own repo, then drafts a candidate grounded in the real matches.' },
  { source: 'deep_dive', domain: 'deep_dive', priority: 82, description: 'Reviews one import-graph community at a time from a project_search Strong lead\'s cloned repo, rating each finding Use/Adapt/Ignore (ADR-0019). See the Scouted Repos tab.' },
  { source: 'project_search', domain: 'project_search', priority: 85, description: 'Proposes external open-source leads relevant to the project. Discovery-only, no auto-fulfillment.' },
  { source: 'unused_export', domain: '(project default)', priority: 90, description: 'Triages a flagged dead-code candidate (exported symbol with few call sites) as genuine-dead or false-positive.' },
];

async function renderJobListTab() {
  const main = document.getElementById('main');
  let jobTypes;
  try {
    jobTypes = await fetchJson('/api/job-types');
  } catch (e) {
    jobTypes = null;
  }
  const activeByName = {};
  const alwaysActiveByName = {};
  const priorityByName = {};
  (jobTypes || []).forEach((j) => {
    activeByName[j.name] = j.active;
    alwaysActiveByName[j.name] = j.alwaysActive;
    priorityByName[j.name] = j.priority;
  });

  // Sort by the EFFECTIVE priority (server override if any, else JOB_TYPES' static
  // default) -- not the bare static default -- so an edit actually reorders the table.
  const rows = JOB_TYPES.slice()
    .map((j) => ({ ...j, priority: priorityByName[j.source] ?? j.priority }))
    .sort((a, b) => a.priority - b.priority)
    .map(j => {
    const alwaysActive = !!alwaysActiveByName[j.source];
    const isActive = jobTypes ? (activeByName[j.source] ?? true) : true;
    const checkbox = jobTypes
      ? `<input type="checkbox" class="job-type-toggle" data-source="${escapeAttr(j.source)}" ${isActive ? 'checked' : ''} ${alwaysActive ? 'disabled title="Always active -- cannot be turned off"' : ''}>`
      : `<span class="meta">?</span>`;
    // Priority cell: click-to-type input, relying on the browser's own native number-input
    // spinner for the "up1/down1" arrows the Brain Dump request asked for -- a separate
    // pair of custom buttons above/below the input (the original implementation) was
    // redundant with that native control and looked like a duplicate widget. Disabled
    // entirely when /api/job-types failed to load, same convention the checkbox already
    // uses for that case.
    const priorityCell = jobTypes
      ? `<input type="number" class="priority-input" data-source="${escapeAttr(j.source)}" value="${j.priority}">`
      : `<span class="meta">${j.priority}</span>`;
    return `
    <tr>
      <td>${checkbox}</td>
      <td>${priorityCell}</td>
      <td>${j.source}</td>
      <td>${j.domain}</td>
      <td>${escapeHtml(j.description)}</td>
    </tr>
  `;
  }).join('');
  main.innerHTML = `<table><thead><tr><th>Active</th><th>Priority</th><th>Source</th><th>Domain</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`;

  main.querySelectorAll('.job-type-toggle').forEach((cb) => {
    cb.onchange = async () => {
      cb.disabled = true;
      try {
        await fetch('/api/job-types/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: cb.dataset.source, active: cb.checked }),
        });
      } catch (e) {
        alert('Could not update job type: ' + e.message);
        cb.checked = !cb.checked;
      }
      cb.disabled = false;
    };
  });

  // Submits a new priority for `source`, re-rendering the (now possibly re-sorted) tab
  // on success -- reverting the input's displayed value on failure rather than leaving
  // it showing an unsaved edit.
  const submitPriority = async (source, newPriority, revertTo) => {
    const controls = main.querySelectorAll(`[data-source="${CSS.escape(source)}"]`);
    controls.forEach((el) => { el.disabled = true; });
    try {
      await fetch('/api/job-types/priority', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: source, priority: newPriority }),
      });
      await renderJobListTab();
    } catch (e) {
      alert('Could not update priority: ' + e.message);
      controls.forEach((el) => { el.disabled = false; });
      const input = main.querySelector(`input.priority-input[data-source="${CSS.escape(source)}"]`);
      if (input) input.value = revertTo;
    }
  };

  main.querySelectorAll('.priority-input').forEach((input) => {
    const commit = () => {
      const parsed = parseInt(input.value, 10);
      const original = priorityByName[input.dataset.source];
      if (Number.isNaN(parsed) || parsed === original) { input.value = original; return; }
      submitPriority(input.dataset.source, parsed, original);
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
  });
}

// Scouted Repos tab (deep_dive, ADR-0019): list of every project_search Strong lead
// that's been cloned + community-graphed, click through to see what our workers picked
// out of it -- deep-dive-coverage.json's per-community progress plus the actual
// analysis/<slug>.md write-up apply-group-a.js's applyDeepDiveFindings appended.
async function renderDeepDiveTab() {
  const projects = await fetchJson('/api/deep-dive/projects');
  const main = document.getElementById('main');
  if (projects.length === 0) {
    main.innerHTML = '<div class="empty">No repos scouted yet -- project_search hasn\'t landed a Strong lead for deep_dive to pick up.</div>';
    return;
  }
  const rows = projects.map(p => `
    <tr class="clickable ${p.hotlist ? 'top-row' : ''}" data-slug="${escapeAttr(p.slug)}">
      <td onclick="event.stopPropagation()"><input type="checkbox" class="hotlist-toggle" data-slug="${escapeAttr(p.slug)}" ${p.hotlist ? 'checked' : ''} title="Move this repo to the top of the research priority list"></td>
      <td>${escapeHtml(p.slug)}</td>
      <td>${p.sourceUrl ? `<a href="${escapeAttr(p.sourceUrl)}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(p.sourceUrl)}</a>` : ''}</td>
      <td>${p.reviewedCount} / ${p.communityCount}</td>
      <td>${p.totalActionItems}</td>
      <td>${p.clonedAt ? new Date(p.clonedAt).toLocaleString() : ''}</td>
    </tr>
  `).join('');
  main.innerHTML = `<table><thead><tr><th>Hot</th><th>Project</th><th>Source</th><th>Communities Reviewed</th><th>Action Items</th><th>Cloned</th></tr></thead><tbody>${rows}</tbody></table>`;
  main.querySelectorAll('tr.clickable').forEach(row => {
    row.onclick = () => openDeepDiveDetail(row.dataset.slug);
  });

    cb.onclick = (e) => e.stopPropagation();
    cb.onchange = () => toggleHotlist(cb.dataset.slug, cb.checked);
  });
}

// Checking the box calls /api/deep-dive/projects/<slug>/hotlist, which flips a field on
// that project's deep-dive-coverage.json entry -- nextDeepDiveTask() (task-sources.js)
// reads the same field and drafts every remaining community in a hotlisted project ahead
// of the normal oldest-first rotation, regardless of how long other projects have been
// waiting. Re-renders the whole tab afterward so the row re-sorts to the top immediately
// rather than waiting for the next 5s poll.
async function toggleHotlist(slug, hotlist) {
  try {
    await fetch('/api/deep-dive/projects/' + encodeURIComponent(slug) + '/hotlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hotlist }),
    });
  } catch (e) {
    alert('Could not update hotlist: ' + e.message);
  }
  if (activeTab === 'deepdive') await renderDeepDiveTab();
}

// Cache of the last-opened project's detail response, so selecting a community can
// re-render just the items list (client-side filter) without a re-fetch.
let deepDiveDetailCache = null;

// Items written before apply-group-a.js started tagging "(community #N)" have
// communityId: null -- fall back to matching by name for those (ambiguous when multiple
// communities share a directory-based name, but still better than showing nothing).
function itemsForCommunity(items, community) {
  return items.filter((it) => (
    community.id != null && it.communityId != null
      ? it.communityId === community.id
      : it.community === community.name
  ));
}

function renderDeepDiveItems(items) {
  if (items.length === 0) return '<div class="empty">No action items for this selection.</div>';
  return items.map((it) => `
    <div class="worker-card">
      <div class="row">
        <span class="id">${escapeHtml(it.title)}</span>
        <span class="badge ${it.rating === 'Use' ? 'ok' : it.rating === 'Adapt' ? 'warn' : 'idle'}">${escapeHtml(it.rating || '')}</span>
      </div>
      <div class="meta">${escapeHtml(it.community || '')}${it.files ? ' · ' + escapeHtml(it.files) : ''}</div>
      <div style="margin-top:8px">${escapeHtml(it.rationale || '')}</div>
    </div>
  `).join('');
}

// Selected community's items render as an extra table row directly beneath the clicked
// row (an inline expansion), not in a separate section after the whole table -- clicking
// a community and then having to scroll past every other row to see its items (the
// original design) was confusing. Clicking an already-expanded row collapses it back.
function renderDeepDiveCommunityRows(detail, selectedIdx, items) {
  const rows = [];
  (detail.communities || []).forEach((c, i) => {
    const hasItems = (c.actionItemCount || 0) > 0;
    rows.push(`
      <tr class="${hasItems ? 'clickable' : ''} ${selectedIdx === i ? 'top-row' : ''}" data-community-idx="${i}">
        <td>${escapeHtml(c.name || '')}</td>
        <td>${c.lastReviewedAt ? new Date(c.lastReviewedAt).toLocaleString() : 'not yet reviewed'}</td>
        <td>${c.actionItemCount ?? '-'}</td>
      </tr>
    `);
    if (selectedIdx === i) {
      const shown = itemsForCommunity(items, { id: i, name: c.name });
      rows.push(`
        <tr>
          <td colspan="3" style="padding:0">
            <div style="padding:12px 4px 16px">
              <div class="field-label" style="margin-top:0">Ideas from "${escapeHtml(c.name)}" <a href="#" id="dd-collapse" style="margin-left:8px;font-weight:normal">(collapse)</a></div>
              ${renderDeepDiveItems(shown)}
            </div>
          </td>
        </tr>
      `);
    }
  });
  return rows.join('');
}

function renderDeepDiveDetailBody(detail, selectedIdx) {
  const items = detail.items || [];
  let html = `<div class="field-label">Communities (${(detail.communities || []).length}) -- click one with action items to see them inline</div>`;
  html += `<table><thead><tr><th>Name</th><th>Reviewed</th><th>Action Items</th></tr></thead><tbody>${renderDeepDiveCommunityRows(detail, selectedIdx, items)}</tbody></table>`;

  if (selectedIdx == null) {
    html += `<div class="field-label">All ideas picked from this repo</div>`;
    html += items.length === 0
      ? '<div class="empty">Nothing written up yet -- no community from this repo has cleared review.</div>'
      : renderDeepDiveItems(items);
  }
  return html;
}

function wireDeepDiveDetailHandlers(slug, selectedIdx) {
  document.querySelectorAll('#modal-content tr.clickable[data-community-idx]').forEach((row) => {
    const idx = Number(row.dataset.communityIdx);
    // Clicking the already-expanded row collapses it back rather than re-expanding it.
    row.onclick = () => openDeepDiveDetail(slug, idx === selectedIdx ? null : idx);
  });
  const collapse = document.getElementById('dd-collapse');
  if (collapse) collapse.onclick = (e) => { e.preventDefault(); openDeepDiveDetail(slug, null); };
}

async function openDeepDiveDetail(slug, selectedIdx = null) {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');

  // Re-opening the same project (selecting a different community) reuses the cached
  // fetch instead of re-fetching -- the underlying data can't have changed within one
  // modal session, and re-fetch would also flicker the "which row is highlighted" state.
  const detail = (deepDiveDetailCache && deepDiveDetailCache.slug === slug)
    ? deepDiveDetailCache
    : await fetchJson('/api/deep-dive/projects/' + encodeURIComponent(slug));
  deepDiveDetailCache = detail;

  let html = `<button class="close" onclick="closeDetail()">&times;</button><h2>${escapeHtml(detail.slug)}</h2>`;
  if (detail.sourceUrl) html += `<div><a href="${escapeAttr(detail.sourceUrl)}" target="_blank">${escapeHtml(detail.sourceUrl)}</a></div>`;
  html += renderDeepDiveDetailBody(detail, selectedIdx);

  content.innerHTML = html;
  backdrop.classList.add('open');
  wireDeepDiveDetailHandlers(slug, selectedIdx);
}

// --- Project tab --------------------------------------------------------------------

function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

async function enterProjectTab() {
  // Sync the path input from the server's actual active project on every tab entry, before
  // rendering it. Without this, the input only ever reflected localStorage -- if the active
  // project changed via any OTHER route (hand-editing agent-manager.env, another browser tab,
  // launch.bat) the input would silently keep showing a stale path while "Last configured
  // project" below it correctly showed the truth. Since Start Pipeline acts on the input's
  // value, not on activeRepoRoot, that mismatch could launch a pipeline against the wrong
  // project with no warning. Only overrides on tab entry, not on the 3s poll thereafter, so a
  // deliberate browse-a-different-project session isn't fought by this sync mid-use.
  try {
    const status = await fetchJson('/api/pipeline/status');
    if (status.activeRepoRoot && status.activeRepoRoot !== projectPath) {
      projectPath = status.activeRepoRoot;
      localStorage.setItem('agentManagerProjectPath', projectPath);
    }
    // Same reasoning as the path sync above: reflect whatever's actually configured
    // server-side (env file / another tab / launch.bat) rather than only ever showing
    // this browser's last local choice.
    if (typeof status.includeApply === 'boolean') {
      includeApply = status.includeApply;
      localStorage.setItem('agentManagerIncludeApply', String(includeApply));
    }
    if (typeof status.skipPush === 'boolean') {
      skipPush = status.skipPush;
      localStorage.setItem('agentManagerSkipPush', String(skipPush));
    }
  } catch (e) { /* dashboard's own status check failed -- fall back to whatever's cached */ }

  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="display:flex;flex-direction:column;height:calc(100vh - 93px);">
      <div class="path-row">
        <input id="project-path-input" type="text" placeholder="C:\\path\\to\\your\\project" value="${escapeAttr(projectPath)}" list="project-history-list" autocomplete="off">
        <datalist id="project-history-list"></datalist>
        <button class="secondary" id="history-toggle">History...</button>
        <button class="secondary" id="browse-toggle">Browse...</button>
        <button class="action" id="build-btn">Build Graph</button>
      </div>
      <div id="history-panel" class="browser-panel" style="display:none"></div>
      <div class="path-row">
        <input id="project-grepdirs-input" type="text" placeholder="src, frontend/src, backend/src (optional -- comma-separated, leave blank to scan the whole path)" value="${escapeAttr(grepDirs)}">
      </div>
      <div class="path-row" id="pipeline-toggles-row" style="gap:16px;align-items:center;">
        <label style="display:flex;align-items:center;gap:4px;font-size:0.9em;cursor:pointer;">
          <input type="checkbox" id="include-apply-toggle" ${includeApply ? 'checked' : ''}>
          Enable Apply Runner (writes/commits changes)
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:0.9em;cursor:pointer;${includeApply ? '' : 'opacity:.5;'}">
          <input type="checkbox" id="skip-push-toggle" ${!includeApply ? 'disabled' : ''} ${!skipPush ? 'checked' : ''}>
          Push approved commits to remote
        </label>
        <span class="meta" style="font-size:0.85em;">Which job types run is now controlled from the Job List tab.</span>
      </div>
      <div id="browser-panel" class="browser-panel" style="display:none"></div>
      <div id="pipeline-panel" class="worker-card"></div>
      <div id="project-status-area" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
    </div>
  `;
  lastRenderedStatusKey = null;  // fresh tab entry -- force the first poll to actually render
  document.getElementById('project-path-input').addEventListener('change', (e) => {
    projectPath = e.target.value.trim();
    localStorage.setItem('agentManagerProjectPath', projectPath);
    lastRenderedStatusKey = null;  // switched projects -- old key would wrongly suppress the new render
    refreshProjectStatus();
  });
  document.getElementById('include-apply-toggle').addEventListener('change', (e) => {
    includeApply = e.target.checked;
    localStorage.setItem('agentManagerIncludeApply', String(includeApply));
    const pushToggle = document.getElementById('skip-push-toggle');
    pushToggle.disabled = !includeApply;
    pushToggle.closest('label').style.opacity = includeApply ? '' : '.5';
    if (!includeApply) { pushToggle.checked = false; skipPush = true; localStorage.setItem('agentManagerSkipPush', 'true'); }
  });
  document.getElementById('skip-push-toggle').addEventListener('change', (e) => {
    skipPush = !e.target.checked;
    localStorage.setItem('agentManagerSkipPush', String(skipPush));
  });
  document.getElementById('browse-toggle').onclick = () => {
    browserOpen = !browserOpen;
    document.getElementById('browser-panel').style.display = browserOpen ? 'block' : 'none';
    if (browserOpen) { browsePath = projectPath || ''; loadBrowsePanel(); }
  };
  document.getElementById('history-toggle').onclick = () => {
    historyOpen = !historyOpen;
    document.getElementById('history-panel').style.display = historyOpen ? 'block' : 'none';
    if (historyOpen) renderHistoryPanel();
  };
  document.getElementById('project-grepdirs-input').addEventListener('change', (e) => {
    grepDirs = e.target.value.trim();
    localStorage.setItem('agentManagerGrepDirs', grepDirs);
  });
  document.getElementById('build-btn').onclick = triggerBuild;

  await loadProjectHistory();
  await refreshPipelineStatus();
  await refreshProjectStatus();
  projectStatusInterval = setInterval(() => { refreshPipelineStatus(); refreshProjectStatus(); }, 3000);
}

function leaveProjectTab() {
  if (projectStatusInterval) { clearInterval(projectStatusInterval); projectStatusInterval = null; }
}

async function refreshPipelineStatus() {
  const panel = document.getElementById('pipeline-panel');
  if (!panel) return;
  let status;
  try {
    status = await fetchJson('/api/pipeline/status');
  } catch (e) {
    panel.innerHTML = `<div class="row"><span>Could not check pipeline status: ${e.message}</span></div>`;
    return;
  }

  if (status.running) {
    const applyLabel = status.includeApply ? (status.skipPush ? 'Apply Runner on, no push' : 'Apply Runner on, pushing') : 'Apply Runner off';
    panel.innerHTML = `
      <div class="row">
        <span>Live pipeline running against <strong>${escapeHtml(status.activeRepoRoot || '?')}</strong> (${escapeHtml(applyLabel)})</span>
        <span class="badge ok">RUNNING</span>
      </div>
      <div class="meta"><button class="secondary" id="stop-pipeline-btn" style="margin-top:8px">Stop Pipeline</button></div>
    `;
    document.getElementById('stop-pipeline-btn').onclick = stopPipeline;
  } else if (status.activeRepoRoot) {
    panel.innerHTML = `
      <div class="row">
        <span>Last configured project: <strong>${escapeHtml(status.activeRepoRoot)}</strong></span>
        <span class="badge idle">NOT RUNNING</span>
      </div>
      <div class="meta">Browse to a folder above (or reuse this one) and click Start Pipeline.</div>
    `;
  } else {
    panel.innerHTML = `<div class="row"><span>No project configured yet.</span><span class="badge idle">IDLE</span></div>`;
  }

  // "Start Pipeline" lives next to the path input itself, not in this panel, since it
  // acts on whatever's currently in the input -- only show/enable it when nothing is
  // already running and a path is actually entered.
  let startBtn = document.getElementById('start-pipeline-btn');
  if (!startBtn) {
    startBtn = document.createElement('button');
    startBtn.id = 'start-pipeline-btn';
    startBtn.className = 'action';
    startBtn.textContent = 'Start Pipeline';
    startBtn.onclick = startPipeline;
    document.querySelector('.path-row').appendChild(startBtn);
  }
  startBtn.disabled = status.running || !projectPath;
}

async function startPipeline() {
  if (!projectPath) return;
  const btn = document.getElementById('start-pipeline-btn');
  btn.disabled = true;
  btn.textContent = 'Starting...';
  try {
    const res = await fetch('/api/pipeline/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: projectPath, includeApply, skipPush }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.reason || data.description || res.statusText);
  } catch (e) {
    alert('Could not start pipeline: ' + e.message);
  }
  btn.textContent = 'Start Pipeline';
  await loadProjectHistory();
  await refreshPipelineStatus();
}

async function stopPipeline() {
  const btn = document.getElementById('stop-pipeline-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Stopping...'; }
  try {
    await fetch('/api/pipeline/stop', { method: 'POST' });
  } catch (e) {
    alert('Could not stop pipeline: ' + e.message);
  }
  await refreshPipelineStatus();
}

async function loadBrowsePanel() {
  const panel = document.getElementById('browser-panel');
  if (!panel) return;
  panel.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const data = await fetchJson('/api/browse?path=' + encodeURIComponent(browsePath));
    let html = `<div class="browser-crumb">${data.path || 'Drives'}</div>`;
    if (data.parent) {
      html += `<div class="browser-entry" data-nav="${escapeAttr(data.parent)}"><span>.. (up)</span></div>`;
    }
    if (data.path) {
      html += `<div class="browser-entry" data-select="${escapeAttr(data.path)}" style="border-top:1px solid var(--border);margin-top:4px;padding-top:8px">
        <span><strong>Use this folder</strong></span><span>&rarr;</span></div>`;
    }
    for (const entry of data.entries) {
      html += `<div class="browser-entry" data-nav="${escapeAttr(entry.path)}">
        <span>${escapeHtml(entry.name)}</span>
        ${entry.isGitRepo ? '<span class="git-badge">git</span>' : ''}
      </div>`;
    }
    panel.innerHTML = html;
    panel.querySelectorAll('[data-nav]').forEach(el => {
      el.onclick = () => { browsePath = el.dataset.nav; loadBrowsePanel(); };
    });
    panel.querySelectorAll('[data-select]').forEach(el => {
      el.onclick = () => {
        projectPath = el.dataset.select;
        localStorage.setItem('agentManagerProjectPath', projectPath);
        document.getElementById('project-path-input').value = projectPath;
        lastRenderedStatusKey = null;  // switched projects -- old key would wrongly suppress the new render
        browserOpen = false;
        panel.style.display = 'none';
        refreshProjectStatus();
      };
    });
  } catch (e) {
    panel.innerHTML = `<div class="empty">Could not browse this path: ${e.message}</div>`;
  }
}

// Set to whatever "key" the currently-rendered #project-status-area content corresponds
// to -- refreshProjectStatus() is polled every 3s, but overwriting innerHTML unconditionally
// destroys and recreates the <iframe> even when its src is byte-identical, which restarts
// pyvis's force-directed layout simulation from scratch every single poll (confirmed live:
// looked exactly like "the graph keeps rebuilding" even though no build was actually
// running). Only touch the DOM when what SHOULD be shown has actually changed.
let lastRenderedStatusKey = null;

async function refreshProjectStatus() {
  const area = document.getElementById('project-status-area');
  const buildBtn = document.getElementById('build-btn');
  if (!area) return;
  if (!projectPath) {
    if (lastRenderedStatusKey !== 'no-path') {
      area.innerHTML = '<div class="empty">Enter or browse to a project path above to get started.</div>';
      lastRenderedStatusKey = 'no-path';
    }
    if (buildBtn) buildBtn.disabled = true;
    return;
  }

  let status;
  try {
    status = await fetchJson('/api/project/status?path=' + encodeURIComponent(projectPath) + '&grepDirs=' + encodeURIComponent(grepDirs));
  } catch (e) {
    if (lastRenderedStatusKey !== 'fetch-error') {
      area.innerHTML = `<div class="empty">${e.message}</div>`;
      lastRenderedStatusKey = 'fetch-error';
    }
    return;
  }

  if (buildBtn) buildBtn.disabled = status.build.running;

  // Building: the log genuinely needs to update every poll, but this branch never
  // contains an iframe, so unconditional re-render here is harmless.
  if (status.build.running) {
    area.innerHTML = '<div class="stat-row"><div class="stat"><strong>Building...</strong></div></div>'
      + '<div class="build-log">' + status.build.log.map(l => `<div>${escapeHtml(l)}</div>`).join('') + '</div>';
    lastRenderedStatusKey = 'building';
    return;
  }

  const key = status.build.error ? ('error:' + status.build.error)
    : status.graphExists ? ('graph:' + status.builtAt)
    : 'no-graph';
  if (key === lastRenderedStatusKey) return;  // nothing actually changed -- leave the iframe alone
  lastRenderedStatusKey = key;

  let html = '';
  if (status.build.error) {
    html = `<div class="stat-row"><div class="stat" style="color:var(--bad)"><strong>Build failed</strong>${escapeHtml(status.build.error)}</div></div>`;
  } else if (status.graphExists) {
    html = `
      <div class="stat-row">
        <div class="stat"><strong>${status.fileCount}</strong>files</div>
        <div class="stat"><strong>${status.communityCount}</strong>communities</div>
        <div class="stat"><strong>${status.builtAt ? new Date(status.builtAt).toLocaleString() : '?'}</strong>last built</div>
      </div>
      <iframe class="viz" src="/project/visualization?path=${encodeURIComponent(projectPath)}&grepDirs=${encodeURIComponent(grepDirs)}"></iframe>
    `;
  } else {
    html = '<div class="empty">No graph built yet for this project -- click Build Graph above.</div>';
  }
  area.innerHTML = html;
}

async function triggerBuild() {
  if (!projectPath) return;
  const buildBtn = document.getElementById('build-btn');
  buildBtn.disabled = true;
  try {
    const body = { path: projectPath };
    const dirs = grepDirs.split(',').map(d => d.trim()).filter(Boolean);
    if (dirs.length) body.grepDirs = dirs;
    const res = await fetch('/api/project/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.description || res.statusText);
    await loadProjectHistory();
    await refreshProjectStatus();
  } catch (e) {
    const area = document.getElementById('project-status-area');
    area.innerHTML = `<div class="empty">Could not start build: ${e.message}</div>`;
    buildBtn.disabled = false;
  }
}

// --- Brain Dump tab -------------------------------------------------------------------

function renderBrainDumpShell() {
  document.getElementById('main').innerHTML = `
    <div class="capture-row">
      <input id="bd-capture-input" placeholder="Brain dump -- capture anything" autocomplete="off">
      <button class="action" id="bd-capture-btn">Capture</button>
    </div>
    <div class="split-pane">
      <div>
        <div class="field-label">Unprocessed</div>
        <div id="bd-entries"><div class="empty">Loading...</div></div>
      </div>
      <div>
        <div class="field-label">Second Brain</div>
        <div class="browser-panel" id="bd-browser" style="max-height:220px"><div class="empty">Loading...</div></div>
        <div id="bd-file-panel"></div>
      </div>
    </div>
  `;

  const input = document.getElementById('bd-capture-input');
  const submit = async () => {
    const text = input.value.trim();
    if (!text) return;
    const btn = document.getElementById('bd-capture-btn');
    btn.disabled = true;
    try {
      await fetch('/api/brain-dump/capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      input.value = '';
      await refreshBrainDumpEntries(true);
    } catch (e) {
      alert('Could not capture: ' + e.message);
    }
    btn.disabled = false;
  };
  document.getElementById('bd-capture-btn').onclick = submit;
  input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };

  loadSecondBrainBrowser();
}

// Only one entry can be under edit at a time -- tracked globally (not per-render local
// state) so refreshBrainDumpEntries knows to render that one card as an editable input
// instead of static text, and so the periodic poll (see enterBrainDumpTab) can skip
// rebuilding the list entirely while it's set, same reasoning as brainDumpBrowsePath.
let brainDumpEditingId = null;

function renderBrainDumpEditCard(entry) {
  return `
    <div class="bd-entry" data-id="${escapeAttr(entry.id)}">
      <div class="capture-row" style="margin-bottom:0">
        <input data-edit-input="${escapeAttr(entry.id)}" value="${escapeAttr(entry.rawText)}">
      </div>
      <div class="row" style="margin-top:8px">
        <span></span>
        <span>
          <button class="action" data-save="${escapeAttr(entry.id)}">Save</button>
          <button class="secondary" data-cancel-edit="${escapeAttr(entry.id)}">Cancel</button>
        </span>
      </div>
    </div>
  `;
}

function wireBrainDumpCardHandlers(el) {
  el.querySelectorAll('[data-jump]').forEach((a) => {
    a.onclick = (e) => {
      e.preventDefault();
      const filePath = a.dataset.jump;
      const dir = filePath.includes('/') ? filePath.slice(0, filePath.lastIndexOf('/')) : '';
      brainDumpBrowsePath = dir;
      localStorage.setItem('agentManagerBrainDumpBrowsePath', brainDumpBrowsePath);
      loadSecondBrainBrowser().then(() => loadSecondBrainFile(filePath));
    };
  });

  el.querySelectorAll('[data-prioritize]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'Queuing...';
      try {
        await fetch('/api/brain-dump/' + encodeURIComponent(btn.dataset.prioritize) + '/prioritize', { method: 'POST' });
        await refreshBrainDumpEntries(true);
      } catch (e) {
        alert('Could not queue: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Process now';
      }
    };
  });

  el.querySelectorAll('[data-delete]').forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm('Delete this brain dump entry?')) return;
      try {
        await fetch('/api/brain-dump/' + encodeURIComponent(btn.dataset.delete), { method: 'DELETE' });
        await refreshBrainDumpEntries(true);
      } catch (e) {
        alert('Could not delete: ' + e.message);
      }
    };
  });

  el.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.onclick = () => {
      brainDumpEditingId = btn.dataset.edit;
      refreshBrainDumpEntries(true).then(() => {
        const input = el.querySelector(`[data-edit-input="${CSS.escape(brainDumpEditingId)}"]`);
        if (input) { input.focus(); input.select(); }
      });
    };
  });

  el.querySelectorAll('[data-cancel-edit]').forEach((btn) => {
    btn.onclick = () => {
      brainDumpEditingId = null;
      refreshBrainDumpEntries(true);
    };
  });

  el.querySelectorAll('[data-save]').forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.dataset.save;
      const input = el.querySelector(`[data-edit-input="${CSS.escape(id)}"]`);
      const text = input.value.trim();
      if (!text) return;
      btn.disabled = true;
      try {
        await fetch('/api/brain-dump/' + encodeURIComponent(id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        brainDumpEditingId = null;
        await refreshBrainDumpEntries(true);
      } catch (e) {
        alert('Could not save: ' + e.message);
        btn.disabled = false;
      }
    };
  });

  el.querySelectorAll('[data-edit-input]').forEach((input) => {
    input.onkeydown = (e) => {
      if (e.key === 'Enter') el.querySelector(`[data-save="${CSS.escape(input.dataset.editInput)}"]`).click();
      if (e.key === 'Escape') el.querySelector(`[data-cancel-edit="${CSS.escape(input.dataset.editInput)}"]`).click();
    };
  });
}

// force=true bypasses the "don't clobber an in-progress edit" guard -- used after an
// action (save/cancel/delete/prioritize) that just resolved that edit itself, as opposed
// to the periodic 5s poll (enterBrainDumpTab), which must respect it.
async function refreshBrainDumpEntries(force = false) {
  if (brainDumpEditingId && !force) return;
  const el = document.getElementById('bd-entries');
  if (!el) return;
  let entries;
  try {
    entries = await fetchJson('/api/brain-dump');
  } catch (e) {
    el.innerHTML = `<div class="empty">Could not load: ${e.message}</div>`;
    return;
  }

  if (entries.length === 0) {
    el.innerHTML = '<div class="empty">Nothing captured yet.</div>';
    return;
  }

  el.innerHTML = entries.map((entry) => (
    entry.id === brainDumpEditingId ? renderBrainDumpEditCard(entry) : renderBrainDumpCard(entry)
  )).join('');

  wireBrainDumpCardHandlers(el);
}

function renderBrainDumpCard(entry) {
  const sort = entry.sort;
  const statusBadge = entry.status === 'sorted'
    ? '<span class="badge ok">sorted</span>'
    : '<span class="badge idle">captured</span>';
  const queuedBadge = entry.queuedTaskId ? '<span class="badge warn">queued</span>' : '';
  const jump = sort && sort.secondBrainPath
    ? `<a class="jump" data-jump="${escapeAttr(sort.secondBrainPath)}" href="#">open &rarr;</a>`
    : '';
  const meta = sort
    ? `${escapeHtml(sort.category || '')}${sort.tags && sort.tags.length ? ' &middot; ' + escapeHtml(sort.tags.join(', ')) : ''}`
    : new Date(entry.capturedAt).toLocaleString();
  return `
    <div class="bd-entry" data-id="${escapeAttr(entry.id)}">
      <div class="row">
        <span class="text">${escapeHtml(entry.rawText)}</span>
        ${statusBadge}
      </div>
      <div class="row meta">
        <span>${meta}</span>
        ${jump}
      </div>
      <div class="row" style="margin-top:8px">
        <span>${queuedBadge}</span>
        <span>
          <button class="secondary" data-prioritize="${escapeAttr(entry.id)}">Process now</button>
          <button class="secondary" data-edit="${escapeAttr(entry.id)}">Edit</button>
          <button class="secondary" data-delete="${escapeAttr(entry.id)}">Delete</button>
        </span>
      </div>
    </div>
  `;
}

async function loadSecondBrainBrowser() {
  const panel = document.getElementById('bd-browser');
  if (!panel) return;
  panel.innerHTML = '<div class="empty">Loading...</div>';
  let data;
  try {
    data = await fetchJson('/api/second-brain/browse?path=' + encodeURIComponent(brainDumpBrowsePath));
  } catch (e) {
    panel.innerHTML = `<div class="empty">Could not browse: ${e.message}</div>`;
    return;
  }

  if (!data.configured) {
    panel.innerHTML = '<div class="empty">SECOND_BRAIN_DIR is not configured for the active project.</div>';
    return;
  }

  let html = `<div class="browser-crumb">${data.path ? escapeHtml(data.path) : '(root)'}</div>`;
  if (data.parent !== null) {
    html += `<div class="browser-entry" data-nav="${escapeAttr(data.parent)}"><span>.. (up)</span></div>`;
  }
  for (const entry of data.entries) {
    if (entry.isDir) {
      html += `<div class="browser-entry" data-nav="${escapeAttr(entry.path)}"><span>${escapeHtml(entry.name)}/</span></div>`;
    } else {
      const active = entry.path === brainDumpSelectedFile ? ' active' : '';
      html += `<div class="browser-entry${active}" data-file="${escapeAttr(entry.path)}"><span>${escapeHtml(entry.name)}</span></div>`;
    }
  }
  panel.innerHTML = html;

  panel.querySelectorAll('[data-nav]').forEach((el) => {
    el.onclick = () => {
      brainDumpBrowsePath = el.dataset.nav;
      localStorage.setItem('agentManagerBrainDumpBrowsePath', brainDumpBrowsePath);
      loadSecondBrainBrowser();
    };
  });
  panel.querySelectorAll('[data-file]').forEach((el) => {
    el.onclick = () => loadSecondBrainFile(el.dataset.file);
  });
}

async function loadSecondBrainFile(filePath) {
  brainDumpSelectedFile = filePath;
  const panel = document.getElementById('bd-file-panel');
  if (!panel) return;
  panel.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const data = await fetchJson('/api/second-brain/file?path=' + encodeURIComponent(filePath));
    panel.innerHTML = `<div class="field-label">${escapeHtml(filePath)}</div><div class="note-content">${escapeHtml(data.content)}</div>`;
  } catch (e) {
    panel.innerHTML = `<div class="empty">Could not read file: ${e.message}</div>`;
  }
  document.querySelectorAll('#bd-browser .browser-entry[data-file]').forEach((el) => {
    el.classList.toggle('active', el.dataset.file === filePath);
  });
}

async function enterBrainDumpTab() {
  renderBrainDumpShell();
  await refreshBrainDumpEntries();
  brainDumpEntriesInterval = setInterval(refreshBrainDumpEntries, 5000);
}

function leaveBrainDumpTab() {
  if (brainDumpEntriesInterval) { clearInterval(brainDumpEntriesInterval); brainDumpEntriesInterval = null; }
}

refresh();  // always -- populates counts + renders nav regardless of which tab is active
if (activeTab === 'project') enterProjectTab();
setInterval(refresh, 5000);

// The graph iframe's CSS box resizes correctly on window resize (flex:1 fills whatever
// space main's own flex-column layout gives it), but a box change caused by the OUTER
// page's layout doesn't reliably fire a 'resize' event -- or wake vis-network's own
// autoResize -- inside the iframe's own window (confirmed: neither fired in testing).
// The top-level window always gets a real resize event, so push the new size into the
// iframe's network directly from here instead of relying on the iframe to notice on its
// own.
window.addEventListener('resize', () => {
  const iframe = document.querySelector('iframe.viz');
  const net = iframe && iframe.contentWindow && iframe.contentWindow.network;
  if (!net) return;
  const rect = iframe.getBoundingClientRect();
  net.setSize(rect.width + 'px', rect.height + 'px');
  net.redraw();
});
</script>
