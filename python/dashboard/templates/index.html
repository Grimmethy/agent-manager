<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-manager dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a3358; --text: #e6e8eb; --muted: #8a90a0;
    --accent: #5b9dff; --ok: #4caf7d; --warn: #e0a940; --bad: #e0575c;
    /* Lighter than --accent specifically for link text -- #5b9dff reads fine for borders/
       badges/fills but is too close to --bg (#0f1115) for thin anchor text to stay
       legible at a glance (Grimmethy, 2026-08-19: "links... blend in too much with the
       background"). */
    --link: #8fc4ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  a { color: var(--link); }
  a:hover { text-decoration: underline; }
  header { padding: 14px 20px; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .pipeline-dir { color: var(--muted); font-size: 12px; }
  .layout { display: flex; }
  nav { width: 200px; padding: 16px 0; border-right: 2px solid var(--border); min-height: calc(100vh - 53px); }
  /* Chat panel (Brain Dump #153): a third flex sibling of nav/main, not a modal -- see
     app.py/chat_sessions.py for the backend. Collapsed state is a plain width/visibility
     toggle (localStorage-persisted, same convention nav-group expand/collapse already
     uses) rather than removing the element, so its own scroll position and in-progress
     draft text survive a collapse/expand cycle. */
  /* position: sticky + a real height (not min-height) pins the panel to the viewport
     regardless of how tall #main's own content gets -- min-height alone let the whole
     flex row stretch to match #main's scroll height, dragging the chat input down below
     the fold and forcing a full-page scroll just to reach it (Grimmethy, confirmed live:
     "I have to scroll to the bottom of the page to use the chat box"). overflow:hidden on
     the panel itself pushes all scrolling down into .grill-transcript, where it belongs. */
  #chat-panel { width: 380px; border-left: 2px solid var(--border); height: calc(100vh - 53px); position: sticky; top: 53px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  #chat-panel.chat-collapsed { width: 0; overflow: hidden; border-left: none; }
  .chat-header { padding: 12px 16px; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chat-header h2 { font-size: 13px; margin: 0; font-weight: 600; flex: 1; }
  /* min-height: 0 on BOTH nested flex:1 levels -- the classic flexbox trap (Grimmethy,
     confirmed live: "When I send a message... the chat scrolls all the way up to the
     beginning"): a flex item's min-height defaults to auto, which means it won't shrink
     below its OWN CONTENT's natural height even with flex:1 set. Without this, .chat-body
     and #chat-transcript both just grow to fit the whole transcript instead of staying
     fixed-height with internal scroll -- the newest messages get pushed past #chat-panel's
     own fixed, clipped (overflow:hidden) box and are invisibly cut off, while the oldest
     messages stay visible at the top. */
  .chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px; overflow: hidden; }
  /* 2026-08-26, Grimmethy: "Whenever I press enter... it resets to the top of the scroll
     instead of the bottom" -- root-caused live: #chat-transcript's own static markup
     ALREADY carries class="grill-transcript" (for exactly this flex-sizing rule), but
     grillRenderTranscript() (shared with Discuss/Grill, called by chatRender() below)
     unconditionally wraps its rows in ANOTHER "grill-transcript"-classed div -- fine for
     every OTHER caller (their container element doesn't already carry that class, so
     grillRenderTranscript's own div is the only one), but Chat alone ends up with the
     class on both #chat-transcript AND the freshly-rendered div nested one level inside
     it. Both then match the base .grill-transcript rule's own `overflow-y: auto`, so BOTH
     become independently scrollable -- the flex:1/min-height:0 sizing here means the OUTER
     one (#chat-transcript) never actually has anything to scroll (its single child fills
     it exactly), so the REAL scrolling happens on the INNER, freshly-created div instead,
     whose scrollTop chatRender() never touched (it only ever set scrollTop on the outer
     #chat-transcript) -- so every fresh render (i.e. every message, whichever way it was
     sent) left that inner div sitting at its default post-render scrollTop of 0. Targeting
     #chat-transcript by ID instead of the shared class here (rather than .grill-transcript)
     keeps this sizing rule from ALSO matching that inner div a second time; overflow:hidden
     on the outer makes it explicit that only the inner div should ever show a scrollbar.
     See chatRender()'s own comment for the matching JS-side fix. */
  .chat-body #chat-transcript { flex: 1; min-height: 0; overflow: hidden; }
  .chat-reserve-btn.active { background: var(--warn); color: #1a1300; border-color: var(--warn); }
  #chat-toggle-tab { position: fixed; right: 0; top: 70px; writing-mode: vertical-rl; background: var(--panel); border: 2px solid var(--border); border-right: none; border-radius: 6px 0 0 6px; color: var(--muted); padding: 10px 6px; cursor: pointer; font-size: 12px; z-index: 5; }
  #chat-toggle-tab:hover { color: var(--text); }
  nav button { display: flex; justify-content: space-between; width: 100%; padding: 10px 20px; background: none; border: none; color: var(--text); text-align: left; cursor: pointer; font-size: 13px; }
  nav button:hover { background: var(--panel); }
  nav button.active { background: var(--panel); border-left: 3px solid var(--accent); color: var(--accent); }
  nav .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 500; font-size: 12px; border-bottom: 2px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 2px solid var(--border); vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: rgba(76,175,125,.15); color: var(--ok); }
  .badge.warn { background: rgba(224,169,64,.15); color: var(--warn); }
  .badge.bad { background: rgba(224,87,92,.15); color: var(--bad); }
  .badge.idle { background: rgba(138,144,160,.15); color: var(--muted); }
  .badge-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  /* Brain Dump entry serial number -- a short, stable handle ("#12") to reference a
     specific entry by in conversation instead of its long slugified id. Monospace so
     digits stay visually distinct from the surrounding prose text they're prefixed to. */
  .bd-serial { font-family: monospace; font-weight: 700; color: var(--accent); }
  /* Nav sidebar tab-count severity dot (harnss UI pattern, adapted 2026-07-26): a solid
     small circle, distinct from .badge's translucent pill -- a tiny dot needs a solid
     fill to read at a glance, especially next to a bare number in the nav rail. */
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .status-dot.ok { background: var(--ok); }
  .status-dot.warn { background: var(--warn); }
  .status-dot.bad { background: var(--bad); }
  .stale-timer { color: var(--bad); font-size: 11px; font-variant-numeric: tabular-nums; }
  .state-timer { color: var(--muted, #8b949e); font-size: 11px; font-variant-numeric: tabular-nums; }
  .worker-card { background: var(--panel); border: 2px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .worker-card .row { display: flex; justify-content: space-between; align-items: center; }
  .worker-card .id { font-weight: 600; }
  .worker-model-select { margin-left: 10px; margin-right: auto; font-size: 12px; max-width: 220px; }
  .worker-card .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .worker-card.clickable { cursor: pointer; }
  .recent-tasks-list { list-style: none; padding: 0; margin: 6px 0 0; }
  .recent-tasks-list li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid var(--border); }
  .recent-tasks-list li:first-child { border-top: none; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  tr.top-row td:first-child { border-left: 2px solid var(--ok); }
  tr.needs-clarification-row td:first-child { border-left: 2px solid var(--warn); }
  tr.adhoc-awaiting-confirm-row td:first-child { border-left: 2px solid var(--bad); }
  .bar-track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .benchmark-check-grid { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; }
  .benchmark-check { font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .bench-category-group { flex-basis: 100%; }
  /* Case rows carry a trailing best/worst stats phrase (see renderCaseStats() in the JS) --
     too much text for the models list's nowrap chip layout, so each case gets its own
     wrapping block row instead. */
  .bench-category-group .benchmark-check { display: block; white-space: normal; margin-top: 3px; }
  .bench-case-stats { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .ok-text { color: var(--ok); }
  .bad-text { color: var(--bad); }
  /* Reasoning benchmark radar chart: the Responses table (the run's test prompts) sits on
     the left, the radar comparing every model across those same prompts sits to its right
     -- wrap lets it drop below on narrow viewports rather than squeezing the table. */
  .bench-responses-row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-top: 6px; }
  .bench-responses-row > .bench-responses-table { flex: 1 1 420px; min-width: 320px; }
  .bench-radar-wrap { flex: 0 0 auto; width: 320px; }
  .bench-radar-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 8px; }
  .bench-radar-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
  .bench-radar-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .bench-radar-axis-label { fill: var(--muted); font-size: 9px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 2px solid var(--border); border-radius: 10px; padding: 20px 24px; max-width: 900px; width: 100%; }
  .modal h2 { margin-top: 0; font-size: 15px; }
  .modal pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 2px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; max-height: 400px; overflow-y: auto; }
  .modal .close { float: right; cursor: pointer; color: var(--muted); background: none; border: none; font-size: 18px; }
  .field-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 14px; }
  .task-history { border-left: 2px solid var(--border); padding-left: 10px; margin-top: 4px; }
  .task-history-row { font-size: 12px; padding: 3px 0; }
  .task-history-stage { font-family: monospace; font-weight: 600; }
  .task-history-row .meta { display: inline; }
  /* Draft Attempts: one <details> per draftTask() run (draft-attempt-record.js). */
  .draft-attempt { border: 2px solid var(--border); border-radius: 6px; margin-top: 6px; padding: 0 10px; }
  .draft-attempt > summary { cursor: pointer; padding: 8px 0; font-size: 12px; font-weight: 600; list-style-position: inside; }
  .draft-attempt[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .draft-attempt .da-body { padding-bottom: 10px; }
  .da-outcome-blocked, .da-outcome-error { color: var(--bad); }
  .da-outcome-succeeded { color: var(--good, #4caf50); }
  .da-tier { font-size: 12px; padding: 4px 0; border-top: 1px dashed var(--border); margin-top: 6px; }
  .da-tier-name { font-family: monospace; font-weight: 600; }
  .da-tools { font-size: 11px; color: var(--muted); font-family: monospace; }
  .draft-attempt pre { max-height: 260px; }
  /* Work Log: full per-tier tool transcript (task._workLog, src/work-log.js) for auditing. */
  .work-log { border: 2px solid var(--border); border-radius: 6px; margin-top: 6px; padding: 0 10px; }
  .work-log > summary { cursor: pointer; padding: 8px 0; font-weight: 600; list-style-position: inside; }
  .work-log[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .wl-tier { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 4px; }
  .wl-call { font-family: monospace; font-size: 11px; padding: 2px 0; line-height: 1.5; }
  .wl-call > summary { cursor: pointer; }
  .wl-call.wl-err { color: var(--bad); }
  .wl-n { color: var(--muted); }
  .wl-tool { font-weight: 600; }
  .work-log pre { max-height: 220px; font-size: 11px; }
  /* Base state (Ornith) also gets its own look, not just the Claude state -- previously
     only .provider-toggle-claude had a distinct color, so the default Ornith state was
     visually identical to a plain .secondary button (Discuss/Edit/Delete), which is how
     a Discuss session got started against the wrong provider without anyone noticing
     (confirmed live 2026-08-17: a human-simulated test clicked Discuss right past it).
     Both states now read as "this is a mode switch," not "this is another action". */
  .provider-toggle { border-color: var(--muted); }
  .provider-toggle-claude { background: var(--accent); color: #0b1220; border-color: var(--accent); }
  #toast { position: fixed; bottom: 20px; right: 20px; max-width: 420px; padding: 10px 16px; border-radius: 8px; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 9999; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .15s ease, transform .15s ease; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.toast-error { background: var(--bad); color: #fff; }
  #toast.toast-info { background: var(--panel); color: var(--text); border: 2px solid var(--border); }
  .path-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .path-row input { flex: 1; background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-family: monospace; font-size: 13px; }
  button.action { background: var(--accent); color: #0b1220; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.action:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: var(--panel); color: var(--text); border: 2px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.danger { background: var(--bad); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.danger:disabled { opacity: .5; cursor: not-allowed; }
  .worker-filter-bar { display: flex; gap: 8px; }
  .worker-filter-bar button { background: var(--panel); color: var(--muted); border: 2px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .worker-filter-bar button.active { color: var(--accent); border-color: var(--accent); }
  .browser-panel { background: var(--panel); border: 2px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
  .browser-crumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; word-break: break-all; }
  .browser-crumb .crumb-link { color: var(--link); cursor: pointer; }
  .browser-crumb .crumb-link:hover { text-decoration: underline; }
  .browser-entry { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .browser-entry:hover { background: var(--bg); }
  .browser-entry .git-badge { font-size: 10px; color: var(--ok); border: 1px solid var(--ok); padding: 1px 6px; border-radius: 8px; }
  .browser-entry .entry-count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .browser-entry .set-active-project, .browser-entry .create-github-project { font-size: 11px; padding: 3px 9px; }
  .stat-row { display: flex; gap: 24px; margin: 14px 0; }
  .stat { color: var(--muted); font-size: 12px; }
  .stat strong { color: var(--text); font-size: 16px; display: block; }
  .build-log { background: var(--bg); border: 2px solid var(--border); border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: 12px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
  .build-log div { color: var(--muted); }
  iframe.viz { width: 100%; flex: 1; min-height: 0; border: 2px solid var(--border); border-radius: 8px; margin-top: 16px; }
  .split-pane { display: flex; gap: 16px; align-items: flex-start; }
  .split-pane > div { flex: 1; min-width: 0; }
  .capture-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .capture-row input { flex: 1; background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .bd-entry { background: var(--panel); border: 2px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .bd-entry .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bd-entry .text { font-size: 13px; }
  .bd-entry .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .bd-entry a.jump { color: var(--link); font-size: 12px; text-decoration: none; }
  .note-content { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 2px solid var(--border); border-radius: 6px; padding: 12px; font-size: 13px; max-height: 500px; overflow-y: auto; font-family: monospace; }
  .grill-transcript { max-height: 360px; overflow-y: auto; background: var(--bg); border: 2px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
  .grill-msg-role { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .grill-msg-assistant .grill-msg-role { color: var(--accent); }
  .grill-msg-text { font-size: 13px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  /* 2026-09-01 (Grimmethy: "each thinking segment to include a full blank line space
     between each other" + "time stamps to the second programmed into each thought
     segment"): transcript text is now split on blank lines into <p> blocks (see
     grillRenderTranscript) -- each gets a per-segment HH:MM:SS stamp and a full
     blank-line gap between it and the next segment. */
  .grill-msg-text p { margin: 0 0 1em 0; }
  .grill-msg-text p:last-child { margin-bottom: 0; }
  .grill-seg-ts { display: inline-block; font-size: 10px; font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 0.5em; }
  .grill-msg-user { align-self: flex-end; max-width: 85%; }
  .grill-msg-user .grill-msg-role { text-align: right; }
  .grill-msg-user .grill-msg-text { background: var(--panel); border-radius: 6px; padding: 6px 10px; }
  .grill-session .grill-answer { display: block; width: 100%; box-sizing: border-box; resize: vertical; background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-top: 10px; font-family: inherit; }
  .grill-enriched-badge { color: var(--ok); font-size: 12px; margin-top: 10px; }
  .browser-entry.active { background: var(--bg); color: var(--accent); }
  .priority-input { width: 60px; background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  .priority-input:focus { outline: 1px solid var(--accent); }

  /* Mobile layout: below this width there isn't room for the fixed 200px nav rail plus a
     380px chat panel alongside main content, so the three-column .layout collapses to a
     single column -- nav becomes a horizontally-scrollable top strip (same buttons, just
     laid out in a row instead of stacked), and the chat panel becomes a bottom sheet that
     overlays main instead of sitting beside it (it already toggles via .chat-collapsed on
     #chat-panel, so this only changes ITS geometry, not the JS that drives it). Tables are
     left as real <table> markup (JS renders them as raw HTML strings with no wrapper div to
     hang overflow on) and instead scroll horizontally inside #main itself. */
  @media (max-width: 860px) {
    header { flex-wrap: wrap; padding: 10px 14px; gap: 8px 12px; }
    header .pipeline-dir { flex-basis: 100%; }
    .layout { flex-direction: column; }
    nav { width: 100%; min-height: 0; border-right: none; border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; padding: 6px 8px; -webkit-overflow-scrolling: touch; }
    nav button { width: auto; white-space: nowrap; padding: 8px 12px; }
    nav button.active { border-left: none; border-bottom: 3px solid var(--accent); }
    main { padding: 12px; overflow-x: auto; }
    table { min-width: 560px; }
    #chat-panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: 100%; height: 65vh; border-left: none; border-top: 2px solid var(--border); z-index: 15; }
    #chat-panel.chat-collapsed { height: 0; width: 100%; border-top: none; }
    #chat-toggle-tab { writing-mode: horizontal-tb; right: 12px; top: auto; bottom: 12px; border: 2px solid var(--border); border-radius: 20px; padding: 8px 14px; }
    .worker-card .row { flex-wrap: wrap; row-gap: 6px; }
    .worker-model-select { margin-left: 0; margin-right: 0; max-width: none; width: 100%; }
    .stat-row { flex-wrap: wrap; row-gap: 10px; }
    .split-pane { flex-direction: column; }
    .path-row, .capture-row { flex-wrap: wrap; }
    .modal-backdrop { padding: 12px; }
    .modal { padding: 16px; max-width: 100%; }
    .benchmark-check-grid { gap: 4px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>agent-manager</h1>
  <span class="pipeline-dir" id="pipeline-status">loading...</span>
  <button class="action" id="global-brain-dump-btn" style="margin-left:auto" title="Capture a quick note to Brain Dump from any tab">+ Brain Dump</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="empty">Loading...</div></main>
  <aside id="chat-panel">
    <div class="chat-header">
      <h2 id="chat-title" title="Rooted at the agent-manager repo, with read/write access to every registered plugin and project repo.">System Chat</h2>
      <span id="chat-provider-container"></span>
      <button type="button" class="secondary" id="chat-reserve-btn" style="display:none" title="Hold the local model exclusively for this conversation until you turn it back off">Reserve</button>
      <button type="button" class="secondary" id="chat-new-btn" title="Start a fresh conversation">New</button>
    </div>
    <div class="chat-body">
      <div id="chat-transcript"></div>

const TAB_COUNT_SEVERITY_THRESHOLDS = {
  blocked: { bad: 1 },

  // Orange, not red -- a held task isn't broken (see 'blocked'), it's just waiting on a

let expandedWorkerId = null;

let toastHideTimer = null;
const providerChoices = {};

let chatSession = null;

// 2026-09-01 (Brain Dump "Send to Chat" fix): injects a block of plain text as a user

// model is busy serving a worker lane (the old per-entry Discuss start 404'd on

// re-rendered so the injected turn is immediately visible.
// 2026-08-24 -- caught live: clicking the header's provider toggle while a session was
// already active (the common case -- get_active_session() always has one) only changed

// does), so the very next message silently went to whichever provider the ALREADY-ACTIVE
// session was on, not the one the toggle now visually showed -- then chatRender()'s own

// the next message could silently ignore. Deliberately NOT reusing the generic

// choice with no persistent existing session to worry about) -- Chat needs this
// different, session-aware behavior.
// budget-monitor.js's own signal, unchanged here -- see /api/claude-usage's docstring
// for exactly what this is (a real rate-limit hit/reset history plus a rolling volume

// usage.estimate (Brain Dump #89, 2026-08-18) is the one exception, and it's labeled as
// exactly that -- an ESTIMATE learned from real past rate-limit hits (each one a genuine

// Code itself reports. null until at least one real hit has been observed to learn from.
async function renderModelsTab() {
  // Every fetch this tab needs -- including the benchmark panel's -- happens up front, in
  // parallel, BEFORE any DOM write (2026-08-19, Grimmethy: "I refreshed and my screen
  // still flashes"). The previous version wrote an EMPTY '<div id="benchmark-panel">'
  // placeholder first and only populated it after its own separate await chain resolved
  // (which itself wrote an empty '#benchmark-results' placeholder, populated by a THIRD
  // await) -- a real collapse-then-expand on every single 5s background refresh, not just
  // a scroll-offset problem (the earlier scrollY save/restore fix only corrected the
  // FINAL position after that flash had already been visible). Fetching everything first
  // and writing main.innerHTML exactly once eliminates the intermediate empty states
  // entirely, so there is nothing left to flash.
  const [models, usageRows, costSummary, settingsPanel, usagePanel, benchModels, benchCases, benchStatus, benchRuns] = await Promise.all([
    fetchJson('/api/models'),
    fetchJson('/api/models/usage'),
    fetchJson('/api/models/cost-summary'),
    renderClaudeSettingsPanel(),
    renderClaudeUsagePanel(),
    benchmarkModelsCache || fetchJson('/api/benchmark/models').then(r => { benchmarkModelsCache = r.ollamaModels || []; return benchmarkModelsCache; }),
    benchmarkCasesCache || fetchJson('/api/benchmark/cases').then(r => { benchmarkCasesCache = r; return r; }),
    fetchJson('/api/benchmark/status'),
    fetchJson('/api/benchmark/runs'),
  ]);
  if (benchmarkSelectedModels.size === 0 && benchmarkSelectedCases.size === 0) {
    benchModels.forEach(m => benchmarkSelectedModels.add(m));
    benchCases.forEach(c => benchmarkSelectedCases.add(c.id));
  }
  // Default to the combined view across every saved run (2026-08-24, Grimmethy: "results
  // should default to All Runs (combined)") -- was defaulting to just the single most
  // recent run, which is also why the radar chart (aggregate-only per the same request
  // earlier today) wasn't visible without a manual dropdown click.
  const viewingRunId = benchmarkViewingRunId || (benchRuns.length > 0 ? BENCHMARK_ALL_RUNS_ID : null);
  const benchResultsHtml = await buildBenchmarkResultsHtml(viewingRunId, benchRuns);
  const benchmarkPanelHtml = buildBenchmarkPanelHtml(benchModels, benchCases, benchStatus, benchRuns, viewingRunId, benchResultsHtml);

  const main = document.getElementById('main');

  const sorted = models.slice().sort((a, b) => {
    const av = a[modelsSortKey], bv = b[modelsSortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;   // nulls last regardless of direction
    if (bv == null) return -1;
    if (av < bv) return modelsSortDir === 'asc' ? -1 : 1;
    if (av > bv) return modelsSortDir === 'asc' ? 1 : -1;
    return 0;
  });

  const maxApprove = Math.max(...models.map(m => m.approveRate ?? 0), 0);
  const maxTokS = Math.max(...models.map(m => m.avgTokensPerSec ?? 0), 0);

  const headCells = MODELS_COLUMNS.map(col => {
    if (!col.sortable) return `<th>${col.label}</th>`;
    const arrow = modelsSortKey === col.key ? (modelsSortDir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th class="sortable" data-key="${col.key}">${col.label}${arrow}</th>`;
  }).join('');

  const rows = sorted.map((m, i) => `
    <tr class="${i === 0 ? 'top-row' : ''}">
      <td>${m.model}</td>
      <td>${m.callCount}</td>
      <td>${renderBarCell(m.approveRate, maxApprove, 'ok', fmtPct)}</td>
      <td>${renderBarCell(m.avgTokensPerSec, maxTokS, 'accent', (v) => fmtNum(v, 1))}</td>
      <td>${fmtNum(m.minTokensPerSec, 1)}</td>
      <td>${fmtNum(m.maxTokensPerSec, 1)}</td>
      <td>${fmtNum(m.avgLatencyMs, 0)}</td>
      <td>${m.degenerateCount}</td>
      <td>${m.errorCount}</td>
      <td>${fmtUsd(m.totalCostUsd)}</td>
    </tr>
  `).join('');

  const implementTable = models.length === 0
    ? '<div class="empty">No implement-pass stats yet -- set AGENT_MANAGER_CLAUDE_SOURCES or ORNITH_AB_MODELS to compare candidates.</div>'
    : `<table><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;

  // Estimated Anthropic API Cost (2026-08-23, Grimmethy: "Do we have any way of knowing
  // how much these tasks would cost using anthropic API?") -- claude-client.js's call()
  // has always computed a real per-call cost estimate (Claude Code CLI's own
  // total_cost_usd, against real Anthropic API pricing) but nothing stored or surfaced
  // it until now. Explicitly labeled "estimate, not a bill" -- every real call here runs
  // under a Claude subscription, never pay-per-token, so this is what the SAME work
  // would have cost on the API, not what was actually charged.
  const mostRecentDay = costSummary.byDay && costSummary.byDay[0] ? costSummary.byDay[0] : null;
  // hypothetical (2026-08-23, Grimmethy: "Clarification on the anthropic costs. I'd like
  // estimates for if we had used the API. Even if we used the local models.") -- unlike
  // totalCostUsd above (real spend, only real Claude calls contribute), this covers
  // EVERY call, local ones included (a token-based estimate via anthropic-pricing.js for
  // those) -- see api_models_cost_summary's own docstring.
  const hyp = costSummary.hypothetical || { totalCostUsd: 0, totalCalls: 0 };
  const costWidget = `
    <div class="grill-session" style="margin-bottom:16px">
      <div class="field-label">Estimated Anthropic API Cost</div>
      <div class="row" style="gap:24px;margin-top:6px">
        <div class="stat" title="What every recorded Claude call would have cost on real Anthropic API pricing -- these calls actually ran under a subscription, never billed per-token. An estimate of avoided/equivalent cost, not a bill."><strong>${fmtUsd(costSummary.totalCostUsd)}</strong>real spend (all time)</div>
        <div class="stat"><strong>${costSummary.callsWithCost}</strong>Claude calls</div>
        <div class="stat" title="Local Ollama calls -- genuinely free, not just unbilled."><strong>${costSummary.freeCalls}</strong>free (local) calls</div>
        ${mostRecentDay ? `<div class="stat"><strong>${fmtUsd(mostRecentDay.totalCost)}</strong>${escapeHtml(mostRecentDay.day)} (${mostRecentDay.calls} call(s))</div>` : ''}
      </div>
      <div class="row" style="gap:24px;margin-top:6px">
        <div class="stat" title="What EVERY call this pipeline has ever made -- including the ones that ran locally, free -- would have cost had it gone through the Anthropic API instead. Real Claude calls use their real cost; local calls are a token-based estimate."><strong>${fmtUsd(hyp.totalCostUsd)}</strong>if every call had used the API (${hyp.totalCalls} call(s))</div>
      </div>
    </div>`;

  const usageTableRows = usageRows.map(r => `
    <tr>
      <td>${escapeHtml(r.model)}</td>
      <td>${escapeHtml(r.stage)}</td>
      <td>${r.callCount}</td>
      <td>${fmtNum(r.avgLatencyMs, 0)}</td>
      <td>${r.lastUsedAt ? new Date(r.lastUsedAt).toLocaleString() : ''}</td>
    </tr>
  `).join('');
  const usageTable = usageRows.length === 0 ? '' : `
    <div class="field-label" style="margin-top:20px">All Calls (every stage, both providers)</div>
    <table><thead><tr><th>Model</th><th>Stage</th><th>Calls</th><th>Avg Latency (ms)</th><th>Last Used</th></tr></thead>
    <tbody>${usageTableRows}</tbody></table>`;

  // Scroll-position preservation on top of the single-write fix above: the generic 5s
  // refresh() cycle (see its own comment near setInterval(refresh, 5000)) still re-renders
  // this whole tab on a timer regardless of what the user is doing on it, so restoring
  // window.scrollY keeps their reading position stable across a background refresh they
  // didn't ask for, even though the write itself no longer has an empty intermediate state.
  const scrollY = window.scrollY;
  main.innerHTML = settingsPanel + usagePanel + costWidget + '<div class="field-label">Implement-Pass Quality</div>' + implementTable + usageTable
    + benchmarkPanelHtml;
  wireClaudeSettingsPanel();
  main.querySelectorAll('th.sortable').forEach(th => {

  window.scrollTo(0, scrollY);

// Reasoning benchmark (Models tab, 2026-08-19): pick models + test cases + a run count,
// launch src/reasoning-bench.js as a detached background process (python/dashboard/app.py's
// api_benchmark_run), and watch it progress. Every response is saved under SECOND_BRAIN_DIR
// (see reasoning-bench.js's own header) and readable here via the SAME renderTaskDetailModal
// the Job List tabs already use for a real pipeline task -- no separate detail viewer.
//
// Every function below BUILDS an HTML string from already-fetched data -- none of them
// fetch-then-write their own slice of the DOM independently. renderModelsTab() gathers
// every input (including these) in one upfront Promise.all and performs exactly one
// main.innerHTML write. See that function's own comment for why: the previous version's
// three separate fetch-then-write stages (panel, then results, each starting from an
// EMPTY placeholder div) was a real collapse-then-expand on every 5s background refresh.
let benchmarkModelsCache = null;
let benchmarkCasesCache = null;
const benchmarkSelectedModels = new Set();
const benchmarkSelectedCases = new Set();
let benchmarkViewingRunId = null; // null == "show the most recent run"; '__all__' == combined view across every saved run

const BENCHMARK_ALL_RUNS_ID = '__all__';

function buildBenchmarkPanelHtml(models, cases, status, runs, viewingRunId, resultsHtml) {
  const running = status.status === 'running';
  const categories = [...new Set(cases.map(c => c.category))];

  const modelChecks = models.map(m => `
    <label class="benchmark-check"><input type="checkbox" class="bench-model-check" value="${escapeAttr(m)}" ${benchmarkSelectedModels.has(m) ? 'checked' : ''} ${running ? 'disabled' : ''}> ${escapeHtml(m)}</label>
  `).join('');

  // stats (best/worst scoring model pooled across every saved run, see app.py's
  // _compute_case_stats) render inline next to each case -- one row per case rather than
  // the models list's wrapped chip grid, since there's no room for this much text in a chip.
  const renderCaseStats = (c) => {
    if (!c.stats) return '';
    const { best, worst } = c.stats;
    const pct = (s) => `${Math.round(s.score * 100)}%`;
    return ` <span class="bench-case-stats">best: <strong class="ok-text">${escapeHtml(best.model)}</strong> (${pct(best)}) &middot; worst: <strong class="bad-text">${escapeHtml(worst.model)}</strong> (${pct(worst)})</span>`;
  };

  const caseChecks = categories.map(cat => `
    <div class="bench-category-group">
      <div class="meta" style="margin-top:6px"><strong>${escapeHtml(cat)}</strong></div>
      ${cases.filter(c => c.category === cat).map(c => `
        <div class="benchmark-check"><input type="checkbox" class="bench-case-check" value="${escapeAttr(c.id)}" ${benchmarkSelectedCases.has(c.id) ? 'checked' : ''} ${running ? 'disabled' : ''}> <a href="#" class="bench-case-info" data-case-id="${escapeAttr(c.id)}" title="Click for what this test measures and its full prompt">${escapeHtml(c.id)}</a>${c.grader === 'judge' ? ' <span class="badge warn" title="Graded by a Claude subscription call, not auto-checkable">judge</span>' : ''}${renderCaseStats(c)}</div>
      `).join('')}
    </div>
  `).join('');

  const progressHtml = running ? `
    <div class="grill-session" style="margin-top:10px">
      <div class="field-label">Running: ${escapeHtml(status.runId)}</div>
      <div>${status.completedSteps}/${status.totalSteps} steps${status.currentModel ? ` -- currently ${escapeHtml(status.currentModel)} :: ${escapeHtml(status.currentCase || '')}` : ''}</div>
      <div class="bar-track" style="margin-top:6px"><div class="bar-fill" style="width:${status.totalSteps ? Math.round(100 * status.completedSteps / status.totalSteps) : 0}%; background:var(--accent)"></div></div>
    </div>` : '';

  // "All Runs (combined)" (2026-08-19, Grimmethy: "I only see 2 runs... we should have run
  // 3 times each now") -- the underlying data was always complete (every saved run's
  // responses pool correctly into the case picker's best/worst stats above), but the
  // Responses table below is scoped to ONE selected run by design (that's what "a run" IS
  // -- one invocation, N cases x M repeats), so after running the same model in two
  // separate invocations there was no single place to see every response from both at
  // once. This pseudo-run option covers that.
  const runOptions = [`<option value="${BENCHMARK_ALL_RUNS_ID}" ${viewingRunId === BENCHMARK_ALL_RUNS_ID ? 'selected' : ''}>All Runs (combined)</option>`]
    .concat(runs.map(r => `<option value="${escapeAttr(r.runId)}" ${viewingRunId === r.runId ? 'selected' : ''}>${escapeHtml(r.runId)} (${r.models.length} model${r.models.length === 1 ? '' : 's'}, ${r.caseIds.length} case${r.caseIds.length === 1 ? '' : 's'}, ${r.runs} run${r.runs === 1 ? '' : 'x'})</option>`))
    .join('');
  const runPicker = runs.length === 0 ? '<div class="empty">No saved benchmark runs yet.</div>' : `
    <select id="benchmark-run-picker">${runOptions}</select>`;

  return `
    <div class="field-label" style="margin-top:24px">Reasoning Benchmark</div>
    <div class="grill-session">
      <div class="meta">Compare local models on a fixed battery of reasoning probes (misdirection traps, logic puzzles, code tracing, planning, quantitative -- plus open-ended reasoning cases scored by a Claude judge call). Every response is saved to Second Brain and browsable below, same as any other task.</div>
      <div style="margin-top:10px"><strong>Models</strong> (<a href="#" id="bench-models-all">all</a> / <a href="#" id="bench-models-none">none</a>)</div>
      <div class="benchmark-check-grid">${modelChecks || '<div class="empty">No local Ollama models found.</div>'}</div>
      <div style="margin-top:10px"><strong>Test Cases</strong> (<a href="#" id="bench-cases-all">all</a> / <a href="#" id="bench-cases-none">none</a>)</div>
      <div class="benchmark-check-grid">${caseChecks}</div>
      <div class="row" style="margin-top:10px;align-items:center;gap:10px">
        <label>Runs per case <input type="number" id="bench-runs-input" min="1" max="20" value="1" style="width:60px" ${running ? 'disabled' : ''}></label>
        <label><input type="checkbox" id="bench-judge-input" ${running ? 'disabled' : ''}> Include judge-graded cases (uses Claude subscription)</label>
        <button type="button" class="action" id="bench-run-btn" ${running ? 'disabled' : ''}>${running ? 'Running...' : 'Run Benchmark'}</button>
      </div>
      ${progressHtml}
    </div>
    <div class="field-label" style="margin-top:20px">Results</div>
    <div style="margin-bottom:10px">${runPicker}</div>
    <div id="benchmark-results">${resultsHtml}</div>
  `;
}

// Fetches whatever the results section needs and returns its HTML -- called from
// renderModelsTab() BEFORE the single main.innerHTML write, never independently.
async function buildBenchmarkResultsHtml(viewingRunId, runs) {
  if (!viewingRunId) return '<div class="empty">No saved benchmark runs yet.</div>';
  if (viewingRunId === BENCHMARK_ALL_RUNS_ID) {
    const fetched = await Promise.all(runs.map(r => fetchJson(`/api/benchmark/runs/${encodeURIComponent(r.runId)}`).catch(() => null)));
    return buildAllRunsResultsHtml(fetched.filter(Boolean));
  }
  let run;
  try {
    run = await fetchJson(`/api/benchmark/runs/${encodeURIComponent(viewingRunId)}`);
  } catch (e) {
    return `<div class="empty">Could not load run: ${escapeHtml(e.message)}</div>`;
  }
  return buildSingleRunResultsHtml(run);
}

function buildSingleRunResultsHtml(run) {
  const models = run.models;
  const categories = [...new Set(run.results.map(r => r.category))];

  // Per-category pass-rate bars, one row per model -- same renderBarCell() the
  // Implement-Pass Quality table above already uses, so this reads as one visual system
  // rather than a bolted-on second chart style.
  const chartRows = categories.map(cat => {
    const cells = models.map(m => {
      const row = run.summary[m]?.byCategory?.[cat];
      if (!row) return '<td></td>';
      const pct = row.objectivePassRate != null ? row.objectivePassRate * 100 : (row.judgeAvg != null ? row.judgeAvg * 100 : null);
      const label = row.objective || (row.judgeAvg != null ? `judge ${row.judgeAvg.toFixed(2)}` : 'n/a');
      return `<td>${pct != null ? renderBarCell(pct, 100, 'ok', () => label) : label}</td>`;
    }).join('');
    return `<tr><td>${escapeHtml(cat)}</td>${cells}</tr>`;
  }).join('');
  const chartTable = `<table><thead><tr><th>Category</th>${models.map(m => `<th>${escapeHtml(m)}</th>`).join('')}</tr></thead><tbody>${chartRows}</tbody></table>`;

  const perfRows = models.map(m => {
    const s = run.summary[m] || {};
    return `<tr>
      <td>${escapeHtml(m)}</td>
      <td>${s.objectivePassed ?? '-'}/${s.objectiveTotal ?? '-'}</td>
      <td>${s.judgeTotal ? `${(s.avgJudgeScore ?? 0).toFixed(2)} (${s.judgeCount}/${s.judgeTotal})` : '-'}</td>
      <td>${s.degenerateCount ?? '-'}</td>
      <td>${fmtNum(s.avgLatencyMs, 0)}</td>
      <td>${s.avgTokensPerSec != null ? fmtNum(s.avgTokensPerSec, 1) : '-'}</td>
      <td>${s.loadDurationMs != null ? fmtNum(s.loadDurationMs, 0) : '-'}</td>
      <td>${s.unloadDurationMs != null ? fmtNum(s.unloadDurationMs, 0) : '-'}</td>
    </tr>`;
  }).join('');
  const perfTable = `<table><thead><tr><th>Model</th><th>Objective</th><th>Judge Avg</th><th>Degenerate</th><th>Avg Latency (ms)</th><th>Avg Tok/s</th><th>Load (ms)</th><th>Unload (ms)</th></tr></thead><tbody>${perfRows}</tbody></table>`;

  const responseTable = buildResponseTable(run.results.map(r => ({ ...r, runId: run.runId })));
  const radarHtml = models.length > 1 ? buildBenchmarkRadarHtml(models, run.results) : '';

  return `
    <div class="meta">Run ${escapeHtml(run.runId)} -- ${run.generatedAt ? new Date(run.generatedAt).toLocaleString() : ''}</div>
    <div class="field-label" style="margin-top:10px">Pass Rate by Category</div>
    ${chartTable}
    <div class="field-label" style="margin-top:16px">Performance</div>
    ${perfTable}
    <div class="field-label" style="margin-top:16px">Responses (click to view full prompt/response)</div>
    <div class="bench-responses-row">
      <div class="bench-responses-table">${responseTable}</div>
      ${radarHtml}
    </div>
  `;
}

// Fixed-order categorical hues (dark-surface steps, see the dataviz skill's reference
// palette) -- assigned by each model's position in the run's own model list, never by
// score/rank, so a model keeps its color across re-renders instead of repainting when
// another model's score changes.
const BENCH_RADAR_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];

function benchRadarColorFor(index) {
  return BENCH_RADAR_COLORS[index % BENCH_RADAR_COLORS.length];
}

// One 0.0-1.0 score per response, same rule as app.py's _case_result_score: a judge's own
// score wins when present, otherwise an objective pass/fail becomes 1.0/0.0, otherwise
// (ungraded/ambiguous) excluded from the average rather than counted as a 0.
function benchResultScore(r) {
  const grade = r.grade || {};
  if (grade.score != null) return grade.score;
  if (grade.pass === true) return 1;
  if (grade.pass === false) return 0;
  return null;
}

// Radar/spider chart: one axis per test case in this run, one polygon per model, plotting
// each model's average score (0-1) on that case -- "how each model performed relative to
// each other on the prompts" (2026-08-24). Model key renders ABOVE the chart per spec,
// using the same fixed per-model color the polygon strokes/fills use, so identity is never
// carried by color alone (the legend labels it too).
function buildBenchmarkRadarHtml(models, results) {
  // {caseId: {model: [scores...]}}
  const byCase = new Map();
  for (const r of results) {
    const score = benchResultScore(r);
    if (score == null) continue;
    if (!byCase.has(r.caseId)) byCase.set(r.caseId, new Map());
    const byModel = byCase.get(r.caseId);
    if (!byModel.has(r.model)) byModel.set(r.model, []);
    byModel.get(r.model).push(score);
  }
  const caseIds = [...byCase.keys()];
  if (caseIds.length < 3) return ''; // a radar needs at least 3 axes to read as a shape

  const seriesByModel = models.map((model, i) => ({
    model,
    color: benchRadarColorFor(i),
    values: caseIds.map(caseId => {
      const scores = byCase.get(caseId)?.get(model);
      return scores && scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
    }),
  }));

  const legend = `<div class="bench-radar-legend">${seriesByModel.map(s => `
    <span class="bench-radar-legend-item"><span class="bench-radar-swatch" style="background:${s.color}"></span>${escapeHtml(s.model)}</span>
  `).join('')}</div>`;

  return `
    <div class="bench-radar-wrap">
      ${legend}
      ${buildRadarChartSvg(caseIds, seriesByModel)}
    </div>
  `;
}

function buildRadarChartSvg(axisLabels, seriesByModel) {
  const size = 300;
  const center = size / 2;
  const radius = size / 2 - 46; // leave room for axis labels around the rim
  const n = axisLabels.length;
  const angleFor = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pointAt = (i, frac) => {
    const a = angleFor(i);
    return [center + radius * frac * Math.cos(a), center + radius * frac * Math.sin(a)];
  };

  const ringSteps = [0.25, 0.5, 0.75, 1];
  const rings = ringSteps.map(frac => {
    const pts = axisLabels.map((_, i) => pointAt(i, frac).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#2c2c2a" stroke-width="1"></polygon>`;
  }).join('');

  const spokes = axisLabels.map((_, i) => {
    const [x, y] = pointAt(i, 1);
    return `<line x1="${center}" y1="${center}" x2="${x}" y2="${y}" stroke="#383835" stroke-width="1"></line>`;
  }).join('');

  const labels = axisLabels.map((label, i) => {
    const [x, y] = pointAt(i, 1.14);
    const short = label.length > 16 ? `${label.slice(0, 15)}…` : label;
    const anchor = Math.abs(Math.cos(angleFor(i))) < 0.15 ? 'middle' : (Math.cos(angleFor(i)) > 0 ? 'start' : 'end');
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" class="bench-radar-axis-label"><title>${escapeHtml(label)}</title>${escapeHtml(short)}</text>`;
  }).join('');

  const polygons = seriesByModel.map(s => {
    const pts = s.values.map((v, i) => pointAt(i, v == null ? 0 : v).join(',')).join(' ');
    const dots = s.values.map((v, i) => {
      if (v == null) return '';
      const [x, y] = pointAt(i, v);
      return `<circle cx="${x}" cy="${y}" r="3" fill="${s.color}"><title>${escapeHtml(s.model)}: ${Math.round(v * 100)}%</title></circle>`;
    }).join('');
    return `<polygon points="${pts}" fill="${s.color}" fill-opacity="0.12" stroke="${s.color}" stroke-width="2"></polygon>${dots}`;
  }).join('');

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${rings}${spokes}${polygons}${labels}</svg>`;
}

// Combined view across every saved run -- no re-aggregated perf table (that would mean
// re-implementing reasoning-bench.js's summarize() a second time in browser JS just to
// merge per-run summaries; the case picker's best/worst stats above already give the
// pooled-across-all-runs verdict). The radar IS included here (Grimmethy, 2026-08-24:
// "I'd prefer it to be aggregate data" -- the single-run radar mostly came up empty since
// no saved run happened to compare 2+ models across 3+ cases at once, even though the
// SAME model pair had, in aggregate, plenty of overlapping case coverage across separate
// runs): buildBenchmarkRadarHtml already scores off a flat results array grouped by
// caseId+model, so pooling every run's results into one array before calling it is a
// straight rename of the same call the single-run view already makes, not a second
// re-aggregation path.
function buildAllRunsResultsHtml(runsData) {
  if (runsData.length === 0) return '<div class="empty">No saved benchmark runs yet.</div>';
  const allResults = runsData.flatMap(run => run.results.map(r => ({ ...r, runId: run.runId })))
    .sort((a, b) => (a.model === b.model ? a.caseId.localeCompare(b.caseId) : a.model.localeCompare(b.model)));
  const totalRuns = runsData.length;
  const allModels = [...new Set(runsData.flatMap(run => run.models))].sort();
  const radarHtml = allModels.length > 1 ? buildBenchmarkRadarHtml(allModels, allResults) : '';
  return `
    <div class="meta">${allResults.length} response${allResults.length === 1 ? '' : 's'} across ${totalRuns} saved run${totalRuns === 1 ? '' : 's'}.</div>
    <div class="field-label" style="margin-top:16px">Responses (click to view full prompt/response)</div>
    <div class="bench-responses-row">
      <div class="bench-responses-table">${buildResponseTable(allResults)}</div>
      ${radarHtml}
    </div>
  `;
}

function buildResponseTable(rows) {
  const responseRows = rows.map(r => {
    const verdict = r.grade.pass === true ? '<span class="badge ok">PASS</span>' : r.grade.pass === false ? '<span class="badge bad">FAIL</span>' : '<span class="badge">ungraded</span>';
    const id = `${r.model.replace(/[^a-zA-Z0-9._-]+/g, '-').replace(/^-+|-+$/g, '')}__${r.caseId}__run${r.runIndex}`;
    return `<tr class="worker-card" data-bench-response="${escapeAttr(id)}" data-bench-run="${escapeAttr(r.runId)}" style="cursor:pointer">
      <td>${escapeHtml(r.model)}</td><td>${escapeHtml(r.caseId)}</td><td>${r.runIndex}</td><td>${verdict}</td>
      <td>${fmtNum(r.latencyMs, 0)}ms</td><td>${r.metrics.tokensPerSecond != null ? fmtNum(r.metrics.tokensPerSecond, 1) : '-'}</td>
    </tr>`;
  }).join('');
  return `<table><thead><tr><th>Model</th><th>Case</th><th>Run</th><th>Result</th><th>Latency</th><th>Tok/s</th></tr></thead><tbody>${responseRows}</tbody></table>`;
}

function wireBenchmarkPanel(models, cases) {
  document.querySelectorAll('.bench-model-check').forEach(cb => {
    cb.onchange = () => { cb.checked ? benchmarkSelectedModels.add(cb.value) : benchmarkSelectedModels.delete(cb.value); };
  });
  document.querySelectorAll('.bench-case-check').forEach(cb => {
    cb.onchange = () => { cb.checked ? benchmarkSelectedCases.add(cb.value) : benchmarkSelectedCases.delete(cb.value); };
  });
  document.querySelectorAll('.bench-case-info').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const kase = cases.find(c => c.id === a.dataset.caseId);
      if (kase) renderCaseInfoModal(kase);
    };
  });
  const bindAllNone = (allId, noneId, set, values) => {
    document.getElementById(allId).onclick = (e) => { e.preventDefault(); values.forEach(v => set.add(v)); renderModelsTab(); };
    document.getElementById(noneId).onclick = (e) => { e.preventDefault(); set.clear(); renderModelsTab(); };
  };
  bindAllNone('bench-models-all', 'bench-models-none', benchmarkSelectedModels, models);
  bindAllNone('bench-cases-all', 'bench-cases-none', benchmarkSelectedCases, cases.map(c => c.id));

  const runBtn = document.getElementById('bench-run-btn');
  if (runBtn) {
    runBtn.onclick = async () => {
      const runs = Math.max(1, Math.min(20, Number(document.getElementById('bench-runs-input').value) || 1));
      const includeJudge = document.getElementById('bench-judge-input').checked;
      try {
        const resp = await fetch('/api/benchmark/run', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ models: [...benchmarkSelectedModels], caseIds: [...benchmarkSelectedCases], runs, includeJudge }),
        });
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          throw new Error(body.description || `${resp.status}`);
        }
        const data = await resp.json();
        benchmarkViewingRunId = data.runId;
        await renderModelsTab();
      } catch (e) {
        alert('Could not start benchmark: ' + e.message);
      }
    };
  }
  const picker = document.getElementById('benchmark-run-picker');
  if (picker) {
    picker.onchange = () => { benchmarkViewingRunId = picker.value; renderModelsTab(); };
  }
  document.querySelectorAll('[data-bench-response]').forEach(row => {
    row.onclick = async () => {
      try {
        const task = await fetchJson(`/api/benchmark/response/${encodeURIComponent(row.dataset.benchRun)}/${encodeURIComponent(row.dataset.benchResponse)}`);
        renderTaskDetailModal(task);
      } catch (e) {
        alert('Could not load response: ' + e.message);
      }
    };
  });
}

// anyway; closeDetail() (wired to the backdrop click-outside handler at module load)
// closes this one too for free.
// Global "+ Brain Dump" header button (available on every tab, not just the Brain Dump
// tab itself) -- reuses the same #modal-backdrop/#modal-content + closeDetail() plumbing
// renderCaseInfoModal does, and posts to the same /api/brain-dump/capture endpoint the
// in-tab capture row (renderBrainDumpShell) uses, so entries land in the same place either

// Manual archive/requeue (Job Status > Blocked/Done tabs) and manual apply (Approved tab,
// three-tier approval mode, 2026-07-26) -- per-row action buttons on renderQueueTab's
// generic table, the same POST-then-rerender-then-alert-on-failure pattern the second
// brain's set-active-project/create-github-project buttons already use. event.stopPropagation()
// is load-bearing: the row's own onclick (openDetail) must not also fire when a button
// inside that row is clicked.
// Incremental loading (2026-07-26, Grimmethy: "long task lists take a while to load,
// we should do incremental loading, 10 at a time, expanding as the user scrolls to the
// bottom"). queueLoadedCount/queueHasMore persist per-state across the generic 5s
// refresh() poll and across tab switches (switching away and back keeps your scroll
// depth) -- only a full page reload resets them to the first page.
const QUEUE_PAGE_SIZE = 10;
const QUEUE_STATE_TABS = ['drafting', 'pending', 'review', 'approved', 'blocked', 'needs-clarification', 'awaiting-confirm', 'coordinating', 'done'];
const queueLoadedCount = {};
const queueHasMore = {};
let queueLoadInFlight = false;

// Task-type filter (Job Status > Done, 2026-08-17: "Done is getting huge, need to
// filter by task type"). Per-state so switching tabs doesn't carry a filter over to an
// unrelated list; '' means unfiltered. Options come from /api/job-types (same source
// catalog the Job List tab's own rows are built from) fetched once and cached module-
// scope -- it barely changes, and re-fetching on every 5s poll would be wasteful for a
// dropdown that just needs the name list.
const queueSourceFilter = {};
let allSourceNamesPromise = null;
window.addEventListener('scroll', () => {
  if (!QUEUE_STATE_TABS.includes(activeTab)) return;
  if (!queueHasMore[activeTab] || queueLoadInFlight) return;
  if (window.innerHeight + window.scrollY < document.body.offsetHeight - 200) return;
  queueLoadedCount[activeTab] = (queueLoadedCount[activeTab] || QUEUE_PAGE_SIZE) + QUEUE_PAGE_SIZE;
  renderQueueTab(activeTab);
});

// State -> .badge severity class, same ok/warn/bad/idle vocabulary the Workers/Models
// tabs already use (see .badge CSS) -- reusing it here rather than inventing a second
// color language for what's still just "where is this task in the pipeline."
async function renderAdhocTasksTab() {
  const main = document.getElementById('main');
  let tasks;
  try {
    const resp = await fetchJson('/api/adhoc-tasks');
    tasks = resp.tasks;
  } catch (e) {
    main.innerHTML = `<div class="empty">Error loading adhoc tasks: ${e.message}</div>`;
    return;
  }
  if (tasks.length === 0) {
    main.innerHTML = '<div class="empty">No adhoc tasks right now.</div>';
    return;
  }
  const rows = tasks.map(t => {
    const isAwaitingConfirm = t.state === 'awaiting-confirm';
    const rowClass = isAwaitingConfirm ? 'clickable adhoc-awaiting-confirm-row' : 'clickable';
    const badgeClass = adhocStateBadgeClass(t.state);
    const when = t.createdAt ? new Date(t.createdAt).toLocaleString() : '';
    const excerptHtml = t.excerpt ? `<div class="meta">${escapeHtml(t.excerpt)}</div>` : '';
    // dependsOn (2026-08-22): each entry's `satisfied` mirrors task-sources.js's own
    // isDependencySatisfied() -- merged, not just done -- so this reads the same
    // "actually unblocked" answer the claim logic itself uses, not a looser guess.
    const dependsHtml = (t.dependsOn && t.dependsOn.length)
      ? `<div class="meta" style="color:var(--warn)">⏳ depends on: ${t.dependsOn.map((d) => `${escapeHtml(d.id)}${d.satisfied ? ' (merged)' : ' (not yet merged)'}`).join(', ')}</div>`
      : '';
    return `<tr class="${rowClass}" data-id="${escapeAttr(t.id)}">
      <td>${escapeHtml(t.title)}${excerptHtml}${dependsHtml}</td>
      <td><span class="badge ${badgeClass}">${escapeHtml(adhocStateLabel(t.state))}</span>${isAwaitingConfirm ? ' <strong>-- needs your review</strong>' : ''}</td>
      <td>${escapeHtml(when)}</td>
    </tr>`;
  }).join('');
  const footer = `<div class="meta" style="padding:10px 4px">Showing ${tasks.length} adhoc task${tasks.length === 1 ? '' : 's'}.</div>`;
  main.innerHTML = `<table><thead><tr><th>Title</th><th>State</th><th>Created</th></tr></thead><tbody>${rows}</tbody></table>${footer}`;
  main.querySelectorAll('tr.clickable').forEach(row => {
    row.onclick = () => openTaskAnywhere(row.dataset.id);
  });
}

// Renders task.draftAttempts[] (src/draft-attempt-record.js) as one <details> per
// draftTask() run: plan text (or degenerate reason), each implement tier's
// resolution/decline reason + response + captured worktree diff + a summary of its tool
// activity, and the terminal outcome. Older records past the keep-window arrive already
// collapsed to a slim shape (no bodies) -- rendered as a one-line summary. Newest first.
function renderDraftAttempts(task) {
  const attempts = Array.isArray(task.draftAttempts) ? task.draftAttempts : [];
  if (!attempts.length) return '';

  const tierBlock = (t) => {
    const verdict = t.resolution
      ? `resolution=${t.resolution}`
      : (t.applied === true ? 'applied' : t.applied === false ? 'declined' : (t.blocked ? 'blocked' : '?'));
    let h = `<div class="da-tier"><span class="da-tier-name">${escapeHtml(t.tier)}</span> `
      + `<span class="meta">${escapeHtml(verdict)}`
      + (t.turnsUsed != null ? ` · ${t.turnsUsed} turn(s)` : '')
      + `</span>`;
    if (t.reason) h += `<div class="meta">${escapeHtml(t.reason)}</div>`;
    if (t.toolCalls) {
      const tc = t.toolCalls;
      const byTool = Object.entries(tc.byTool || {}).map(([k, v]) => `${k}×${v}`).join(', ');
      h += `<div class="da-tools">${tc.total} tool call(s)${byTool ? ` — ${escapeHtml(byTool)}` : ''}`
        + `${tc.errors ? ` · ${tc.errors} error(s)` : ''}${tc.listTruncated ? ' · list truncated' : ''}</div>`;
      // Per-call skeleton (tool + arg keys + result size) -- kept on the attempt record
      // forever, unlike the full Work Log below which is pruned once the task reaches done/.
      if (Array.isArray(tc.calls) && tc.calls.length) {
        h += `<div class="da-tools">` + tc.calls.map((c) =>
          `#${c.n != null ? c.n : '?'} ${escapeHtml(c.tool)}(${(c.argKeys || []).map(escapeHtml).join(', ')}) → ${c.bytes} B${c.error ? ' ERR' : ''}`
        ).join('<br>') + (tc.listTruncated ? '<br>…' : '') + `</div>`;
      }
    }
    if (t.response) {
      h += `<div class="meta">response${t.responseChars ? ` (${t.responseChars} chars)` : ''}:</div>`
        + `<pre>${escapeHtml(t.response)}</pre>`;
    }
    if (t.rawDiff) {
      h += `<div class="meta">captured worktree diff${t.rawDiffChars ? ` (${t.rawDiffChars} chars)` : ''}:</div>`
        + `<pre>${escapeHtml(t.rawDiff)}</pre>`;
    }
    return h + `</div>`;
  };

  const one = (a) => {
    const when = a.at ? new Date(a.at).toLocaleString() : '';
    const outcome = a.outcome || '?';
    const summary = `<summary>#${a.attemptNo} · <span class="da-outcome-${escapeHtml(outcome)}">${escapeHtml(outcome)}</span>`
      + `${a.blockedReason ? ` — ${escapeHtml(String(a.blockedReason).slice(0, 120))}` : ''}`
      + ` <span class="meta">${escapeHtml(when)}</span></summary>`;

    if (a.collapsed) {
      const tiers = (a.tiers || []).map((t) => `${t.tier}=${t.resolution || (t.applied ? 'applied' : 'declined')}`).join(' → ');
      return `<details class="draft-attempt">${summary}<div class="da-body meta">`
        + `plan ${a.planChars || 0} chars${a.planDegenerate ? ` (degenerate: ${escapeHtml(a.planDegenerate)})` : ''}`
        + `${tiers ? ` · tiers: ${escapeHtml(tiers)}` : ''}`
        + ` <em>(older attempt — full detail collapsed)</em></div></details>`;
    }

    let body = `<div class="da-body">`;
    if (a.source || a.localRejectCount) {
      body += `<div class="meta">source=${escapeHtml(a.source || '?')}`
        + `${a.localRejectCount ? ` · localRejectCount=${a.localRejectCount}` : ''}`
        + `${a.adhocResolution ? ` · adhocResolution=${escapeHtml(a.adhocResolution)}` : ''}</div>`;
    }
    if (a.plan) {
      if (a.plan.degenerate) {
        body += `<div class="field-label">Plan</div><pre class="meta">(degenerate: ${escapeHtml(a.plan.degenerate)})</pre>`;
      } else {
        body += `<div class="field-label">Plan${a.plan.chars ? ` (${a.plan.chars} chars` : ''}`
          + `${a.plan.attempts != null ? `, ${a.plan.attempts} attempt(s)` : ''}${a.plan.chars ? ')' : ''}</div>`
          + `<pre>${escapeHtml(a.plan.text || '')}</pre>`;
      }
    }
    if (a.implement) {
      const im = a.implement;
      body += `<div class="field-label">Implement</div>`;
      if (im.degenerate) body += `<pre class="meta">(degenerate: ${escapeHtml(im.degenerate)})</pre>`;
      else {
        if (im.note) body += `<div class="meta">${escapeHtml(im.note)}</div>`;
        if (im.text) body += `<pre>${escapeHtml(im.text)}</pre>`;
        else if (!im.note) body += `<pre class="meta">(empty)</pre>`;
      }
    }
    if (a.critique) {
      body += `<div class="meta">critique: ${escapeHtml(a.critique.outcome || '?')}${a.critique.revised ? ', revised' : ''}</div>`;
    }
    if (a.tiers && a.tiers.length) {
      body += `<div class="field-label">Implement Tiers</div>${a.tiers.map(tierBlock).join('')}`;
    }
    if (a.reason) body += `<div class="field-label">Error</div><div class="meta da-outcome-error">${escapeHtml(a.reason)}</div>`;
    return `<details class="draft-attempt">${summary}${body}</div></details>`;
  };

  const rows = attempts.slice().reverse().map(one).join('');
  return `<div class="field-label">Draft Attempts (${attempts.length})</div>${rows}`;
}

// The full per-tier tool transcript (server provides task._workLog from
// queue/worklogs/<id>.json -- src/work-log.js). renderDraftAttempts above shows only the
// stripped summary (tool name + arg keys, never values); this is what the model actually
// read, searched, ran and edited -- the detail you need to audit a result before approving
// or merging it. Open by default while the task is still pre-merge.
function renderWorkLog(task) {
  const wl = task._workLog;
  if (!wl || !Array.isArray(wl.tiers) || !wl.tiers.length) return '';
  const preMerge = ['approved', 'needs-review', 'blocked', 'awaiting-confirm'].includes(task.status);
  const totalCalls = wl.tiers.reduce((n, t) => n + ((t.calls && t.calls.length) || 0), 0);

  const callRow = (c) => {
    const argStr = Object.entries(c.args || {}).map(([k, v]) => {
      const s = String(v);
      return `${escapeHtml(k)}=${escapeHtml(s.length > 200 ? s.slice(0, 200) + '…' : s)}`;
    }).join(', ');
    const head = `<span class="wl-n">#${c.n}</span> <span class="wl-tool">${escapeHtml(c.tool)}</span>(${argStr})`
      + ` <span class="meta">→ ${c.resultBytes} B${c.error ? ' · ERROR' : ''}</span>`;
    if (!c.resultPreview) return `<div class="wl-call${c.error ? ' wl-err' : ''}">${head}</div>`;
    return `<details class="wl-call${c.error ? ' wl-err' : ''}"><summary>${head}</summary>`
      + `<pre>${escapeHtml(c.resultPreview)}</pre></details>`;
  };

  const tierBlocks = wl.tiers.map((t) => {
    const n = (t.calls && t.calls.length) || 0;
    return `<div class="wl-tier"><div class="meta">${escapeHtml(t.tier)}`
      + `${t.turnsUsed != null ? ` · ${t.turnsUsed} turn(s)` : ''} · ${n} tool call(s)`
      + `${t.truncated ? ' · older calls trimmed for size' : ''}</div>`
      + (t.calls || []).map(callRow).join('') + `</div>`;
  }).join('');

  return `<details class="work-log"${preMerge ? ' open' : ''}>`
    + `<summary><span class="field-label">Work Log</span> `
    + `<span class="meta">${totalCalls} tool call(s) across ${wl.tiers.length} tier(s)</span></summary>`
    + tierBlocks + `</details>`;
}

// pipeline_forensics (2026-09-01, Grimmethy: "Is the work done by forensics properly
// visible on the task log?"). A forensic study is a non-agentic review task, so it has no
// Work Log and its Draft Attempts record is thin (plan chars / implement chars). The thing
// a reviewer actually needs to judge the ranked report -- BEFORE confirming it files a
// pipeline-fix candidate -- is what the study looked at: which failing tasks, which
// contrast "winners", and the raw evidence bundle it reasoned over. All of that is on
// task.promptContext but was never surfaced in the modal.
function taskLink(id) {
  return `<a href="#" class="task-jump" data-open-task-anywhere="${escapeAttr(id)}"><code>${escapeHtml(id)}</code></a>`;
}
function renderForensicsStudyBlock(task) {
  if (task.source !== 'pipeline_forensics') return '';
  const pc = task.promptContext || {};
  const losers = Array.isArray(pc.loserIds) ? pc.loserIds : [];
  const winners = Array.isArray(pc.winnerIds) ? pc.winnerIds : [];
  let html = `<div class="field-label">Forensic Study</div><div>`;
  html += `<span class="meta">Trigger: ${escapeHtml(pc.triggerType || '?')}`;
  if (pc.signature) html += ` &middot; Signature: <code>${escapeHtml(pc.signature)}</code>`;
  if (pc.subjectKind && pc.subjectKey && pc.subjectKey !== pc.signature) html += ` &middot; Subject: ${escapeHtml(pc.subjectKind)} <code>${escapeHtml(pc.subjectKey)}</code>`;
  html += `</span>`;
  if (losers.length) html += `<div style="margin-top:6px"><strong>Failing tasks studied (${losers.length}):</strong><br>${losers.map(taskLink).join('<br>')}</div>`;
  if (winners.length) html += `<div style="margin-top:6px"><strong>Contrast set — tasks that SUCCEEDED (${winners.length}):</strong><br>${winners.map(taskLink).join('<br>')}</div>`;
  html += `</div>`;
  return html;
}

// The real greps a harness-grounded audit ran against this pipeline's OWN src/ and their
// hits -- used by staleness_audit / pipeline_self_audit / pipeline_health_audit /
// pipeline_forensics / ui_visibility_audit. Collapsible; the drafting model already read
// these, this just makes them auditable by a human too.
function renderHarnessHits(task) {
  const pc = task.promptContext || {};
  const hits = Array.isArray(pc.harnessHits) ? pc.harnessHits : [];
  if (!hits.length) return '';
  const rows = hits.map((h) => `<div class="wl-call">`
    + `<code>${escapeHtml(h.file || '?')}${h.line != null ? ':' + h.line : ''}</code>`
    + (h.query ? ` <span class="meta">(query "${escapeHtml(h.query)}")</span>` : '')
    + (h.text ? `<pre style="margin:2px 0">${escapeHtml(h.text)}</pre>` : '')
    + `</div>`).join('');
  return `<details class="work-log"><summary><span class="field-label">Harness Hits</span> `
    + `<span class="meta">${hits.length} match(es) in this repo's own code</span></summary>${rows}</details>`;
}

// The full pre-computed evidence bundle a deterministic detector assembled for the drafting
// model (promptContext.evidenceText) -- pipeline_forensics' contrast-set bundle,
// pipeline_health_audit's anomaly dump, pipeline_self_audit's cluster description. Large,
// so collapsed by default.
function renderEvidenceBundle(task) {
  const pc = task.promptContext || {};
  const ev = typeof pc.evidenceText === 'string' ? pc.evidenceText.trim() : '';
  if (!ev) return '';
  return `<details class="work-log"><summary><span class="field-label">Evidence Bundle</span> `
    + `<span class="meta">${ev.length.toLocaleString()} chars — what the study reasoned over</span></summary>`
    + `<pre>${escapeHtml(ev)}</pre></details>`;
}

// Sub-task status (from coordinator-sweep.js) -> badge class + human label.
const SUBTASK_STATUS_META = {
  merged: ['ok', 'merged'],
  done: ['ok', 'done — awaiting merge'],
  gone: ['ok', 'done'],
  abandoned: ['idle', 'abandoned'],
  blocked: ['bad', 'blocked'],
  'needs-clarification': ['warn', 'needs clarification'],
  'awaiting-confirm': ['bad', 'awaiting confirm'],
  'in-progress': ['idle', 'in progress'],
  pending: ['idle', 'pending'],
};

// The coordinator hub: a decomposed parent's sub-task checklist + progress bar. Each row
// links through to that sub-task's own detail modal (data-open-task-anywhere, wired at the
// bottom of renderTaskDetailModal). Rendered near the top, above the task log.
function renderSubTaskChecklist(task) {
  const subs = Array.isArray(task.subTasks) ? task.subTasks : [];
  if (!subs.length) return '';
  const total = task.progress && task.progress.total != null ? task.progress.total : subs.length;
  const done = task.progress && task.progress.done != null ? task.progress.done : 0;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const rows = subs.map((st) => {
    const [cls, label] = SUBTASK_STATUS_META[st.status] || ['idle', st.status || 'pending'];
    return `<div class="task-history-row"><span class="badge ${cls}">${escapeHtml(label)}</span> `
      + `${taskLink(st.id)} ${escapeHtml(st.title || '')}</div>`;
  }).join('');
  return `<div class="field-label">Sub-tasks (${done} / ${total})</div>`
    + `<div class="bar-track" style="margin:2px 0 8px"><div class="bar-fill" style="width:${pct}%; background:var(--ok)"></div></div>`
    + `<div class="task-history">${rows}</div>`;
}

function renderTaskDetailModal(task) {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  let html = `<button class="close" onclick="closeDetail()">&times;</button><h2>${task.id}</h2>`;
  // "Send to Chat" (2026-09-01) -- dumps this task's key context into the System Chat
  // panel as a user message (via sendTextToChat -> POST /api/chat/inject, no model call)
  // so a follow-up can be had about it. Button sits in the modal's top action area, same
  // .secondary style as Discuss/Edit/Delete. Wired below (task-send-to-chat) rather than
  // inlined so the multi-line payload isn't quote-escaping trouble in an onclick string.
  html += `<div style="margin:8px 0 4px"><button type="button" class="secondary" id="task-send-to-chat">Send to Chat</button></div>`;
  if (task._foundState) html += `<div class="field-label">Queue State</div><div>${escapeHtml(task._foundState)}</div>`;
  html += `<div><strong>${escapeHtml(task.title || '')}</strong></div>`;
  html += renderSubTaskChecklist(task);
  // Task metadata (2026-08-26, Grimmethy: "At the top of every task I'd like to see a
  // bit of meta data. How much machine time was spent on the task and a list of all the
  // files it touched") -- totalLatencyMs sums real wall-clock time across every model
  // call this task made (see _task_cost_summary's own comment: recorded for local Ollama
  // calls the same as Claude ones, unlike totalCostUsd which is $0, not absent, for an
  // all-local task). _filesTouched is server-computed from whichever shape this task's
  // actual on-disk change came in (a unified diff, or a Group B JSON change list) --
  // empty for a task that never wrote to the filesystem at all (a verdict-only audit, a
  // split proposal), not an error.
  if (task._costSummary && task._costSummary.totalLatencyMs != null) {
    html += `<div class="field-label">Machine Time</div><div>${fmtDuration(task._costSummary.totalLatencyMs / 1000)} across ${task._costSummary.totalCalls} model call(s)</div>`;
  }
  if (task._filesTouched) {
    const filesLabel = task._filesTouched.length
      ? task._filesTouched.map(f => `<code>${escapeHtml(f)}</code>`).join('<br>')
      : '<span class="meta">no files touched</span>';
    html += `<div class="field-label">Files Touched (${task._filesTouched.length})</div><div>${filesLabel}</div>`;
  }
  // Estimated Anthropic API cost for this ONE task (2026-08-23, Grimmethy: "We should
  // include estimated cost tracking in the job page itself") -- api_task_detail/
  // api_task_anywhere sum every model_calls row for this task_id server-side (a task can
  // carry several real calls: plan, implement, critique, revision), since task.abCallId
  // on the task itself only ever holds the MOST RECENT one. _costSummary is null (not a
  // zeroed object) when the db/column isn't available or no calls exist yet for this
  // task at all -- shown only when there's something real to show.
  if (task._costSummary) {
    const cs = task._costSummary;
    // hypotheticalCostUsd (2026-08-23, Grimmethy: "Clarification on the anthropic
    // costs. I'd like estimates for if we had used the API. Even if we used the local
    // models.") -- unlike totalCostUsd (real spend, $0 for an all-local task), this is
    // always a real number: what THIS task would have cost had every one of its calls,
    // local or not, gone through the API.
    const realLabel = cs.totalCostUsd > 0
      ? `${fmtUsd(cs.totalCostUsd)} real (${cs.callsWithCost}/${cs.totalCalls} call(s) via Claude)`
      : `$0 real -- all ${cs.totalCalls} call(s) ran locally`;
    const hLabel = cs.hypotheticalCostUsd != null ? ` · ${fmtUsd(cs.hypotheticalCostUsd)} est. if every call had used the API` : '';
    html += `<div class="field-label">Estimated API Cost</div><div>${realLabel}${hLabel}</div>`;
  }
  // Request / Input (2026-08-30, Grimmethy: "I get no indication of what actually
  // happened") -- the task's actual INPUT (what the model was asked to act on). Different
  // sources stash it under different promptContext keys; app.py's _task_input_summary
  // normalises them into a [{label, text}] list so a blocked product_spec task shows its
  // ~2KB request brief (promptContext.requestText) instead of just a truncated title.
  if (task._requestInput && task._requestInput.length) {
    for (const item of task._requestInput) {
      html += `<div class="field-label">${escapeHtml(item.label)}</div><pre>${escapeHtml(item.text)}</pre>`;
    }
  }
  html += `<div class="field-label">Domain / Source</div><div>${task.domain || ''} / ${task.source || ''}</div>`;
  if (task.blockedReason) html += `<div class="field-label">Blocked Reason</div><div style="color:var(--bad)">${escapeHtml(task.blockedReason)}</div>`;
  if (task.branch) html += `<div class="field-label">Branch</div><div>${task.branch}</div>`;
  if (task.promptContext && task.promptContext.prefetchedPaths && task.promptContext.prefetchedPaths.length) {
    html += `<div class="field-label">Prefetched Paths</div><div>${task.promptContext.prefetchedPaths.map(p => `<code>${escapeHtml(p)}</code>`).join('<br>')}</div>`;
  }
  // staleness_audit (2026-08-22, Grimmethy: "I don't have information in the task page
  // about when it was actually set up. The pipeline history only shows the newest
  // staleness audit. All previous steps are missing.") -- this task's OWN
  // task.history[] only ever covers its own short life (created -> drafted -> reviewed);
  // the thing a human actually needs to judge "is this really stale" is the ORIGINAL
  // flagged task's own dates, which staleness-audit.js now stamps as structured fields
  // (originalTitle/originalCreatedAt/originalLastActivityAt) specifically so this can
  // render them directly instead of leaving them buried in evidenceText's prose (which
  // only the drafting MODEL ever reads).
  if (task.source === 'staleness_audit' && task.promptContext && task.promptContext.originalTaskId) {
    const pc = task.promptContext;
    html += `<div class="field-label">Original Flagged Task</div><div>`
      + `<code>${escapeHtml(pc.originalTaskId)}</code>`
      + (pc.originalTitle ? `<br>${escapeHtml(pc.originalTitle)}` : '')
      + `<br><span class="meta">Created: ${pc.originalCreatedAt ? new Date(pc.originalCreatedAt).toLocaleString() : 'unknown'}`
      + ` &middot; Last activity: ${pc.originalLastActivityAt ? new Date(pc.originalLastActivityAt).toLocaleString() : 'unknown'}</span>`
      + (pc.reasons && pc.reasons.length ? `<br><span class="meta">Flagged: ${pc.reasons.map(escapeHtml).join(', ')}</span>` : '')
      + `</div>`;
  }
  html += renderForensicsStudyBlock(task);
  // For advisoryProse sources (pipeline_forensics) the deliverable IS implementResponse --
  // a root-cause report, not a diff. Rendered dead last under a generic "Implement" label,
  // it reads as buried; hoist it right below the study framing so the modal leads with the
  // conclusion. The bottom-of-modal block is then skipped (reportShown).
  let reportShown = false;
  if (PROSE_REPORT_SOURCES.has(task.source) && task.implementResponse) {
    html += `<div class="field-label">Root-Cause Report</div><pre>${escapeHtml(task.implementResponse)}</pre>`;
    reportShown = true;
  }
  if (task.needsClarification) html += renderClarificationPicker(task);
  // Pipeline History: task.history[] (task-history.js's appendHistoryEvent -- see that
  // module for the schema). Was written correctly the whole time this session but never
  // rendered anywhere in the app -- the data existed only if you went and read the raw
  // task JSON off disk yourself, which defeats the point of a per-step timeline being a
  // dashboard feature at all. Entries come in two shapes: older ones only ever have
  // `status` (no `stage`, no `detail`) from before task-history.js existed -- render both
  // so a task whose life started before this feature shipped doesn't just show a gap.
  if (task.history && task.history.length) {
    const liveBadge = TASK_DETAIL_LIVE_STATES.has(task._foundState || '')
      ? ` <span class="meta" title="this task is mid-pass; new steps appear here automatically">● live</span>` : '';
    html += `<div class="field-label">Pipeline History${liveBadge}</div><div class="task-history">`;
    html += task.history.map(h => {
