      const label = h.stage || h.status || '?';
      const when = h.at ? new Date(h.at).toLocaleString() : '';
      const detail = h.detail || h.note || '';
      return `<div class="task-history-row"><span class="task-history-stage">${escapeHtml(label)}</span> `
        + `<span class="meta">${escapeHtml(when)}</span>`
        + (detail ? `<div class="meta">${escapeHtml(detail)}</div>` : '')
        + `</div>`;
    }).join('') + `</div>`;
  }
  // Draft Attempts: one collapsible record per draftTask() run (draft-attempt-record.js).
  // task.planResponse / task.implementResponse below only ever show the LAST run; this is
  // the per-attempt history -- every earlier plan, every tier's decline reason + response,
  // every tier-3 worktree diff -- so following up on a task that failed N times no longer
  // means re-investigating from scratch.
  html += renderDraftAttempts(task);
  html += renderWorkLog(task);
  html += renderHarnessHits(task);
  html += renderEvidenceBundle(task);
  // A "degenerate: empty" block means the model returned nothing for that pass -- the
  // field is absent, not present-and-empty, so without this the modal just omits the
  // section and the timeline is the only hint anything ran. Say it explicitly.
  const emptyPlan = !task.planResponse && /plan pass degenerate/i.test(task.blockedReason || '');
  const emptyImpl = !task.implementResponse && /implement pass degenerate/i.test(task.blockedReason || '');
  if (task.planResponse) html += `<div class="field-label">Plan</div><pre>${escapeHtml(task.planResponse)}</pre>`;
  else if (emptyPlan) html += `<div class="field-label">Plan</div><pre class="meta">(the plan pass returned an empty response — nothing was drafted; see Blocked Reason above)</pre>`;
  if (task.implementResponse && !reportShown) html += `<div class="field-label">Implement</div><pre>${escapeHtml(task.implementResponse)}</pre>`;
  else if (emptyImpl) html += `<div class="field-label">Implement</div><pre class="meta">(the implement pass returned an empty response — nothing was drafted; see Blocked Reason above)</pre>`;
  content.innerHTML = html;
  backdrop.classList.add('open');
  // Jump to another task from an in-modal link (the forensic study's failing/winner ids) --
  // same delegated pattern the Recent Tasks / Workers lists use.
  content.querySelectorAll('[data-open-task-anywhere]').forEach((link) => {
    link.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openTaskAnywhere(link.dataset.openTaskAnywhere); };
  });
  if (task.needsClarification) wireClarificationPicker(task.id);
  // "Send to Chat" button handler (declared in the modal HTML above). Dumps this task's
  // key context (title / source / blocked reason / request brief / plan / implement
  // response) into the System Chat panel as one user message via sendTextToChat (POST
  // /api/chat/inject -- records the turn, no model call), then reloads the active session
  // so the injected turn shows immediately.
  const taskSendToChatBtn = document.getElementById('task-send-to-chat');
  if (taskSendToChatBtn) {
    taskSendToChatBtn.onclick = async () => {
      taskSendToChatBtn.disabled = true;
      try {
        const parts = [`# ${task.id}`];
        if (task.title) parts.push('title: ' + task.title);
        if (task.source) parts.push('source: ' + task.source);
        if (task.blockedReason) parts.push('blocked: ' + task.blockedReason);
        if (task.promptContext && task.promptContext.requestText) parts.push('request:\n' + task.promptContext.requestText);
        if (task.planResponse) parts.push('plan:\n' + task.planResponse);
        if (task.implementResponse) parts.push('implement:\n' + task.implementResponse);
        await sendTextToChat(parts.join('\n\n')); // POSTs, expands the panel, re-renders; throws on !ok
        try { chatSession = await fetchJson('/api/chat/active'); chatRender(); } catch (e) { /* leave the panel as-is */ }
        showToast('Sent to chat', 'info');
      } catch (e) {
        showToast('Could not send to chat: ' + e.message);
      } finally {
        taskSendToChatBtn.disabled = false;
      }
    };
  }
  armTaskDetailAutoRefresh(task);
}

// While a task is mid-pass (drafting or review), the pipeline now flushes each new
// Pipeline History checkpoint to the task file as it happens (task-history.js's persist
// hook -- 2026-08-31, Grimmethy: "Anything that I can observe is good"). The modal is a
// one-shot fetch, so poll while it's open and a live task is showing, re-rendering only
// when something actually changed. task-anywhere follows the task across the
// drafting->review->approved->done moves, so the modal keeps tracking it without a manual
// reopen; a terminal state stops the poll.
let taskDetailPoll = null;
const TASK_DETAIL_LIVE_STATES = new Set(['drafting', 'review', 'coordinating']);
// Sources whose real deliverable is a prose report in implementResponse (advisoryProse),
// not a diff -- the task modal promotes it to the top under "Root-Cause Report".
const PROSE_REPORT_SOURCES = new Set(['pipeline_forensics']);
function stopTaskDetailAutoRefresh() {
  if (taskDetailPoll) { clearInterval(taskDetailPoll); taskDetailPoll = null; }
}
function armTaskDetailAutoRefresh(task) {
  stopTaskDetailAutoRefresh();
  const state = task._foundState || '';
  if (!TASK_DETAIL_LIVE_STATES.has(state)) return;
  const id = task.id;
  let lastSig = `${state}:${(task.history || []).length}`;
  taskDetailPoll = setInterval(async () => {
    const backdrop = document.getElementById('modal-backdrop');
    if (!backdrop || !backdrop.classList.contains('open')) { stopTaskDetailAutoRefresh(); return; }
    let fresh;
    try {
      fresh = await fetchJson(`/api/task-anywhere/${encodeURIComponent(id)}`);
    } catch (e) {
      return; // transient -- try again next tick
    }
    const sig = `${fresh._foundState || ''}:${(fresh.history || []).length}`;
    if (sig !== lastSig) {
      lastSig = sig;
      renderTaskDetailModal(fresh); // re-arms (or stops, if it landed in a terminal state)
    }
  }, 4000);
}

// Path-prefetch's "needs clarification" resolution UI (context-aware-file-path-prefetch-
// job.md): 'ambiguous' shows every candidate file per matched keyword as its own pick
// button (never auto-picks -- the actual ask); 'no-match' just offers a manual path
// input. Both cases also get "Proceed without prefetch" -- the explicit escape hatch for
// when prefetch genuinely has nothing useful to offer, rather than blocking the task
// forever over it.
// 2026-08-24 (adhoc-agentic-draft.js's RESOLUTION: needs-human-decision, Grimmethy: "We
// already have a 'needs clarification' tab. That's a perfect place for this type of
// job."): a genuinely different held-task shape from path_prefetch_resolve's own ambiguous/
// no-match file-path picker below -- there's no candidate list to pick from, just the
// model's own real open questions. Reuses the SAME element IDs (clarify-resolve-btn,
// clarify-discuss-btn, clarify-discuss-provider) as the picker below so wireClarification-
// Picker's existing wiring works completely unchanged: with no .clarify-pick-btn/manual-
// path/accept-suggestion elements in this branch's HTML, `selected` in that function's
// closure simply stays empty, so clicking "Send to Drafting" here calls the exact same
// resolveNeedsClarification(taskId, []) the file-picker's own "Proceed Without Prefetch"
// button already uses -- correct for this case too, since there are no paths to attach,
// just the discussion (already folded into promptContext.rawText server-side by
// api_discuss_end) riding along when the task moves back to queue/adhoc/.
function renderDesignDecisionPicker(task) {
  const nc = task.needsClarification;
  let html = `<div class="field-label">⚠ Needs a Human Decision</div>`;
  html += `<div class="meta">The agentic draft investigated this for real and has genuine open questions it shouldn't guess at:</div>`;
  html += `<div class="grill-session" style="margin-top:8px; white-space:pre-wrap">${escapeHtml(nc.openQuestions || '')}</div>`;

  // Multiple-choice shortcut (2026-08-24, Grimmethy: "build in some multiple choice
  // options into the task log... reduce the friction caused by pausing the pipeline to
  // set up a chat") -- nc.options is only ever present when the draft offered a clean
  // 2+ option OPTIONS block (see adhoc-agentic-draft.js's parseClarificationOptions);
  // absent for older held tasks drafted before this feature, or when the model judged
  // the real answer space too open-ended for multiple choice. Either way, the free-text
  // "Other" box below is always available as the universal fallback.
  if (nc.options && nc.options.length) {
    html += `<div style="margin-top:10px"><strong>Pick one:</strong></div>`;
    html += `<div style="margin-top:6px;display:flex;flex-direction:column;gap:6px">`;
    html += nc.options.map((o, i) => `
      <button type="button" class="secondary clarify-answer-option-btn" data-answer="${escapeAttr(`${o.label}: ${o.description}`)}" style="text-align:left;padding:8px 10px">
        <strong>${escapeHtml(o.label)}</strong><br><span class="meta">${escapeHtml(o.description)}</span>
      </button>`).join('');
    html += `</div>`;
  }
  html += `<div style="margin-top:10px"><strong>${nc.options && nc.options.length ? 'Other:' : 'Your answer:'}</strong></div>`;
  html += `<div style="margin-top:6px"><textarea id="clarify-answer-other" rows="3" style="width:100%;background:var(--panel);border:2px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-family:inherit;font-size:13px" placeholder="Type your decision here -- this gets folded directly into the task's instructions, same as ending a Discuss session would."></textarea></div>`;
  html += `<div style="margin-top:8px"><button type="button" class="action" id="clarify-answer-submit-btn">Submit &amp; Send to Drafting</button> <button type="button" class="secondary" id="clarify-discuss-btn">Discuss instead</button> ${renderProviderToggle('clarify-discuss-provider')}</div>`;
  html += `<div id="clarify-discuss-panel" style="margin-top:10px"></div>`;
  return html;
}

function renderClarificationPicker(task) {
  // 2026-08-24 (Grimmethy: "I'd like to see this discuss option default to using the
  // local reasoning model, not claude") -- providerChoices is a single global keyed by
  // the DOM id, and clarify-discuss-provider is the SAME id reused for every task's
  // modal. Without this reset, toggling to Claude once for any task left it stuck as the
  // default for every OTHER task's Discuss button afterward too, silently defeating the
  // "starts on local" default both this toggle and _discuss_provider_args() otherwise
  // already have. Force it back to local every time a task's detail view is (re)built,
  // so only an explicit click within THIS task's own session ever picks Claude.
  const nc = task.needsClarification;
  providerChoices['clarify-discuss-provider'] = 'local';
  if (nc.reason === 'design-decision') return renderDesignDecisionPicker(task);
  let html = `<div class="field-label">⚠ Needs Clarification</div>`;
  // LLM-assisted fallback suggestion (path_prefetch_resolve, hybrid design 2026-08-16) --
  // shown FIRST and most prominent, since accepting it is the one-click path that's the
  // whole point of the hybrid: still a human decision (never auto-applied), just a much
  // faster one than manually knowing the codebase. Sits above the raw candidate/manual
  // options below it, which stay available as a fallback if the suggestion is wrong.
  if (nc.suggested) {
    const s = nc.suggested;
    const confidenceLabel = s.confident ? 'confident' : 'best guess';
    if (s.paths && s.paths.length) {
      html += `<div class="grill-session" style="margin-top:8px;border:1px solid var(--warn)">`;
      html += `<div class="field-label">Suggested (${confidenceLabel})</div>`;
      html += `<div>${s.paths.map(p => `<code>${escapeHtml(p)}</code>`).join('<br>')}</div>`;
      if (s.rationale) html += `<div class="meta" style="margin-top:6px">${escapeHtml(s.rationale)}</div>`;
      html += `<button type="button" class="action clarify-accept-suggestion-btn" data-suggested-paths="${escapeAttr(JSON.stringify(s.paths))}" style="margin-top:8px">Accept Suggestion</button>`;
      html += `</div>`;
    } else {
      html += `<div class="grill-session" style="margin-top:8px"><div class="field-label">Suggestion attempted</div><div class="meta">The model couldn't find a match either${s.rationale ? ': ' + escapeHtml(s.rationale) : '.'}</div></div>`;
    }
  }
  if (nc.reason === 'ambiguous' && nc.candidates) {
    html += `<div class="meta">One or more keywords matched more than one file -- pick which one(s) belong:</div>`;
    for (const [keyword, files] of Object.entries(nc.candidates)) {
      html += `<div style="margin-top:6px"><strong>${escapeHtml(keyword)}</strong><br>`;
      html += files.map(f => `<button type="button" class="secondary clarify-pick-btn" data-path="${escapeAttr(f)}" style="margin:3px 6px 0 0">${escapeHtml(f)}</button>`).join('');
      html += `</div>`;
    }
  } else {
    html += `<div class="meta">No file in the project graph matched anything in this task's text. Type a path by hand, or proceed without one.</div>`;
  }
  html += `<div style="margin-top:10px"><input type="text" id="clarify-manual-path" placeholder="relative/path/to/file.ts" style="width:60%;background:var(--panel);border:2px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-family:monospace;font-size:12px">`;
  html += `<button type="button" class="action" id="clarify-add-manual" style="margin-left:6px">Use This Path</button></div>`;
  html += `<div id="clarify-selected-paths" style="margin-top:8px"></div>`;
  html += `<div style="margin-top:10px"><button type="button" class="action" id="clarify-resolve-btn">Send to Drafting</button> <button type="button" class="secondary" id="clarify-skip-btn">Proceed Without Prefetch</button> <button type="button" class="secondary" id="clarify-discuss-btn">Discuss</button> ${renderProviderToggle('clarify-discuss-provider')}</div>`;
  html += `<div id="clarify-discuss-panel" style="margin-top:10px"></div>`;
  return html;
}

// "Discuss" on a held task -- the actual ask: "rather than inputting a file path manually
// we should open a 'discuss' to get more information about the task itself." Shares
// discuss_sessions.py and the generic /api/discuss/* endpoints with the other two Discuss
// integrations; only /start and /for-note are needs-clarification-specific. Ending the
// conversation re-opens the held task for a fresh path_prefetch_resolve attempt with the
// enriched text (see app.py's api_discuss_end 'needs-clarification' branch) -- so this
// isn't just note-taking, it's a real second shot at automatic resolution.
function clarifyDiscussRenderPanel(taskId, session) {
  const el = document.getElementById('clarify-discuss-panel');
  if (!el) return;
  const transcriptHtml = grillRenderTranscript(session.transcript, session);
  if (session.status === 'ended') {
    const actionHtml = session.summary
      ? `<div class="grill-enriched-badge">Added to task ✓ -- re-queued for another resolution attempt with this context.</div>`
      : `<div class="meta" style="margin-top:8px">Ended with nothing said -- task unchanged.</div>`;
    el.innerHTML = `<div class="grill-session"><div class="field-label">Discussion ended</div>${transcriptHtml}${actionHtml}</div>`;
  } else {
    el.innerHTML = `<div class="grill-session">${transcriptHtml}<textarea class="grill-answer" rows="3" placeholder="Say more... (Enter to send, Shift+Enter for a new line)"></textarea><div class="row" style="margin-top:8px"><button type="button" class="secondary" id="clarify-discuss-end">End Discussion</button><button type="button" class="action" id="clarify-discuss-send">Send</button></div></div>`;
    const answerEl = el.querySelector('.grill-answer');
    const sendBtn = el.querySelector('#clarify-discuss-send');
    const endBtn = el.querySelector('#clarify-discuss-end');
    const send = () => clarifyDiscussSend(taskId, session.id, answerEl.value, sendBtn);
    sendBtn.onclick = send;
    endBtn.onclick = () => clarifyDiscussEnd(taskId, session.id, endBtn);
    answerEl.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    };
    answerEl.focus();
  }
  const scrollEl = el.querySelector('.grill-transcript');
  if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
}

async function clarifyDiscussStart(taskId) {
  const el = document.getElementById('clarify-discuss-panel');
  try {
    const existing = await fetchJson('/api/task/needs-clarification/' + encodeURIComponent(taskId) + '/discuss/latest');
    if (existing && existing.status === 'active') {
      clarifyDiscussRenderPanel(taskId, existing);
      return;
    }
  } catch (e) { /* best-effort check -- fall through to starting normally */ }
  if (el) el.innerHTML = '<div class="empty">Starting discussion...</div>';
  try {
    const resp = await fetch('/api/task/needs-clarification/' + encodeURIComponent(taskId) + '/discuss/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(providerPayload('clarify-discuss-provider')),
    });
    const session = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(session.description || ('HTTP ' + resp.status));
    clarifyDiscussRenderPanel(taskId, session);
  } catch (e) {
    if (el) el.innerHTML = '';
    showToast('Could not start discussion: ' + e.message);
  }
}

async function clarifyDiscussSend(taskId, sessionId, message, btn) {
  if (!message || !message.trim()) return;
  btn.disabled = true;
  btn.textContent = 'Thinking...';
  try {
    const resp = await fetch('/api/discuss/' + encodeURIComponent(sessionId) + '/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const session = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(session.description || ('HTTP ' + resp.status));
    clarifyDiscussRenderPanel(taskId, session);
  } catch (e) {
    showToast('Could not send message: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Send';
  }
}

async function clarifyDiscussEnd(taskId, sessionId, btn) {
  btn.disabled = true;
  btn.textContent = 'Ending...';
  try {
    const resp = await fetch('/api/discuss/' + encodeURIComponent(sessionId) + '/end', { method: 'POST' });
    const result = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(result.description || ('HTTP ' + resp.status));
    clarifyDiscussRenderPanel(taskId, result.session);
    // The held task was just re-opened for another resolution attempt server-side --
    // close the modal and refresh the list rather than leaving a stale picker open
    // against a task that's no longer in the state it shows.
    if (result.heldTask) {
      setTimeout(() => {
        closeDetail();
        if (activeTab === 'needs-clarification') renderQueueTab('needs-clarification');
      }, 1200);
    }
  } catch (e) {
    showToast('Could not end discussion: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'End Discussion';
  }
}

function wireClarificationPicker(taskId) {
  const selected = [];
  const renderSelected = () => {
    const el = document.getElementById('clarify-selected-paths');
    if (!el) return;
    el.innerHTML = selected.length
      ? '<div class="meta">Selected: ' + selected.map(escapeHtml).join(', ') + '</div>'
      : '';
  };
  document.querySelectorAll('.clarify-pick-btn').forEach((btn) => {
    btn.onclick = () => {
      const p = btn.dataset.path;
      if (!selected.includes(p)) selected.push(p);
      btn.disabled = true;
      renderSelected();
    };
  });
  const manualInput = document.getElementById('clarify-manual-path');
  const addManualBtn = document.getElementById('clarify-add-manual');
  if (addManualBtn) {
    addManualBtn.onclick = () => {
      const p = (manualInput.value || '').trim();
      if (!p) return;
      if (!selected.includes(p)) selected.push(p);
      manualInput.value = '';
      renderSelected();
    };
  }
  const resolveBtn = document.getElementById('clarify-resolve-btn');
  if (resolveBtn) resolveBtn.onclick = () => resolveNeedsClarification(taskId, selected);
  const skipBtn = document.getElementById('clarify-skip-btn');
  if (skipBtn) skipBtn.onclick = () => resolveNeedsClarification(taskId, []);
  const acceptSuggestionBtn = document.querySelector('.clarify-accept-suggestion-btn');
  if (acceptSuggestionBtn) {
    acceptSuggestionBtn.onclick = () => {
      let paths = [];
      try { paths = JSON.parse(acceptSuggestionBtn.dataset.suggestedPaths || '[]'); } catch (e) { /* leave empty */ }
      resolveNeedsClarification(taskId, paths);
    };
  }
  const discussBtn = document.getElementById('clarify-discuss-btn');
  if (discussBtn) discussBtn.onclick = () => clarifyDiscussStart(taskId);
  wireProviderToggle('clarify-discuss-provider');
  document.querySelectorAll('.clarify-answer-option-btn').forEach((btn) => {
    btn.onclick = () => answerNeedsClarification(taskId, btn.dataset.answer);
  });
  const answerSubmitBtn = document.getElementById('clarify-answer-submit-btn');
  if (answerSubmitBtn) {
    answerSubmitBtn.onclick = () => {
      const text = (document.getElementById('clarify-answer-other').value || '').trim();
      if (!text) { alert('Type an answer first, or click one of the options above.'); return; }
      answerNeedsClarification(taskId, text);
    };
  }
  // Surface an existing (active or already-ended) discussion instead of leaving the
  // picker looking like nothing has been tried yet -- same "don't bury prior work"
  // reasoning as every other Discuss integration's own for-note/latest check.
  fetchJson('/api/task/needs-clarification/' + encodeURIComponent(taskId) + '/discuss/latest')
    .then((existing) => { if (existing) clarifyDiscussRenderPanel(taskId, existing); })
    .catch(() => { /* best-effort -- no prior session is the common case */ });
}

async function resolveNeedsClarification(taskId, paths) {
  try {
    const res = await fetch(`/api/task/needs-clarification/${encodeURIComponent(taskId)}/resolve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.description || `${res.status}`);
    }
    closeDetail();
    if (activeTab === 'needs-clarification') renderQueueTab('needs-clarification');
  } catch (e) {
    alert(`Could not resolve '${taskId}': ` + e.message);
  }
}

async function answerNeedsClarification(taskId, answer) {
  try {
    const res = await fetch(`/api/task/needs-clarification/${encodeURIComponent(taskId)}/answer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.description || `${res.status}`);
    }
    closeDetail();
    if (activeTab === 'needs-clarification') renderQueueTab('needs-clarification');
  } catch (e) {
    alert(`Could not answer '${taskId}': ` + e.message);
  }
}

async function openDetail(state, id) {
  const task = await fetchJson(`/api/task/${state}/${encodeURIComponent(id)}`);
  // /api/task/<state>/<id> doesn't stamp _foundState (only task-anywhere does); carry the
  // state we already know so renderTaskDetailModal can decide whether to poll for updates.
  if (!task._foundState) task._foundState = state;
  renderTaskDetailModal(task);
}

// Workers tab click-through: an instance's currentTaskId doesn't say which queue state
// to look in (worker=drafting, review-runner=review, apply-runner=approved) -- the
// backend searches for us (see /api/task-anywhere) instead of guessing here.
async function openTaskAnywhere(taskId) {
  try {
    const task = await fetchJson(`/api/task-anywhere/${encodeURIComponent(taskId)}`);
    renderTaskDetailModal(task);
  } catch (e) {
    alert('Could not load task details: ' + e.message);
  }
}

function closeDetail() {
  stopTaskDetailAutoRefresh();
  document.getElementById('modal-backdrop').classList.remove('open');
  deepDiveDetailCache = null; // force a fresh fetch next time any project's modal opens
}
document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') closeDetail(); });

// Static reference data, not fetched from the server -- mirrors the task sources this
// package's own src/task-sources.js registers (priority order documented there). A
// consumer project can register additional sources at priority 30/50/60; this encyclopedia
// Job List rows -- name, priority, worker type, description, domain -- all come from
// /api/job-types (server-side, load_topology()-driven), so this template no longer
// carries a JOB_TYPES const that drifted from the real registry.

// Unmerged Branches tab (2026-08-18): closes the "sandbox" visibility gap -- a pushed
// agent/<task.id> branch previously sat invisible until someone happened to go looking,
// which is exactly what let a real apply failure quietly mask itself as "done" with
// nothing actually landed. One click here does the full fetch/merge/push/live-sync
// sequence server-side (see app.py's api_git_merge_branch) instead of the manual clone/
// branch/merge/push dance that incident required by hand.
async function renderBranchesTab() {
  const main = document.getElementById('main');
  let branches;
  try {
    branches = await fetchJson('/api/git/unmerged-branches');
  } catch (e) {
    main.innerHTML = `<div class="empty">Error loading branches: ${escapeHtml(e.message)}</div>`;
    return;
  }
  if (branches.length === 0) {
    main.innerHTML = '<div class="empty">Nothing pushed-but-unmerged -- the live copy is caught up.</div>';
    return;
  }
  main.innerHTML = branches.map((b) => {
    // willConflict is a git merge-tree preview (app.py's _check_merge_conflict) -- a
    // real 3-way merge computed entirely against the object database, no working tree
    // touched -- run fresh every time this tab loads, not just at merge time. Added
    // after a real near-miss (2026-08-18): two branches that independently created the
    // same new file only revealed that conflict as an opaque error AFTER a merge was
    // already attempted. null means the check itself failed (not "no conflict") --
    // shown as unknown, never silently treated as safe.
    const conflictBadge = b.willConflict === true
      ? `<span class="badge bad" title="Conflicts on: ${escapeAttr((b.conflictFiles || []).join(', '))}">⚠ will conflict</span>`
      : b.willConflict === null
        ? `<span class="badge warn" title="Could not preview this merge -- outcome unknown until attempted.">? conflict unknown</span>`
        : '';
    const behindBadge = typeof b.behind === 'number' && b.behind > 0
      ? `<span class="badge" style="background:var(--panel);color:var(--muted)" title="master has moved ${b.behind} commit${b.behind === 1 ? '' : 's'} since this branch was forked -- git's 3-way merge still only applies this branch's OWN changes, so being behind alone is not itself dangerous.">${b.behind} behind</span>`
      : '';
    // A branch owned by an unfinished coordinator hub (a stacked file-decompose branch
    // still missing its wiring commit + gate pass) -- merging it now ships an incomplete
    // decomposition. The merge endpoint 409s it without {force:true}.
    const hubMidFlight = b.hub && !b.hub.readyToMerge;
    const hubBadge = b.hub
      ? (hubMidFlight
        ? `<span class="badge bad" title="Hub ${escapeAttr(b.hub.id)}: ${b.hub.progress.done}/${b.hub.progress.total} done${b.hub.integrationGate.status ? ', gate ' + b.hub.integrationGate.status : ''}">⚠ hub mid-flight</span>`
        : `<span class="badge ok" title="Coordinator hub complete">✓ hub complete</span>`)
      : '';
    return `
    <div class="worker-card" data-branch-row="${escapeAttr(b.branch)}" data-open-branch="${escapeAttr(b.branch)}" style="cursor:pointer">
      <div class="row">
        <span class="id">${escapeHtml(b.title)}</span>
        <div class="badge-col">
          ${hubBadge}
          ${conflictBadge}
          <span class="badge warn">${b.ahead} commit${b.ahead === 1 ? '' : 's'} ahead</span>
          ${behindBadge}
        </div>
      </div>
      <div class="meta">
        ${b.domain ? `domain <strong>${escapeHtml(b.domain)}</strong>${b.source ? ' · source <strong>' + escapeHtml(b.source) + '</strong>' : ''} · ` : ''}
        pushed ${fmtAge((Date.now() - new Date(b.pushedAt).getTime()) / 1000)} ago
        ${!b.matchedTaskState ? ' · <span title="No matching queue/ task file found -- label is the branch\'s own last commit subject.">no task record found</span>' : ''}
      </div>
      ${b.description ? `<div style="margin-top:6px;font-size:13px;color:var(--text)">${escapeHtml(b.description)}</div>` : ''}
      <div class="meta" style="font-family:monospace;font-size:11px;margin-top:4px">${escapeHtml(b.branch)}</div>
      <div class="row" style="margin-top:8px">
        <button class="action" data-merge-branch="${escapeAttr(b.branch)}" data-will-conflict="${b.willConflict === true}" data-conflict-files="${escapeAttr((b.conflictFiles || []).join(', '))}" data-hub-midflight="${hubMidFlight === true}" data-hub-status="${escapeAttr(b.hub ? b.hub.progress.done + '/' + b.hub.progress.total + ' done' + (b.hub.integrationGate.status ? ', gate ' + b.hub.integrationGate.status : '') : '')}">Merge to ${escapeHtml(b.mainBranch)}</button>
      </div>
    </div>
  `;
  }).join('');

  main.querySelectorAll('[data-open-branch]').forEach((card) => {
    card.onclick = (e) => {
      // Don't hijack the Merge button's own click -- that has its own handler and
      // confirm() flow below, opening the history modal underneath it would be surprising.
      if (e.target.closest('[data-merge-branch]')) return;
      const b = branches.find((x) => x.branch === card.dataset.openBranch);
      if (b) renderBranchDetailModal(b);
    };
  });

  main.querySelectorAll('[data-merge-branch]').forEach((btn) => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const branch = btn.dataset.mergeBranch;
      const midFlight = btn.dataset.hubMidflight === 'true';
      const confirmMsg = btn.dataset.willConflict === 'true'
        ? `"${branch}" is flagged as WILL CONFLICT with master on: ${btn.dataset.conflictFiles}.\n\nThe merge will very likely fail and need manual resolution. Attempt it anyway?`
        : midFlight
          ? `"${branch}" belongs to a coordinator hub that is NOT finished (${btn.dataset.hubStatus}).\n\nMerging now ships an incomplete decomposition -- the moved routes will 404 until the wiring task lands. Force the merge anyway?`
          : `Merge "${branch}" into master and sync the live dashboard?`;
      if (!confirm(confirmMsg)) return;
      btn.disabled = true;
      btn.textContent = 'Merging...';
      try {
        const resp = await fetch(`/api/git/branches/${encodeURIComponent(branch)}/merge`, {
          method: 'POST',
          headers: midFlight ? { 'Content-Type': 'application/json' } : {},
          body: midFlight ? JSON.stringify({ force: true }) : undefined,
        });
        const result = await resp.json();
        if (!resp.ok || !result.succeeded) throw new Error(result.reason || `HTTP ${resp.status}`);
        if (result.liveSync && result.liveSync.restartTriggered) {
          btn.textContent = 'Merged -- dashboard reloading...';
          // Werkzeug's reloader restart is near-instant but not synchronous with this
          // response -- give it a moment, then just re-render; if it's still mid-restart
          // renderMain()'s own try/catch shows a normal "disconnected" state until the
          // next 5s poll succeeds, same as any other brief connection drop.
          setTimeout(() => renderMain(), 1500);
        } else {
          await renderBranchesTab();
        }
      } catch (e) {
        alert('Merge failed: ' + e.message);
        await renderBranchesTab();
      }
    };
  });
}

// Branch detail modal (2026-08-18): the card itself only ever showed the tip commit's
// subject line -- selecting a branch with several commits gave no way to read what it
// actually did short of a manual `git log` on the box running the dashboard. Reuses the
// same #modal-backdrop/#modal-content + closeDetail() plumbing renderTaskDetailModal uses.
async function renderBranchDetailModal(b) {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  content.innerHTML = `<button class="close" onclick="closeDetail()">&times;</button><h2>${escapeHtml(b.title)}</h2><div class="meta">Loading history...</div>`;
  backdrop.classList.add('open');
  let data;
  try {
    data = await fetchJson(`/api/git/branches/${encodeURIComponent(b.branch)}/commits`);
  } catch (e) {
    content.innerHTML = `<button class="close" onclick="closeDetail()">&times;</button><h2>${escapeHtml(b.title)}</h2><div class="meta" style="color:var(--bad)">Error loading history: ${escapeHtml(e.message)}</div>`;
    return;
  }
  let html = `<button class="close" onclick="closeDetail()">&times;</button><h2>${escapeHtml(b.title)}</h2>`;
  html += `<div class="meta" style="font-family:monospace;font-size:11px">${escapeHtml(b.branch)} → ${escapeHtml(b.mainBranch)}</div>`;
  if (b.domain) html += `<div class="field-label">Domain / Source</div><div>${escapeHtml(b.domain)} / ${escapeHtml(b.source || '')}</div>`;
  if (b.description) html += `<div class="field-label">What this changes</div><div>${escapeHtml(b.description)}</div>`;

  // Coordinator hub status -- a stacked file-decompose branch is a slice of a multi-task
  // hub, not a finished unit. Show where the hub stands and whether it's safe to merge.
  const hub = data.hub;
  if (hub) {
    const p = hub.progress || {};
    const gate = (hub.integrationGate || {}).status;
    html += `<div class="field-label">Coordinator hub</div>`;
    html += `<div class="worker-card" style="margin:4px 0">`;
    if (!hub.readyToMerge) {
      html += `<div class="badge bad" style="margin-bottom:6px">⚠ mid-flight — not ready to merge</div>`;
    } else {
      html += `<div class="badge ok" style="margin-bottom:6px">✓ hub complete</div>`;
    }
    html += `<div class="meta">${escapeHtml(hub.title || hub.id)} · ${p.done}/${p.total} task(s) done`
      + (gate ? ` · integration gate <strong>${escapeHtml(gate)}</strong>` : '') + `</div>`;
    if (hub.blockedReason) html += `<div class="meta" style="color:var(--bad);margin-top:4px">${escapeHtml(hub.blockedReason)}</div>`;
    html += `<div class="task-history" style="margin-top:6px">` + (hub.subTasks || []).map((st) =>
      `<div class="task-history-row"><span class="task-history-stage">${escapeHtml(st.title || st.id)}</span> `
      + `<span class="badge ${st.status === 'done' || st.status === 'merged' ? 'ok' : st.status === 'blocked' || st.status === 'needs-clarification' ? 'bad' : ''}">${escapeHtml(st.status || '?')}</span></div>`
    ).join('') + `</div>`;
    const checks = (hub.integrationGate || {}).checks;
    if (checks && checks.length) {
      html += `<div class="task-history" style="margin-top:4px">` + checks.map((ck) =>
        `<div class="task-history-row"><span class="task-history-stage">gate: ${escapeHtml(ck.name)}</span> `
        + `<span class="badge ${ck.status === 'pass' ? 'ok' : ck.status === 'fail' ? 'bad' : ''}">${escapeHtml(ck.status)}</span>`
        + (ck.detail ? `<pre>${escapeHtml(ck.detail)}</pre>` : '') + `</div>`
      ).join('') + `</div>`;
    }
    html += `</div>`;
  }

  html += `<div class="field-label">Commits (${data.commits.length}, newest first)</div>`;
  if (!data.commits.length) {
    html += `<div class="meta">No commits found ahead of ${escapeHtml(b.mainBranch)}.</div>`;
  } else {
    html += data.commits.map((c) => {
      const when = c.date ? new Date(c.date).toLocaleString() : '';
      let row = `<div class="worker-card" style="margin:4px 0">`
        + `<div class="task-history-row"><span class="task-history-stage">${escapeHtml(c.subject)}</span> `
        + `<span class="meta">${escapeHtml(c.author)} · ${escapeHtml(when)} · <code>${escapeHtml(c.sha.slice(0, 8))}</code></span></div>`;
      // The commit's own message body -- and, when the Task: trailer resolves, that
      // task's REAL pipeline log (plan → implement tiers → review votes → disposition).
      if (c.task) {
        const t = c.task;
        row += `<div class="meta" style="margin-top:2px">task <code>${escapeHtml(t.id)}</code> · ${escapeHtml(t.state || '?')}`
          + (t.terminalDisposition ? ` · ${escapeHtml(t.terminalDisposition)}` : '')
          + (t.reviewVotes ? ` · review ${escapeHtml(t.reviewVotes)}` : '') + `</div>`;
        if (t.description) row += `<div style="font-size:12px;margin-top:4px">${escapeHtml(t.description)}</div>`;
        row += `<div class="task-history" style="margin-top:6px">` + (t.history || []).map((e) => {
          const eWhen = e.at ? new Date(e.at).toLocaleTimeString() : '';
          return `<div class="task-history-row"><span class="task-history-stage">${escapeHtml(e.stage || '?')}</span> `
            + `<span class="meta">${escapeHtml(eWhen)}</span>`
            + (e.detail ? ` <span style="font-size:12px">${escapeHtml(e.detail)}</span>` : '') + `</div>`;
        }).join('') + `</div>`;
      } else {
        if (c.taskId) row += `<div class="meta" style="margin-top:2px">task <code>${escapeHtml(c.taskId)}</code> — no queue record found</div>`;
        if (c.body) row += `<pre>${escapeHtml(c.body)}</pre>`;
      }
      return row + `</div>`;
    }).join('');
  }
  content.innerHTML = html;
}

async function renderJobListTab() {
  const main = document.getElementById('main');
  let jobTypes;
  try {
    jobTypes = await fetchJson('/api/job-types');
  } catch (e) {
    jobTypes = null;
  }
  // 2026-08-26, Grimmethy: "After looking at pipeline map I've realized that it really
  // should just be an extension of Job List instead of a new tab entirely" -- folded in
  // here rather than kept as its own tab. Row list is /api/pipeline-map's sources (straight
  // off the real registry via --dump-topology); /api/job-types carries the per-row
  // description/domain/priority/worker-type (also registry-driven, load_topology()) and the
  // editable state. Both include AGENT_MANAGER_REGISTER_PATH plugin sources, so neither
  // can drift the way the old client-side JOB_TYPES const did.
  let pipelineMap;
  try {
    pipelineMap = await fetchJson('/api/pipeline-map');
  } catch (e) {
    pipelineMap = null;
  }
  const activeByName = {};
  const alwaysActiveByName = {};
  const priorityByName = {};
  const approvalModeByName = {};
  const workerTypeByName = {};
  const timesPerformedByName = {};
  const availableByName = {};
  (jobTypes || []).forEach((j) => {
    activeByName[j.name] = j.active;
    alwaysActiveByName[j.name] = j.alwaysActive;
    priorityByName[j.name] = j.priority;
    approvalModeByName[j.name] = j.approvalMode;
    workerTypeByName[j.name] = j.workerType;
    timesPerformedByName[j.name] = j.timesPerformed;
    availableByName[j.name] = j.available;
  });
  const descByName = {};
  const domainByName = {};
  (jobTypes || []).forEach((j) => { descByName[j.name] = j.description; domainByName[j.name] = j.domain; });

  const mapAvailable = !!(pipelineMap && pipelineMap.available);
  // Fall back to /api/job-types' own rows when /api/pipeline-map itself is unavailable
  // (node not on PATH, script error, etc.) -- /api/job-types has a committed topology
  // snapshot fallback so it stays populated; same "degrade, don't blank the tab" treatment.
  const sourceList = mapAvailable
    ? pipelineMap.sources
    : (jobTypes || []).map((j) => ({ name: j.name, priority: j.priority, liveCounts: {} }));

  // Backbone strip: total live count per stage, summed across every source at once.
  const stageTotals = {};
  for (const stage of PIPELINE_STAGE_ORDER) stageTotals[stage] = 0;
  for (const s of sourceList) {
    for (const [stage, count] of Object.entries(s.liveCounts || {})) {
      stageTotals[stage] = (stageTotals[stage] || 0) + count;
    }
  }
  const backboneHtml = mapAvailable ? `
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
      ${PIPELINE_STAGE_ORDER.map((stage) => `
        <div style="flex:1; min-width:110px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 12px; text-align:center;">
          <div style="font-size:22px; font-weight:700; color:${stageTotals[stage] > 0 ? 'var(--accent)' : 'var(--muted)'};">${stageTotals[stage]}</div>
          <div class="meta">${PIPELINE_STAGE_LABELS[stage]}</div>
        </div>
      `).join('<div style="align-self:center; color:var(--muted); font-size:18px;">→</div>')}
    </div>
  ` : '';

  // Sort by the EFFECTIVE priority (server override if any, else the registry/JOB_TYPES
  // static default) -- not the bare static default -- so an edit actually reorders the
  // table.
  const rows = sourceList.slice()
    .map((j) => ({ ...j, priority: priorityByName[j.name] ?? j.priority }))
    .sort((a, b) => a.priority - b.priority)
    .map(j => {
    const alwaysActive = !!alwaysActiveByName[j.name];
    const isActive = jobTypes ? (activeByName[j.name] ?? true) : true;
    const checkbox = jobTypes
      ? `<input type="checkbox" class="job-type-toggle" data-source="${escapeAttr(j.name)}" ${isActive ? 'checked' : ''} ${alwaysActive ? 'disabled title="Always active -- cannot be turned off"' : ''}>`
      : `<span class="meta">?</span>`;
    // Priority cell: click-to-type input, relying on the browser's own native number-input
    // spinner for the "up1/down1" arrows the Brain Dump request asked for -- a separate
    // pair of custom buttons above/below the input (the original implementation) was
    // redundant with that native control and looked like a duplicate widget. Disabled
    // entirely when /api/job-types failed to load, same convention the checkbox already
    // uses for that case.
    const priorityCell = jobTypes
      ? `<input type="number" class="priority-input" data-source="${escapeAttr(j.name)}" value="${j.priority}">`
      : `<span class="meta">${j.priority}</span>`;
    // Approval mode (three-tier approval mode, 2026-07-26): a plain native <select> --
    // there's no custom-dropdown component anywhere in this dashboard, and a 3-option
    // enum is exactly what a native select is for. 'auto' applies automatically once
    // Ornith approves; 'approve'/'prompt' both wait for a manual Apply click on the
    // Approved tab -- 'prompt' only differs in getting an active badge there instead of
    // a plain count, never in whether this automatic loop touches it.
    const approvalMode = approvalModeByName[j.name] ?? 'auto';
    const approvalModeCell = jobTypes
      ? `<select class="approval-mode-select" data-source="${escapeAttr(j.name)}">
          ${['auto', 'prompt', 'approve'].map((m) => `<option value="${m}" ${m === approvalMode ? 'selected' : ''}>${m}</option>`).join('')}
        </select>`
      : `<span class="meta">${approvalMode}</span>`;
    // Worker Type: which worker actually claims this source's tasks -- 'ornith' (the
    // local, low-reasoning worker) or 'reasoning' (the Claude-backed high-reasoning
    // worker). Note for adhoc/research_task specifically: their actual draft call is
    // hardcoded to Claude regardless of this setting (see model-provider.js's
    // reasoningTierFor() comment), so overriding those two rows to 'ornith' only changes
    // which worker's claim filter picks the task up, not what drafts it.
    const workerType = workerTypeByName[j.name] ?? 'ornith';
    const workerTypeCell = jobTypes
      ? `<select class="worker-type-select" data-source="${escapeAttr(j.name)}">
          ${['ornith', 'reasoning'].map((w) => `<option value="${w}" ${w === workerType ? 'selected' : ''}>${w}</option>`).join('')}
        </select>`
      : `<span class="meta">${workerType}</span>`;
    // Times Performed: cumulative, all-time count of how many tasks this job type has
    // ever generated (Brain Dump, 2026-08-23) -- independent of the Active/Priority/
    // Approval Mode columns above, which only affect FUTURE tasks. Read-only here; the
    // one way to change it is the "Reset counts" button below, which zeroes every row at
    // once (see /api/job-types/reset-counts's own comment for why never a single row).
    const timesPerformed = timesPerformedByName[j.name] ?? 0;
    // Available: how many Strong-rated candidates this source's own backlog doc (e.g.
    // ARCH_REVIEW_CANDIDATES.md) still has waiting, not yet claimed by any in-queue
    // fulfillment task (app.py's available_candidate_counts()). Only a handful of sources
    // have an enumerable backlog doc at all (arch_review, arch_import_review,
    // observability_fix, performance_fix) -- null for everything else, shown as a blank
    // cell rather than a misleading 0 for a source whose real backlog size just isn't
    // tracked anywhere (an inbox folder, a flags file, external scanner output, ...).
    const available = jobTypes ? availableByName[j.name] : null;
    const availableCell = available == null ? '' : String(available);
    const behaviorCell = mapAvailable ? pipelineFlagBadges(j) : '<span class="meta">?</span>';
    const liveCell = mapAvailable
      ? (Object.entries(j.liveCounts || {}).filter(([, c]) => c > 0)
          .map(([stage, c]) => `<span class="badge warn" title="${PIPELINE_STAGE_LABELS[stage] || stage}">${PIPELINE_STAGE_LABELS[stage] || stage}: ${c}</span>`)
          .join(' ') || '<span class="meta">idle</span>')
      : '<span class="meta">?</span>';
    // Turns (min/avg/max) (2026-08-26, Grimmethy: "add turnsUsed recording... a data
    // point we track for each job type in the Job List itself (min/max/average)" --
    // prompted by the Chat-panel turn-budget investigation finding zero telemetry for
    // whether ANY runPlanWithTools()-backed source's turn cap is actually enough). Only
    // populated for sources that have gone through a real recorded call at least once
    // (model-stats.db's turns_used column, model-stats-db.js's own turns-summary event)
    // -- a blank cell means "not instrumented yet or never called," not "uses 0 turns."
    const turnsCell = j.turnsStats
      ? `${j.turnsStats.minTurns} / ${Math.round(j.turnsStats.avgTurns * 10) / 10} / ${j.turnsStats.maxTurns}<span class="meta"> (n=${j.turnsStats.calls})</span>`
      : '<span class="meta">—</span>';
    return `
    <tr>
      <td>${checkbox}</td>
      <td>${priorityCell}</td>
      <td>${approvalModeCell}</td>
      <td>${workerTypeCell}</td>
      <td><a href="#" class="job-log-link" data-job-log="${escapeAttr(j.name)}" title="Recent runs of this job type">${escapeHtml(j.name)}</a></td>
      <td>${domainByName[j.name] ?? '—'}</td>
      <td>${behaviorCell}</td>
      <td>${liveCell}</td>
      <td>${turnsCell}</td>
      <td>${timesPerformed}</td>
      <td>${availableCell}</td>
      <td>${escapeHtml(descByName[j.name] ?? '')}</td>
    </tr>
  `;
  }).join('');

  const unregistered = mapAvailable ? (pipelineMap.unregistered || []) : [];
  const unregisteredHtml = unregistered.length ? `
    <p class="meta" style="margin-top:16px;">Tasks in the queue under a source name with no matching registry entry (a renamed/retired source with old work still sitting around):</p>
    <table><thead><tr><th>Source name</th><th>Live counts</th></tr></thead><tbody>
      ${unregistered.map((u) => `<tr><td>${escapeHtml(u.name)}</td><td>${Object.entries(u.liveCounts).map(([st, c]) => `${PIPELINE_STAGE_LABELS[st] || st}: ${c}`).join(', ')}</td></tr>`).join('')}
    </tbody></table>
  ` : '';

  // Hand-authored detail insets: the two real multi-tier paths that don't reduce to a
  // single registry flag, kept as static text/boxes reviewed by hand (rare-changing)
  // rather than auto-generated.
  const detailInsetsHtml = mapAvailable ? `
    <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:24px;">
      <div style="flex:1; min-width:320px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px;">
        <div style="font-weight:600; margin-bottom:8px;">Adhoc draft escalation (domain:'adhoc', source:'manual')</div>
        <div class="meta" style="line-height:1.7;">
          1. <b>harness-search</b> (adhoc-harness-draft.js) — cheap, single-shot local-model pass. Declines (falls through) if it can't confidently ground a change.<br>
          2. <b>local-agentic</b> (local-agentic-draft.js) — multi-turn local-model pass with real read-only Read/Grep/Glob tool access. Opt-in via <code>AGENT_MANAGER_LOCAL_AGENTIC_ADHOC=true</code>. Declines the same way.<br>
          3. <b>Claude agentic</b> (adhoc-agentic-draft.js) — real Claude Code CLI call with Read/Grep/Glob/Edit/Write/Bash, the only tier that can actually run verification commands. Always available, blocked only by the manual Claude-pause kill switch.<br>
          Any tier can resolve to <b>decompose</b> (task judged too large — queues 2+ fresh adhoc sub-tasks to <code>queue/adhoc/</code> instead of a diff) or <b>needs-human-decision</b> (routes to <code>queue/needs-clarification/</code>, never judged by an automatic reviewer).
        </div>
      </div>
      <div style="flex:1; min-width:320px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px;">
        <div style="font-weight:600; margin-bottom:8px;">Split escape hatch (candidate-fulfillment sources — see "split-capable" badge)</div>
        <div class="meta" style="line-height:1.7;">
          Implement can output <code>{"mode":"split","candidates":[...]}</code> instead of a diff when the real candidate genuinely doesn't fit one atomic JSON edit (prompts.js's candidateSplitInstructions). Skips critique (no diff to critique) and goes straight to review, judged on scope-coverage rather than "does it contain code." At apply time, the sub-candidates are written back into the <i>same</i> candidates doc the original came from (the exact appender arch_discovery's own apply already uses) — each one then flows through the normal pickup loop on a later tick, small enough to land as its own single edit.
        </div>
      </div>
    </div>
  ` : '';

  main.innerHTML = `<div style="margin-bottom:10px"><button id="reset-job-type-counts" class="secondary">Reset counts</button></div>`
    + backboneHtml
    + `<table><thead><tr><th>Active</th><th>Priority</th><th>Approval Mode</th><th>Worker Type</th><th>Source</th><th>Domain</th><th>Behavior</th><th>Live (in-flight)</th><th title="Min / Avg / Max turnsUsed across every recorded runPlanWithTools() call for this source">Turns (min/avg/max)</th><th>Times Performed</th><th>Available</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`
    + unregisteredHtml
    + detailInsetsHtml;

  main.querySelectorAll('.job-log-link').forEach((a) => {
    a.onclick = (e) => { e.preventDefault(); openJobLog(a.dataset.jobLog); };
  });

  const resetButton = document.getElementById('reset-job-type-counts');
  if (resetButton) {
    resetButton.onclick = async () => {
      if (!confirm('Reset the "Times Performed" counter for every job type back to 0?')) return;
      resetButton.disabled = true;
      try {
        await fetch('/api/job-types/reset-counts', { method: 'POST' });
        await renderJobListTab();
      } catch (e) {
        alert('Could not reset counts: ' + e.message);
        resetButton.disabled = false;
      }
    };
  }

  main.querySelectorAll('.job-type-toggle').forEach((cb) => {
    cb.onchange = async () => {
      cb.disabled = true;
      try {
        await fetch('/api/job-types/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: cb.dataset.source, active: cb.checked }),
        });
      } catch (e) {
        alert('Could not update job type: ' + e.message);
        cb.checked = !cb.checked;
      }
      cb.disabled = false;
    };
  });

  // Submits a new priority for `source`, re-rendering the (now possibly re-sorted) tab
  // on success -- reverting the input's displayed value on failure rather than leaving
  // it showing an unsaved edit.
  const submitPriority = async (source, newPriority, revertTo) => {
    const controls = main.querySelectorAll(`[data-source="${CSS.escape(source)}"]`);
    controls.forEach((el) => { el.disabled = true; });
    try {
      await fetch('/api/job-types/priority', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: source, priority: newPriority }),
      });
      await renderJobListTab();
    } catch (e) {
      alert('Could not update priority: ' + e.message);
      controls.forEach((el) => { el.disabled = false; });
      const input = main.querySelector(`input.priority-input[data-source="${CSS.escape(source)}"]`);
      if (input) input.value = revertTo;
    }
  };

  main.querySelectorAll('.priority-input').forEach((input) => {
    const commit = () => {
      const parsed = parseInt(input.value, 10);
      const original = priorityByName[input.dataset.source];
      if (Number.isNaN(parsed) || parsed === original) { input.value = original; return; }
      submitPriority(input.dataset.source, parsed, original);
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
  });

  main.querySelectorAll('.approval-mode-select').forEach((select) => {
    select.onchange = async () => {
      const source = select.dataset.source;
      const original = approvalModeByName[source];
      const mode = select.value;
      select.disabled = true;
      try {
        await fetch('/api/job-types/approval-mode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: source, mode }),
        });
      } catch (e) {
        alert('Could not update approval mode: ' + e.message);
        select.value = original;
      }
      select.disabled = false;
    };
  });

  main.querySelectorAll('.worker-type-select').forEach((select) => {
    select.onchange = async () => {
      const source = select.dataset.source;
      const original = workerTypeByName[source];
      const workerType = select.value;
      select.disabled = true;
      try {
        await fetch('/api/job-types/worker-type', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: source, workerType }),
        });
      } catch (e) {
        alert('Could not update worker type: ' + e.message);
        select.value = original;
      }
      select.disabled = false;
    };
  });
}

// Plugins tab -- enable/disable AGENT_MANAGER_REGISTER_PATH plugins (src/config.js's
// ensureRegistered() loads only the enabled ones from plugins.json) and register a new one
// by path. Same "edit persists to a config file the running pipeline re-reads per tick"
// shape as the Job List toggles.
// Pipeline-map helpers, shared by the Job List tab above (2026-08-26, Grimmethy: "I want a
// live pipeline map for architecture review... right now I don't have any way of
// visualizing the process" -- then, after seeing it as its own tab: "it really should just
// be an extension of Job List instead of a new tab entirely"). Topology comes straight from
// /api/pipeline-map, which shells out to src/task-sources.js's own --dump-topology CLI
// mode -- read fresh off the real registry every call, so this can never drift out of sync
// with the actual pipeline the way JOB_TYPES/TASK_SOURCE_CATALOG already have (confirmed
// live via queue-watchdog's drift-scan the same night: several real sources missing from
// both). Live counts are real queue/ contents, correlated by each task's own recorded
// source.
//
// STAGE_ORDER/STAGE_LABELS: the backbone every source flows through, in queue-state order
// -- not every source passes through every stage (advisoryProse skips critique inside
// drafting; emptyApproval/candidateFulfillment sources can deterministic-approve at
// review; directToMain sources skip approved/ entirely and land straight on main), but
// the STATES a task can literally sit in are the same fixed set for all of them.
const PIPELINE_STAGE_ORDER = ['pending', 'drafting', 'review', 'needs-clarification', 'awaiting-confirm', 'approved', 'blocked'];
const PIPELINE_STAGE_LABELS = {
  pending: 'Pending', drafting: 'Drafting', review: 'Review',
  'needs-clarification': 'Needs Clarification', 'awaiting-confirm': 'Awaiting Confirm',
  approved: 'Approved', blocked: 'Blocked',
};

// Scouted Repos tab (deep_dive, ADR-0019): list of every project_search Strong lead
// that's been cloned + community-graphed, click through to see what our workers picked
// out of it -- deep-dive-coverage.json's per-community progress plus the actual
// analysis/<slug>.md write-up apply-group-a.js's applyDeepDiveFindings appended.
async function renderDeepDiveTab() {
  const projects = await fetchJson('/api/deep-dive/projects');
  const main = document.getElementById('main');
  if (projects.length === 0) {
    main.innerHTML = '<div class="empty">No repos scouted yet -- project_search hasn\'t landed a Strong lead for deep_dive to pick up.</div>';
    return;
  }
  const rows = projects.map(p => `
    <tr class="clickable ${p.hotlist ? 'top-row' : ''}" data-slug="${escapeAttr(p.slug)}">
      <td onclick="event.stopPropagation()"><input type="checkbox" class="hotlist-toggle" data-slug="${escapeAttr(p.slug)}" ${p.hotlist ? 'checked' : ''} title="Move this repo to the top of the research priority list"></td>
      <td>${escapeHtml(p.slug)}</td>
      <td>${p.sourceUrl ? `<a href="${escapeAttr(p.sourceUrl)}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(p.sourceUrl)}</a>` : ''}</td>
      <td>${p.reviewedCount} / ${p.communityCount}</td>
      <td>${p.totalActionItems}</td>
      <td>${p.clonedAt ? new Date(p.clonedAt).toLocaleString() : ''}</td>
    </tr>
  `).join('');
  main.innerHTML = `<table><thead><tr><th>Hot</th><th>Project</th><th>Source</th><th>Communities Reviewed</th><th>Action Items</th><th>Cloned</th></tr></thead><tbody>${rows}</tbody></table>`;
  main.querySelectorAll('tr.clickable').forEach(row => {
    row.onclick = () => openDeepDiveDetail(row.dataset.slug);
  });
  main.querySelectorAll('.hotlist-toggle').forEach(cb => {
    cb.onclick = (e) => e.stopPropagation();
    cb.onchange = () => toggleHotlist(cb.dataset.slug, cb.checked);
  });
}

// Checking the box calls /api/deep-dive/projects/<slug>/hotlist, which flips a field on
// that project's deep-dive-coverage.json entry -- nextDeepDiveTask() (task-sources.js)
// reads the same field and drafts every remaining community in a hotlisted project ahead
// of the normal oldest-first rotation, regardless of how long other projects have been
// waiting. Re-renders the whole tab afterward so the row re-sorts to the top immediately
// rather than waiting for the next 5s poll.
async function toggleHotlist(slug, hotlist) {
  try {
    await fetch('/api/deep-dive/projects/' + encodeURIComponent(slug) + '/hotlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hotlist }),
    });
  } catch (e) {
    alert('Could not update hotlist: ' + e.message);
  }
  if (activeTab === 'deepdive') await renderDeepDiveTab();
}

// Cache of the last-opened project's detail response, so selecting a community can
// re-render just the items list (client-side filter) without a re-fetch.
let deepDiveDetailCache = null;

// Items written before apply-group-a.js started tagging "(community #N)" have
// communityId: null -- fall back to matching by name for those (ambiguous when multiple
// communities share a directory-based name, but still better than showing nothing).
function itemsForCommunity(items, community) {
  return items.filter((it) => (
    community.id != null && it.communityId != null
      ? it.communityId === community.id
      : it.community === community.name
  ));
}

function renderDeepDiveItems(items) {
  if (items.length === 0) return '<div class="empty">No action items for this selection.</div>';
  return items.map((it) => `
    <div class="worker-card">
      <div class="row">
        <span class="id">${escapeHtml(it.title)}</span>
        <span class="badge ${it.rating === 'Use' ? 'ok' : it.rating === 'Adapt' ? 'warn' : 'idle'}">${escapeHtml(it.rating || '')}</span>
      </div>
      <div class="meta">${escapeHtml(it.community || '')}${it.files ? ' · ' + escapeHtml(it.files) : ''}</div>
      <div style="margin-top:8px">${escapeHtml(it.rationale || '')}</div>
    </div>
  `).join('');
}

// Selected community's items render as an extra table row directly beneath the clicked
// row (an inline expansion), not in a separate section after the whole table -- clicking
// a community and then having to scroll past every other row to see its items (the
// original design) was confusing. Clicking an already-expanded row collapses it back.
function renderDeepDiveCommunityRows(detail, selectedIdx, items) {
  const rows = [];
  (detail.communities || []).forEach((c, i) => {
    const hasItems = (c.actionItemCount || 0) > 0;
    rows.push(`
      <tr class="${hasItems ? 'clickable' : ''} ${selectedIdx === i ? 'top-row' : ''}" data-community-idx="${i}">
        <td>${escapeHtml(c.name || '')}</td>
        <td>${c.lastReviewedAt ? new Date(c.lastReviewedAt).toLocaleString() : 'not yet reviewed'}</td>
        <td>${c.actionItemCount ?? '-'}</td>
      </tr>
    `);
    if (selectedIdx === i) {
      const shown = itemsForCommunity(items, { id: i, name: c.name });
      rows.push(`
        <tr>
          <td colspan="3" style="padding:0">
            <div style="padding:12px 4px 16px">
              <div class="field-label" style="margin-top:0">Ideas from "${escapeHtml(c.name)}" <a href="#" id="dd-collapse" style="margin-left:8px;font-weight:normal">(collapse)</a></div>
              ${renderDeepDiveItems(shown)}
            </div>
          </td>
        </tr>
      `);
    }
  });
  return rows.join('');
}

function renderDeepDiveDetailBody(detail, selectedIdx) {
  const items = detail.items || [];
  let html = `<div class="field-label">Communities (${(detail.communities || []).length}) -- click one with action items to see them inline</div>`;
  html += `<table><thead><tr><th>Name</th><th>Reviewed</th><th>Action Items</th></tr></thead><tbody>${renderDeepDiveCommunityRows(detail, selectedIdx, items)}</tbody></table>`;

  if (selectedIdx == null) {
    html += `<div class="field-label">All ideas picked from this repo</div>`;
    html += items.length === 0
      ? '<div class="empty">Nothing written up yet -- no community from this repo has cleared review.</div>'
      : renderDeepDiveItems(items);
  }
  return html;
}

function wireDeepDiveDetailHandlers(slug, selectedIdx) {
  document.querySelectorAll('#modal-content tr.clickable[data-community-idx]').forEach((row) => {
    const idx = Number(row.dataset.communityIdx);
    // Clicking the already-expanded row collapses it back rather than re-expanding it.
    row.onclick = () => openDeepDiveDetail(slug, idx === selectedIdx ? null : idx);
  });
  const collapse = document.getElementById('dd-collapse');
  if (collapse) collapse.onclick = (e) => { e.preventDefault(); openDeepDiveDetail(slug, null); };
}

async function openDeepDiveDetail(slug, selectedIdx = null) {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');

  // Re-opening the same project (selecting a different community) reuses the cached
  // fetch instead of re-fetching -- the underlying data can't have changed within one
  // modal session, and re-fetch would also flicker the "which row is highlighted" state.
  const detail = (deepDiveDetailCache && deepDiveDetailCache.slug === slug)
    ? deepDiveDetailCache
    : await fetchJson('/api/deep-dive/projects/' + encodeURIComponent(slug));
  deepDiveDetailCache = detail;

  let html = `<button class="close" onclick="closeDetail()">&times;</button><h2>${escapeHtml(detail.slug)}</h2>`;
  if (detail.sourceUrl) html += `<div><a href="${escapeAttr(detail.sourceUrl)}" target="_blank">${escapeHtml(detail.sourceUrl)}</a></div>`;
  html += renderDeepDiveDetailBody(detail, selectedIdx);

  content.innerHTML = html;
  backdrop.classList.add('open');
  wireDeepDiveDetailHandlers(slug, selectedIdx);
}

// --- Discovery tab -------------------------------------------------------------------
// arch_discovery ran for weeks with its only visible trace being generic queue rows
// scattered across the Job Status tabs (2026-08-22, Gypsy: "Discovery task is dopamine
// deprived"). The readouts already exist on each task (planResponse/implementResponse --
// the same detail modal every queue tab uses renders them via openTaskAnywhere), and the
// job's output already lands as AC-N blocks in the candidates doc; this tab just puts
// that existing state on one screen: which community the job is chewing on, which is
// next in rotation, what each run concluded, and the candidate write-ups produced.
let discoveryCandidatesCache = []; // last /api/discovery candidates -- the modal reads a block from here by id
// Survives the generic 5s re-render (module-level, same reasoning as queueSourceFilter):
// a graphify run yields a LOT of communities (186 on TaxHarvest), nearly all of them
// never-reviewed -- the full table would bury the runs/candidates sections this tab
// exists for, so the never-touched tail stays collapsed unless explicitly expanded.
let discoveryShowAllCommunities = false;

async function renderDiscoveryTab() {
  const d = await fetchJson('/api/discovery');
  discoveryCandidatesCache = d.candidates || [];
  const main = document.getElementById('main');
  if (!d.available) {
    main.innerHTML = '<div class="empty">No discovery state found for the active project -- community-coverage.json and the candidates doc appear once the project graph is built and arch_discovery has run.</div>';
    return;
  }

  const reviewed = d.communities.filter(c => c.lastReviewedAt).length;
  const inFlight = d.tasks.filter(t => t.state !== 'done');
  const doneRuns = d.tasks.filter(t => t.state === 'done');
  const nextCommunity = d.communities.find(c => c.id === d.nextCommunityId);
  const stats = `
    <div class="stat-row">
      <div class="stat"><strong>${reviewed} / ${d.communities.length}</strong>communities reviewed</div>
      <div class="stat"><strong>${inFlight.length}</strong>runs in flight</div>
      <div class="stat"><strong>${doneRuns.length}</strong>runs completed</div>
      <div class="stat"><strong>${d.candidates.length}</strong>candidates produced</div>
      <div class="stat"><strong>${nextCommunity ? escapeHtml(nextCommunity.name) : '--'}</strong>next up</div>
    </div>`;

  // Same order the job itself works in (nextArchDiscoveryTask's oldest-first rotation,
  // never-reviewed before any real timestamp), so the top of the table is always "what
  // discovery cares about right now".
  const sortedCommunities = [...d.communities].sort((a, b) =>
    (a.lastReviewedAt || '').localeCompare(b.lastReviewedAt || ''));
  // Only rows with something to say (in queue, next up, or actually reviewed) show by
  // default; the untouched tail collapses to a one-line count.
  const interesting = sortedCommunities.filter(c =>
    c.inFlightState || c.id === d.nextCommunityId || c.lastReviewedAt);
  const communities = discoveryShowAllCommunities ? sortedCommunities : interesting;
  const hiddenCount = sortedCommunities.length - communities.length;
  const communityRows = communities.map(c => {
    const status = c.inFlightState
      ? `<span class="badge warn">in queue: ${escapeHtml(c.inFlightState)}</span>`
      : c.id === d.nextCommunityId
        ? '<span class="badge ok">next up</span>'
        : c.lastReviewedAt
          ? '<span class="badge idle">reviewed</span>'
          : '<span class="badge idle">never reviewed</span>';
    return `<tr>
      <td>#${c.id} ${escapeHtml(c.name || '')}</td>
      <td>${status}</td>
      <td>${c.lastReviewedAt ? new Date(c.lastReviewedAt).toLocaleString() : ''}</td>
      <td>${c.lastCandidateCount ?? ''}</td>
    </tr>`;
  }).join('');

  const stateBadge = (s) => {
    const cls = s === 'done' ? 'ok' : s === 'blocked' ? 'bad'
      : (s === 'needs-clarification' || s === 'awaiting-confirm') ? 'warn' : 'idle';
    return `<span class="badge ${cls}">${escapeHtml(s)}</span>`;
  };
  const runRows = d.tasks.map(t => {
    // Whichever field carries the run's actual outcome -- same signal priority as
    // _adhoc_task_excerpt server-side.
    const result = t.blockedReason
      ? `<span style="color:var(--bad)">${escapeHtml(t.blockedReason.slice(0, 140))}${t.blockedReason.length > 140 ? '…' : ''}</span>`
      : t.doneMarker
        ? escapeHtml(t.doneMarker)
        : t.hasImplement ? 'draft written' : t.hasPlan ? 'plan written' : '';
    return `<tr class="clickable" data-task-id="${escapeAttr(t.id)}" title="Click for the full readout (plan, draft, review verdicts)">
      <td>${escapeHtml(t.title)}</td>
      <td>${stateBadge(t.state)}</td>
      <td>${t.createdAt ? new Date(t.createdAt).toLocaleString() : ''}</td>
      <td class="meta">${result}</td>
    </tr>`;
  }).join('');
  const runsTable = d.tasks.length === 0
    ? '<div class="empty">No arch-discovery runs in the queue yet.</div>'
    : `<table><thead><tr><th>Run</th><th>State</th><th>Created</th><th>Result</th></tr></thead><tbody>${runRows}</tbody></table>`;

  const candidateRows = d.candidates.map(c => `
    <tr class="clickable" data-candidate-id="${c.id}" title="Click to read the full write-up">
      <td><span class="bd-serial">AC-${String(c.id).padStart(3, '0')}</span></td>
      <td>${escapeHtml(c.title)}</td>
      <td>${c.strength ? `<span class="badge ${c.strength === 'Strong' ? 'ok' : 'idle'}">${escapeHtml(c.strength)}</span>` : ''}</td>
      <td class="meta">${c.files.slice(0, 3).map(escapeHtml).join(', ')}${c.files.length > 3 ? ` +${c.files.length - 3} more` : ''}</td>
    </tr>`).join('');
  const candidatesTable = d.candidates.length === 0
    ? '<div class="empty">No candidates written yet.</div>'
    : `<table><thead><tr><th>ID</th><th>Candidate</th><th>Strength</th><th>Files</th></tr></thead><tbody>${candidateRows}</tbody></table>`;

  const communityToggle = (discoveryShowAllCommunities || hiddenCount > 0)
    ? `<div style="margin:8px 0 0"><button class="secondary" id="discovery-show-all">${
        discoveryShowAllCommunities
          ? 'Show active communities only'
          : `Show all ${sortedCommunities.length} communities (${hiddenCount} never reviewed hidden)`
      }</button></div>`
    : '';

  // Runs and candidates first -- they're what this tab exists to surface; the (large)
  // community rotation table is reference material below them.
  main.innerHTML = stats
    + `<div class="field-label">Discovery Runs</div>` + runsTable
    + `<div class="field-label">Candidates Produced${d.candidatesPath ? ` <span style="text-transform:none;letter-spacing:0">(${escapeHtml(d.candidatesPath)})</span>` : ''}</div>`
    + candidatesTable
    + `<div class="field-label">Communities (rotation order)</div>`
    + `<table><thead><tr><th>Community</th><th>Status</th><th>Last Reviewed</th><th>Candidates Last Run</th></tr></thead><tbody>${communityRows}</tbody></table>`
    + communityToggle;

  main.querySelectorAll('tr[data-task-id]').forEach(row => {
    row.onclick = () => openTaskAnywhere(row.dataset.taskId);
  });
  main.querySelectorAll('tr[data-candidate-id]').forEach(row => {
    row.onclick = () => openDiscoveryCandidate(parseInt(row.dataset.candidateId, 10));
  });
  const toggleBtn = document.getElementById('discovery-show-all');
  if (toggleBtn) toggleBtn.onclick = () => {
    discoveryShowAllCommunities = !discoveryShowAllCommunities;
    renderDiscoveryTab();
  };
}

// Same borrow-the-task-modal-DOM pattern as renderCaseInfoModal -- one shared backdrop,
// closeDetail() closes everything.
function openDiscoveryCandidate(id) {
  const c = discoveryCandidatesCache.find(x => x.id === id);
  if (!c) return;
  const content = document.getElementById('modal-content');
  content.innerHTML = `<button class="close" onclick="closeDetail()">&times;</button>`
    + `<h2>AC-${String(c.id).padStart(3, '0')} · ${escapeHtml(c.title)}</h2>`
    + `<pre>${escapeHtml(c.content)}</pre>`;
  document.getElementById('modal-backdrop').classList.add('open');
}

// Job List tab click-through: a source -> its last ~25 runs (any queue state, done, or
// archived), newest first, each drillable to the task-detail modal. Borrows the shared
// task-modal DOM like openDiscoveryCandidate; the runs table mirrors the Discovery tab's.
async function openJobLog(source) {
  const content = document.getElementById('modal-content');
  let data;
  try {
    data = await fetchJson(`/api/job-log/${encodeURIComponent(source)}`);
  } catch (e) {
    alert('Could not load job log: ' + e.message);
    return;
  }
  const stateBadge = (s) => {
    const cls = s === 'done' ? 'ok' : s === 'blocked' ? 'bad'
      : (s === 'needs-clarification' || s === 'awaiting-confirm') ? 'warn' : 'idle';
    return `<span class="badge ${cls}">${escapeHtml(s)}</span>`;
  };

    ? `<div class="empty">No runs of <code>${escapeHtml(source)}</code> in the queue yet.</div>`
    : `<table><thead><tr><th>Run</th><th>State</th><th>When</th><th>Outcome</th></tr></thead><tbody>${rows}</tbody></table>`;

// Time Tracking tab (2026-08-19 brain dump: hourly/daily/weekly reports showing
// downtime and junk-vs-benefit time accounting, generated by system-report.js and filed
// into SecondBrain/Agent Manager Reports/<period>/). Own fetch + render, same
// list-then-modal-detail shape as the benchmark runs list / deep-dive projects list --
// no separate detail route needed, just a cache of the currently-open report's raw
// Markdown.
let reportsListCache = [];
let reportsPeriodFilter = 'all';

// Minimal Markdown -> HTML for exactly the shape system-report.js's own renderMarkdown()
// produces (# / ## headers, - list items, **bold**, plain paragraphs) -- not a general
// Markdown renderer. Escapes first so any task title/source string embedded in a report
// (arbitrary text from the pipeline, not necessarily safe) can't inject markup.
function renderReportMarkdown(md) {
  const lines = escapeHtml(md).split('\n');
  let html = '';
  let inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const line of lines) {
    if (line.startsWith('## ')) { closeList(); html += `<h3>${inline(line.slice(3))}</h3>`; }
    else if (line.startsWith('# ')) { closeList(); html += `<h2>${inline(line.slice(2))}</h2>`; }
    else if (line.startsWith('- ')) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(line.slice(2))}</li>`; }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  closeList();
  return html;
}

async function openReportDetail(period, filename) {
