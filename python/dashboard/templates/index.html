<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-manager dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a3358; --text: #e6e8eb; --muted: #8a90a0;
    --accent: #5b9dff; --ok: #4caf7d; --warn: #e0a940; --bad: #e0575c;
    /* Lighter than --accent specifically for link text -- #5b9dff reads fine for borders/
       badges/fills but is too close to --bg (#0f1115) for thin anchor text to stay
       legible at a glance (Grimmethy, 2026-08-19: "links... blend in too much with the
       background"). */
    --link: #8fc4ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  a { color: var(--link); }
  a:hover { text-decoration: underline; }
  header { padding: 14px 20px; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .pipeline-dir { color: var(--muted); font-size: 12px; }
  .layout { display: flex; }
  nav { width: 200px; padding: 16px 0; border-right: 2px solid var(--border); min-height: calc(100vh - 53px); }
  /* Chat panel (Brain Dump #153): a third flex sibling of nav/main, not a modal -- see
     app.py/chat_sessions.py for the backend. Collapsed state is a plain width/visibility
     toggle (localStorage-persisted, same convention nav-group expand/collapse already
     uses) rather than removing the element, so its own scroll position and in-progress
     draft text survive a collapse/expand cycle. */
  /* position: sticky + a real height (not min-height) pins the panel to the viewport
     regardless of how tall #main's own content gets -- min-height alone let the whole
     flex row stretch to match #main's scroll height, dragging the chat input down below
     the fold and forcing a full-page scroll just to reach it (Grimmethy, confirmed live:
     "I have to scroll to the bottom of the page to use the chat box"). overflow:hidden on
     the panel itself pushes all scrolling down into .grill-transcript, where it belongs. */
  #chat-panel { width: 380px; border-left: 2px solid var(--border); height: calc(100vh - 53px); position: sticky; top: 53px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  #chat-panel.chat-collapsed { width: 0; overflow: hidden; border-left: none; }
  .chat-header { padding: 12px 16px; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chat-header h2 { font-size: 13px; margin: 0; font-weight: 600; flex: 1; }
  /* min-height: 0 on BOTH nested flex:1 levels -- the classic flexbox trap (Grimmethy,
     confirmed live: "When I send a message... the chat scrolls all the way up to the
     beginning"): a flex item's min-height defaults to auto, which means it won't shrink
     below its OWN CONTENT's natural height even with flex:1 set. Without this, .chat-body
     and #chat-transcript both just grow to fit the whole transcript instead of staying
     fixed-height with internal scroll -- the newest messages get pushed past #chat-panel's
     own fixed, clipped (overflow:hidden) box and are invisibly cut off, while the oldest
     messages stay visible at the top. */
  .chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px; overflow: hidden; }
  /* 2026-08-26, Grimmethy: "Whenever I press enter... it resets to the top of the scroll
     instead of the bottom" -- root-caused live: #chat-transcript's own static markup
     ALREADY carries class="grill-transcript" (for exactly this flex-sizing rule), but
     grillRenderTranscript() (shared with Discuss/Grill, called by chatRender() below)
     unconditionally wraps its rows in ANOTHER "grill-transcript"-classed div -- fine for
     every OTHER caller (their container element doesn't already carry that class, so
     grillRenderTranscript's own div is the only one), but Chat alone ends up with the
     class on both #chat-transcript AND the freshly-rendered div nested one level inside
     it. Both then match the base .grill-transcript rule's own `overflow-y: auto`, so BOTH
     become independently scrollable -- the flex:1/min-height:0 sizing here means the OUTER
     one (#chat-transcript) never actually has anything to scroll (its single child fills
     it exactly), so the REAL scrolling happens on the INNER, freshly-created div instead,
     whose scrollTop chatRender() never touched (it only ever set scrollTop on the outer
     #chat-transcript) -- so every fresh render (i.e. every message, whichever way it was
     sent) left that inner div sitting at its default post-render scrollTop of 0. Targeting
     #chat-transcript by ID instead of the shared class here (rather than .grill-transcript)
     keeps this sizing rule from ALSO matching that inner div a second time; overflow:hidden
     on the outer makes it explicit that only the inner div should ever show a scrollbar.
     See chatRender()'s own comment for the matching JS-side fix. */
  .chat-body #chat-transcript { flex: 1; min-height: 0; overflow: hidden; }
  .chat-reserve-btn.active { background: var(--warn); color: #1a1300; border-color: var(--warn); }
  #chat-toggle-tab { position: fixed; right: 0; top: 70px; writing-mode: vertical-rl; background: var(--panel); border: 2px solid var(--border); border-right: none; border-radius: 6px 0 0 6px; color: var(--muted); padding: 10px 6px; cursor: pointer; font-size: 12px; z-index: 5; }
  #chat-toggle-tab:hover { color: var(--text); }
  nav button { display: flex; justify-content: space-between; width: 100%; padding: 10px 20px; background: none; border: none; color: var(--text); text-align: left; cursor: pointer; font-size: 13px; }
  nav button:hover { background: var(--panel); }
  nav button.active { background: var(--panel); border-left: 3px solid var(--accent); color: var(--accent); }
  nav .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 500; font-size: 12px; border-bottom: 2px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 2px solid var(--border); vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: rgba(76,175,125,.15); color: var(--ok); }
  .badge.warn { background: rgba(224,169,64,.15); color: var(--warn); }
  .badge.bad { background: rgba(224,87,92,.15); color: var(--bad); }
  .badge.idle { background: rgba(138,144,160,.15); color: var(--muted); }
  .badge-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  /* Brain Dump entry serial number -- a short, stable handle ("#12") to reference a
     specific entry by in conversation instead of its long slugified id. Monospace so
     digits stay visually distinct from the surrounding prose text they're prefixed to. */
  .bd-serial { font-family: monospace; font-weight: 700; color: var(--accent); }
  /* Nav sidebar tab-count severity dot (harnss UI pattern, adapted 2026-07-26): a solid
     small circle, distinct from .badge's translucent pill -- a tiny dot needs a solid
     fill to read at a glance, especially next to a bare number in the nav rail. */
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .status-dot.ok { background: var(--ok); }
  .status-dot.warn { background: var(--warn); }
  .status-dot.bad { background: var(--bad); }
  .stale-timer { color: var(--bad); font-size: 11px; font-variant-numeric: tabular-nums; }
  .state-timer { color: var(--muted, #8b949e); font-size: 11px; font-variant-numeric: tabular-nums; }
  .worker-card { background: var(--panel); border: 2px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .worker-card .row { display: flex; justify-content: space-between; align-items: center; }
  .worker-card .id { font-weight: 600; }
  .worker-model-select { margin-left: 10px; margin-right: auto; font-size: 12px; max-width: 220px; }
  .worker-card .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .worker-card.clickable { cursor: pointer; }
  .recent-tasks-list { list-style: none; padding: 0; margin: 6px 0 0; }
  .recent-tasks-list li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid var(--border); }
  .recent-tasks-list li:first-child { border-top: none; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  tr.top-row td:first-child { border-left: 2px solid var(--ok); }
  tr.needs-clarification-row td:first-child { border-left: 2px solid var(--warn); }
  tr.adhoc-awaiting-confirm-row td:first-child { border-left: 2px solid var(--bad); }
  .bar-track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .benchmark-check-grid { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; }
  .benchmark-check { font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .bench-category-group { flex-basis: 100%; }
  /* Case rows carry a trailing best/worst stats phrase (see renderCaseStats() in the JS) --
     too much text for the models list's nowrap chip layout, so each case gets its own
     wrapping block row instead. */
  .bench-category-group .benchmark-check { display: block; white-space: normal; margin-top: 3px; }
  .bench-case-stats { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .ok-text { color: var(--ok); }
  .bad-text { color: var(--bad); }
  /* Reasoning benchmark radar chart: the Responses table (the run's test prompts) sits on
     the left, the radar comparing every model across those same prompts sits to its right
     -- wrap lets it drop below on narrow viewports rather than squeezing the table. */
  .bench-responses-row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-top: 6px; }
  .bench-responses-row > .bench-responses-table { flex: 1 1 420px; min-width: 320px; }
  .bench-radar-wrap { flex: 0 0 auto; width: 320px; }
  .bench-radar-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 8px; }
  .bench-radar-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
  .bench-radar-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .bench-radar-axis-label { fill: var(--muted); font-size: 9px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 2px solid var(--border); border-radius: 10px; padding: 20px 24px; max-width: 900px; width: 100%; }
  .modal h2 { margin-top: 0; font-size: 15px; }
  .modal pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 2px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; max-height: 400px; overflow-y: auto; }
  .modal .close { float: right; cursor: pointer; color: var(--muted); background: none; border: none; font-size: 18px; }
  .field-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 14px; }
  .task-history { border-left: 2px solid var(--border); padding-left: 10px; margin-top: 4px; }
  .task-history-row { font-size: 12px; padding: 3px 0; }
  .task-history-stage { font-family: monospace; font-weight: 600; }
  .task-history-row .meta { display: inline; }
  /* Draft Attempts: one <details> per draftTask() run (draft-attempt-record.js). */
  .draft-attempt { border: 2px solid var(--border); border-radius: 6px; margin-top: 6px; padding: 0 10px; }
  .draft-attempt > summary { cursor: pointer; padding: 8px 0; font-size: 12px; font-weight: 600; list-style-position: inside; }
  .draft-attempt[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .draft-attempt .da-body { padding-bottom: 10px; }
  .da-outcome-blocked, .da-outcome-error { color: var(--bad); }
  .da-outcome-succeeded { color: var(--good, #4caf50); }
  .da-tier { font-size: 12px; padding: 4px 0; border-top: 1px dashed var(--border); margin-top: 6px; }
  .da-tier-name { font-family: monospace; font-weight: 600; }
  .da-tools { font-size: 11px; color: var(--muted); font-family: monospace; }
  .draft-attempt pre { max-height: 260px; }
  /* Work Log: full per-tier tool transcript (task._workLog, src/work-log.js) for auditing. */
  .work-log { border: 2px solid var(--border); border-radius: 6px; margin-top: 6px; padding: 0 10px; }
  .work-log > summary { cursor: pointer; padding: 8px 0; font-weight: 600; list-style-position: inside; }
  .work-log[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .wl-tier { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 4px; }
  .wl-call { font-family: monospace; font-size: 11px; padding: 2px 0; line-height: 1.5; }
  .wl-call > summary { cursor: pointer; }
  .wl-call.wl-err { color: var(--bad); }
  .wl-n { color: var(--muted); }
  .wl-tool { font-weight: 600; }
  .work-log pre { max-height: 220px; font-size: 11px; }
  /* Base state (Ornith) also gets its own look, not just the Claude state -- previously
     only .provider-toggle-claude had a distinct color, so the default Ornith state was
     visually identical to a plain .secondary button (Discuss/Edit/Delete), which is how
     a Discuss session got started against the wrong provider without anyone noticing
     (confirmed live 2026-08-17: a human-simulated test clicked Discuss right past it).
     Both states now read as "this is a mode switch," not "this is another action". */
  .provider-toggle { border-color: var(--muted); }
  .provider-toggle-claude { background: var(--accent); color: #0b1220; border-color: var(--accent); }
  #toast { position: fixed; bottom: 20px; right: 20px; max-width: 420px; padding: 10px 16px; border-radius: 8px; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 9999; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .15s ease, transform .15s ease; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.toast-error { background: var(--bad); color: #fff; }
  #toast.toast-info { background: var(--panel); color: var(--text); border: 2px solid var(--border); }
  .path-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .path-row input { flex: 1; background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-family: monospace; font-size: 13px; }
  button.action { background: var(--accent); color: #0b1220; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.action:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: var(--panel); color: var(--text); border: 2px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.danger { background: var(--bad); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.danger:disabled { opacity: .5; cursor: not-allowed; }
  .worker-filter-bar { display: flex; gap: 8px; }
  .worker-filter-bar button { background: var(--panel); color: var(--muted); border: 2px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .worker-filter-bar button.active { color: var(--accent); border-color: var(--accent); }
  .browser-panel { background: var(--panel); border: 2px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
  .browser-crumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; word-break: break-all; }
  .browser-crumb .crumb-link { color: var(--link); cursor: pointer; }
  .browser-crumb .crumb-link:hover { text-decoration: underline; }
  .browser-entry { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .browser-entry:hover { background: var(--bg); }
  .browser-entry .git-badge { font-size: 10px; color: var(--ok); border: 1px solid var(--ok); padding: 1px 6px; border-radius: 8px; }
  .browser-entry .entry-count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .browser-entry .set-active-project, .browser-entry .create-github-project { font-size: 11px; padding: 3px 9px; }
  .stat-row { display: flex; gap: 24px; margin: 14px 0; }
  .stat { color: var(--muted); font-size: 12px; }
  .stat strong { color: var(--text); font-size: 16px; display: block; }
  .build-log { background: var(--bg); border: 2px solid var(--border); border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: 12px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
  .build-log div { color: var(--muted); }
  iframe.viz { width: 100%; flex: 1; min-height: 0; border: 2px solid var(--border); border-radius: 8px; margin-top: 16px; }
  .split-pane { display: flex; gap: 16px; align-items: flex-start; }
  .split-pane > div { flex: 1; min-width: 0; }
  .capture-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .capture-row input { flex: 1; background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .bd-entry { background: var(--panel); border: 2px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .bd-entry .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bd-entry .text { font-size: 13px; }
  .bd-entry .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .bd-entry a.jump { color: var(--link); font-size: 12px; text-decoration: none; }
  .note-content { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 2px solid var(--border); border-radius: 6px; padding: 12px; font-size: 13px; max-height: 500px; overflow-y: auto; font-family: monospace; }
  .grill-transcript { max-height: 360px; overflow-y: auto; background: var(--bg); border: 2px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
  .grill-msg-role { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .grill-msg-assistant .grill-msg-role { color: var(--accent); }
  .grill-msg-text { font-size: 13px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  /* 2026-09-01 (Grimmethy: "each thinking segment to include a full blank line space
     between each other" + "time stamps to the second programmed into each thought
     segment"): transcript text is now split on blank lines into <p> blocks (see
     grillRenderTranscript) -- each gets a per-segment HH:MM:SS stamp and a full
     blank-line gap between it and the next segment. */
  .grill-msg-text p { margin: 0 0 1em 0; }
  .grill-msg-text p:last-child { margin-bottom: 0; }
  .grill-seg-ts { display: inline-block; font-size: 10px; font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 0.5em; }
  .grill-msg-user { align-self: flex-end; max-width: 85%; }
  .grill-msg-user .grill-msg-role { text-align: right; }
  .grill-msg-user .grill-msg-text { background: var(--panel); border-radius: 6px; padding: 6px 10px; }
  .grill-session .grill-answer { display: block; width: 100%; box-sizing: border-box; resize: vertical; background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-top: 10px; font-family: inherit; }
  .grill-enriched-badge { color: var(--ok); font-size: 12px; margin-top: 10px; }
  .browser-entry.active { background: var(--bg); color: var(--accent); }
  .priority-input { width: 60px; background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  .priority-input:focus { outline: 1px solid var(--accent); }

  /* Mobile layout: below this width there isn't room for the fixed 200px nav rail plus a
     380px chat panel alongside main content, so the three-column .layout collapses to a
     single column -- nav becomes a horizontally-scrollable top strip (same buttons, just
     laid out in a row instead of stacked), and the chat panel becomes a bottom sheet that
     overlays main instead of sitting beside it (it already toggles via .chat-collapsed on
     #chat-panel, so this only changes ITS geometry, not the JS that drives it). Tables are
     left as real <table> markup (JS renders them as raw HTML strings with no wrapper div to
     hang overflow on) and instead scroll horizontally inside #main itself. */
  @media (max-width: 860px) {
    header { flex-wrap: wrap; padding: 10px 14px; gap: 8px 12px; }
    header .pipeline-dir { flex-basis: 100%; }
    .layout { flex-direction: column; }
    nav { width: 100%; min-height: 0; border-right: none; border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; padding: 6px 8px; -webkit-overflow-scrolling: touch; }
    nav button { width: auto; white-space: nowrap; padding: 8px 12px; }
    nav button.active { border-left: none; border-bottom: 3px solid var(--accent); }
    main { padding: 12px; overflow-x: auto; }
    table { min-width: 560px; }
    #chat-panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: 100%; height: 65vh; border-left: none; border-top: 2px solid var(--border); z-index: 15; }
    #chat-panel.chat-collapsed { height: 0; width: 100%; border-top: none; }
    #chat-toggle-tab { writing-mode: horizontal-tb; right: 12px; top: auto; bottom: 12px; border: 2px solid var(--border); border-radius: 20px; padding: 8px 14px; }
    .worker-card .row { flex-wrap: wrap; row-gap: 6px; }
    .worker-model-select { margin-left: 0; margin-right: 0; max-width: none; width: 100%; }
    .stat-row { flex-wrap: wrap; row-gap: 10px; }
    .split-pane { flex-direction: column; }
    .path-row, .capture-row { flex-wrap: wrap; }
    .modal-backdrop { padding: 12px; }
    .modal { padding: 16px; max-width: 100%; }
    .benchmark-check-grid { gap: 4px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>agent-manager</h1>
  <span class="pipeline-dir" id="pipeline-status">loading...</span>
  <button class="action" id="global-brain-dump-btn" style="margin-left:auto" title="Capture a quick note to Brain Dump from any tab">+ Brain Dump</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="empty">Loading...</div></main>
  <aside id="chat-panel">
    <div class="chat-header">
      <h2 id="chat-title" title="Rooted at the agent-manager repo, with read/write access to every registered plugin and project repo.">System Chat</h2>
      <span id="chat-provider-container"></span>
      <button type="button" class="secondary" id="chat-reserve-btn" style="display:none" title="Hold the local model exclusively for this conversation until you turn it back off">Reserve</button>
      <button type="button" class="secondary" id="chat-new-btn" title="Start a fresh conversation">New</button>
    </div>
    <div class="chat-body">
      <div id="chat-transcript"></div>

// is load-bearing: the row's own onclick (openDetail) must not also fire when a button
// inside that row is clicked.
// Incremental loading (2026-07-26, Grimmethy: "long task lists take a while to load,
// we should do incremental loading, 10 at a time, expanding as the user scrolls to the
// bottom"). queueLoadedCount/queueHasMore persist per-state across the generic 5s
// refresh() poll and across tab switches (switching away and back keeps your scroll
// depth) -- only a full page reload resets them to the first page.
const QUEUE_PAGE_SIZE = 10;
const QUEUE_STATE_TABS = ['drafting', 'pending', 'review', 'approved', 'blocked', 'needs-clarification', 'awaiting-confirm', 'coordinating', 'done'];
const queueLoadedCount = {};
const queueHasMore = {};
let queueLoadInFlight = false;

// Task-type filter (Job Status > Done, 2026-08-17: "Done is getting huge, need to
// filter by task type"). Per-state so switching tabs doesn't carry a filter over to an
// unrelated list; '' means unfiltered. Options come from /api/job-types (same source
// catalog the Job List tab's own rows are built from) fetched once and cached module-
// scope -- it barely changes, and re-fetching on every 5s poll would be wasteful for a
// dropdown that just needs the name list.
const queueSourceFilter = {};
let allSourceNamesPromise = null;
window.addEventListener('scroll', () => {
  if (!QUEUE_STATE_TABS.includes(activeTab)) return;
  if (!queueHasMore[activeTab] || queueLoadInFlight) return;
  if (window.innerHeight + window.scrollY < document.body.offsetHeight - 200) return;
  queueLoadedCount[activeTab] = (queueLoadedCount[activeTab] || QUEUE_PAGE_SIZE) + QUEUE_PAGE_SIZE;
  renderQueueTab(activeTab);
});

// State -> .badge severity class, same ok/warn/bad/idle vocabulary the Workers/Models
// tabs already use (see .badge CSS) -- reusing it here rather than inventing a second
// color language for what's still just "where is this task in the pipeline."
// --- Concepts tab (2026-09-06, see AGENTS.md's "Concept research" section) ------------
// A concept's audit trail (research findings + implementation tasks tied to it) is
// fetched on demand per-card ("View timeline"), not eagerly for the whole list -- same
// reasoning as Brain Dump's own per-entry lazy behaviors: cheap by default, real cost
// only paid when a human actually wants to look.

// Lifecycle (2026-09-06, Grimmethy: "I envision them as a sort of hub we can return to
// and develop and optimize over time"): 'shelved'/'shipped' are stable, deliberate
// terminal-for-now states (src/concepts.js's STABLE_CONCEPT_STATUSES) -- badged
// distinctly from the growing/active statuses so the default view doesn't read a
// deliberately-parked concept as just another open item.
const CONCEPT_STABLE_STATUSES = new Set(['shelved', 'shipped']);

function renderConceptCard(concept) {
  const isStable = CONCEPT_STABLE_STATUSES.has(concept.status);
  const statusBadge = `<span class="badge ${isStable ? 'ok' : 'idle'}">${escapeHtml(concept.status || 'open')}</span>`;
  const researchChip = concept.researchForkCount > 0
    ? `<span title="Last researched ${concept.lastResearchedAt ? escapeAttr(new Date(concept.lastResearchedAt).toLocaleString()) : 'unknown'}" style="display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid var(--muted);border-radius:3px;color:var(--muted);font-size:11px">🔬 researched ${concept.researchForkCount}×</span>`
    : '';
  const scratch = concept.builtFromScratchCount || 0;
  const adapted = concept.adaptedFromResourceCount || 0;
  const buildChip = (scratch + adapted) > 0
    ? `<span title="Self-reported by the implementing model when it finishes concept-tagged work -- NOT verified against real diffs, treat as a rough signal only" style="display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid var(--warn);border-radius:3px;color:var(--warn);font-size:11px">🔨 ${scratch} scratch / 🔗 ${adapted} adapted (unverified)</span>`
    : '';
  // linkedTaskCount (2026-09-06): a deterministic backfill match (a done task's own
  // title/rawText literally named this concept) -- see src/concept-tally-backfill.js.
  // Kept visually distinct from buildChip above: this is a real, verified signal (an
  // exact phrase match), not a self-report, so it earns a plain accent tone instead of
  // the warn-colored "unverified" styling.
  const linkedChip = concept.linkedTaskCount > 0
    ? `<span title="Done tasks whose own title or text named this concept by name -- a deterministic match, not self-reported" style="display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid var(--accent);border-radius:3px;color:var(--accent);font-size:11px">📎 ${concept.linkedTaskCount} linked task${concept.linkedTaskCount === 1 ? '' : 's'}</span>`
    : '';
  const shelveNote = concept.status === 'shelved'
    ? `<div class="row meta" style="margin-top:4px"><span>⏸ Shelved: ${escapeHtml(concept.shelvedReason || '')}${concept.revisitCondition ? ` — revisit when: ${escapeHtml(concept.revisitCondition)}` : ''}</span></div>`
    : '';
  const lifecycleButtons = isStable
    ? `<button class="secondary" data-reopen-concept="${escapeAttr(concept.id)}">Reopen</button>`
    : `<button class="secondary" data-shelve-concept="${escapeAttr(concept.id)}">Shelve</button>
       <button class="secondary" data-ship-concept="${escapeAttr(concept.id)}">Ship</button>`;
  return `
    <div class="bd-entry" data-concept-id="${escapeAttr(concept.id)}">
      <div class="row">
        <span class="text"><strong>${escapeHtml(concept.name)}</strong>${researchChip}${buildChip}${linkedChip}</span>
        ${statusBadge}
      </div>
      <div class="row meta"><span>${escapeHtml(concept.description || '')}</span></div>
      ${shelveNote}
      <div class="row" style="margin-top:8px">
        <span></span>
        <span>
          <button class="secondary" data-view-timeline="${escapeAttr(concept.id)}">View timeline</button>
          ${lifecycleButtons}
        </span>
      </div>
      <div class="concept-shelve-form" data-shelve-form-for="${escapeAttr(concept.id)}" hidden></div>
      <div class="concept-timeline" data-timeline-for="${escapeAttr(concept.id)}" hidden></div>
    </div>
  `;
}

function renderConceptTimelineRows({ rows, truncated }) {
  const truncatedNote = truncated
    ? '<div class="meta" style="color:var(--warn)">⚠ Task history scan hit its time budget -- older completed tasks may be missing from this list (research findings above are always complete).</div>'
    : '';
  if (!rows.length) return truncatedNote + '<div class="meta">No research findings or tasks tied to this concept yet.</div>';
  return truncatedNote + '<ul class="concept-timeline-list">' + rows.map((r) => {
    const when = r.at ? new Date(r.at).toLocaleString() : 'unknown time';
    const icon = r.kind === 'research-finding' ? '🔬' : '🛠';
    return `<li>${icon} <span class="meta">${escapeHtml(when)}</span> — ${escapeHtml(r.summary || r.ref)}</li>`;
  }).join('') + '</ul>';
}

async function renderConceptsTab() {
  const main = document.getElementById('main');
  let concepts;
  try {
    concepts = await fetchJson('/api/concepts');
  } catch (e) {
    main.innerHTML = `<div class="empty">Error loading concepts: ${e.message}</div>`;
    return;
  }
  const newConceptForm = `
    <div class="row" style="margin-bottom:12px">
      <input type="text" id="concept-new-name" placeholder="Concept name (e.g. dependency-ordering)" style="flex:1">
      <input type="text" id="concept-new-description" placeholder="Short description (optional)" style="flex:2">
      <button id="concept-new-submit">+ New Concept</button>
    </div>
  `;
  const list = concepts.length
    ? concepts.map(renderConceptCard).join('')
    : '<div class="empty">No concepts tracked yet -- add one above, or one will appear the first time a research fork runs on a new topic.</div>';
  main.innerHTML = newConceptForm + list;

  document.getElementById('concept-new-submit').onclick = async () => {
    const name = document.getElementById('concept-new-name').value.trim();
    const description = document.getElementById('concept-new-description').value.trim();
    if (!name) return;
    await fetch('/api/concepts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description }),
    });
    renderConceptsTab();
  };

  main.querySelectorAll('[data-view-timeline]').forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.dataset.viewTimeline;
      const panel = main.querySelector(`[data-timeline-for="${CSS.escape(id)}"]`);
      if (!panel.hidden) { panel.hidden = true; return; }
      panel.innerHTML = '<div class="meta">Loading…</div>';
      panel.hidden = false;
      try {
        const rows = await fetchJson(`/api/concepts/${encodeURIComponent(id)}/timeline`);
        panel.innerHTML = renderConceptTimelineRows(rows);
      } catch (e) {
        panel.innerHTML = `<div class="empty">Error loading timeline: ${e.message}</div>`;
      }
    };
  });

  // Shelve/Reopen/Ship (2026-09-06): shelving needs a real reason (and an optional
  // revisit condition), so it opens an inline form -- same lightweight pattern as the
  // "+ New Concept" form above -- rather than a bare confirm(), since "why" is the whole
  // point of the field (see src/concepts.js's shelveConcept: it refuses without one).
  main.querySelectorAll('[data-shelve-concept]').forEach((btn) => {
    btn.onclick = () => {
      const id = btn.dataset.shelveConcept;
      const form = main.querySelector(`[data-shelve-form-for="${CSS.escape(id)}"]`);
      if (!form.hidden) { form.hidden = true; return; }
      form.hidden = false;
      form.innerHTML = `
        <div class="row" style="margin-top:6px;gap:6px">
          <input type="text" placeholder="Why are you shelving this? (required)" class="concept-shelve-reason" style="flex:1">
          <input type="text" placeholder="Revisit when... (optional)" class="concept-shelve-revisit" style="flex:1">
          <button data-shelve-confirm="${escapeAttr(id)}">Confirm shelve</button>
        </div>
      `;
      form.querySelector('[data-shelve-confirm]').onclick = async () => {
        const reason = form.querySelector('.concept-shelve-reason').value.trim();
        if (!reason) return;
        const revisitCondition = form.querySelector('.concept-shelve-revisit').value.trim() || null;
        await fetch(`/api/concepts/${encodeURIComponent(id)}/shelve`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason, revisitCondition }),
        });
        renderConceptsTab();
      };
    };
  });
  main.querySelectorAll('[data-ship-concept]').forEach((btn) => {
    btn.onclick = async () => {
      await fetch(`/api/concepts/${encodeURIComponent(btn.dataset.shipConcept)}/ship`, { method: 'POST' });
      renderConceptsTab();
    };
  });
  main.querySelectorAll('[data-reopen-concept]').forEach((btn) => {
    btn.onclick = async () => {
      await fetch(`/api/concepts/${encodeURIComponent(btn.dataset.reopenConcept)}/reopen`, { method: 'POST' });
      renderConceptsTab();
    };
  });
}

// server, default http://localhost:7430; set PROMPTFORGE_URL to override). This tab
// just embeds it in an iframe -- no proxy, no shared state. The app itself talks to
// ComfyUI on :8188. See SecondBrain/Projects/promptforge-ecosystem.md.
//
// IDEMPOTENT: this must NOT rebuild the iframe when it's already mounted -- doing so
// reloads PromptForge and wipes whatever the user is typing/dragging. The generic 5s
// refresh() also skips this tab (same opt-out as Project / Brain Dump), so the iframe
// is built exactly once per visit.

// AdForge tab: same shape as PromptForge above -- a separate local web app (its own
// repo + Flask server, default http://localhost:7431; set ADFORGE_URL to override),
// embedded in an iframe. AdForge orchestrates the advertisement pipeline (script ->
// stills -> voice/score -> assemble -> bundle) by calling sibling apps over HTTP.
// See SecondBrain/Projects/adforge-project-status-and-backlog.md.
//
// IDEMPOTENT, same as renderPromptForgeTab: never rebuild a mounted iframe, and the
// generic 5s refresh() skips this tab.

// ScriptForge tab: same shape as PromptForge / AdForge above -- a separate local
// web app (its own repo + Flask server, default http://localhost:7432; set
// SCRIPTFORGE_URL to override), embedded in an iframe. Phase 1 of the AdForge
// pipeline: brief -> treatment + shot list + PromptForge shot-specs + VO + music
// brief, on the local model. IDEMPOTENT; the 5s refresh() skips this tab.

// --- Hardware tab --------------------------------------------------------------------
// Read-only view of hardware_stats.py's background sampler (a daemon thread app.py
// starts on boot, 10s interval / 24h retention -- see start_sampler() there) via
// /api/hardware/stats. No dedicated poll loop: this tab has no in-progress user input to
// protect (unlike Project/Brain Dump), so it just rides the generic 5s refresh() cycle
// every other read-only tab already uses.

// Hand-rolled inline SVG line chart -- this repo vendors no charting library (no Chart.js/
// D3/Plotly) and every other tab is plain HTML/vanilla JS, so every hardware history
// graph follows suit instead of pulling one in. `history` is oldest-first (same order
// /api/hardware/stats' "history" array is already in). The rolling average renders as a
// dashed reference line -- solid-vs-dashed distinguishes it from the current-value line
// structurally, not by color alone, so it still reads in a screenshot or under a
// color-vision deficiency. getValue may return null for a given entry (e.g. no GPU
// present for that sample) -- those points are simply left out of the polyline, which
// gaps the line across missing stretches rather than erroring or plotting a false 0.
// --- Project tab --------------------------------------------------------------------

// First click on the toggle while running: request a graceful stop (SIGTERM, each daemon
// finishes its current tick per its own trap, grace period, then SIGKILL stragglers --
// see stop.sh). The server backgrounds this and returns immediately, so the button flips
// to "Force Stop Pipeline" right away rather than sitting on "Stopping..." for up to the
// full grace period -- the next status poll reports actually-stopped once daemons exit.
// Second click on the toggle (after a graceful stop is already in flight): SIGKILL
// immediately, no grace-period wait, for a daemon that's stuck (wedged mid model-call,
// ignoring its own trap). Resets stopRequested regardless of outcome so a still-running
// pipeline (the force call itself failed) offers a fresh graceful attempt rather than
// getting stuck only ever offering force.
// Set to whatever "key" the currently-rendered #project-status-area content corresponds
// to -- refreshProjectStatus() is polled every 3s, but overwriting innerHTML unconditionally
// destroys and recreates the <iframe> even when its src is byte-identical, which restarts
// pyvis's force-directed layout simulation from scratch every single poll (confirmed live:
// looked exactly like "the graph keeps rebuilding" even though no build was actually
// running). Only touch the DOM when what SHOULD be shown has actually changed.
let lastRenderedStatusKey = null;

// --- Brain Dump tab -------------------------------------------------------------------

// Only one entry can be under edit at a time -- tracked globally (not per-render local
// state) so refreshBrainDumpEntries knows to render that one card as an editable input
// instead of static text, and so the periodic poll (see enterBrainDumpTab) can skip
// rebuilding the list entirely while it's set, same reasoning as brainDumpBrowsePath.
let brainDumpEditingId = null;

// Same reasoning as brainDumpEditingId above -- only one entry can be under discussion at
// a time, tracked globally so the periodic poll skips rebuilding the list while a
// conversation is in progress (an open-ended chat can run for a while; losing it to a 5s
// refresh tick would be a real bug, not a cosmetic one). brainDumpDiscussSession caches
// the session itself so re-rendering after each message doesn't need a separate fetch.
let brainDumpDiscussingId = null;
let brainDumpDiscussSession = null;
// Lets the "Starting conversation..." state (brain-dump entry, 2026-08-17: "starting
// conversation can take a long time to load, I need to be able to cancel") actually
// interrupt the in-flight /discuss/start request rather than just hiding the wait --
// only one Discuss start is ever in flight at a time (brainDumpDiscussingId's own
// single-conversation-at-a-time design), so one controller is enough.
let brainDumpDiscussStartController = null;

// Resume an in-progress conversation instead of silently starting a second one next to
// it. A past ENDED discussion doesn't get the same guard -- it's kept either way (never
// deleted), so blocking on a confirm() here protected nothing, just added a click, and
// a native confirm() dialog freezes ALL page script execution for as long as it's up,
// which looks exactly like a hung page to anything driving the browser programmatically
// (e.g. claude-in-chrome: screenshot/get_page_text calls timed out for 45s+ against a
// perfectly healthy server -- confirmed live 2026-08-17). A toast surfaces the same
// "your old discussion is still there" info without blocking anything.
// force=true bypasses the "don't clobber an in-progress edit" guard -- used after an
// action (save/cancel/delete/prioritize) that just resolved that edit itself, as opposed
// to the periodic 5s poll (enterBrainDumpTab), which must respect it.
// Live downstream task status, not just "queued and hopefully fine" -- confirmed live
// 2026-08-16: every one of a real user's actioned brain-dump entries was actually
// sitting blocked (truncated drafts, fabricated files, one pure refusal), completely
// invisible under the old flat "queued" badge regardless of what really happened.
// Module-scope (not per-render-function-local) since both the Brain Dump tab's cards
// and the Second Brain file viewer's linked-task refs need the exact same mapping.
const TASK_STATUS_BADGE = {
  blocked: ['bad', 'blocked'],
  'needs-clarification': ['warn', '⚠ needs clarification'],
  'awaiting-confirm': ['bad', '🗑 awaiting confirm'],
  pending: ['idle', 'queued'],
  drafting: ['warn', 'drafting'],
  review: ['warn', 'in review'],
  approved: ['warn', 'approved'],
  done: ['ok', 'done'],
  archived: ['idle', 'archived'],
  unknown: ['idle', 'status unknown'],
};

// Clickable everywhere it's used (Brain Dump cards, Second Brain "Linked Tasks") so the
// same badge always opens the same task progress modal -- confirmed live 2026-08-18: a
// Brain Dump entry showing "blocked" gave no way to see *why* short of hunting the task
// down by hand in the right queue tab. openTaskAnywhere() (used by the Workers tab click-
// through) already solves "find this task regardless of which queue state it's in".
// Delegated (not per-badge onclick) since taskStatusBadgeHtml's output gets dropped into
// innerHTML in several different places (Brain Dump cards, Second Brain linked-task refs)
// that each re-render on their own schedule -- one listener on the stable #main ancestor
// survives all of those re-renders instead of needing to be rewired after each one.
document.getElementById('main').addEventListener('click', (e) => {
  const badge = e.target.closest('[data-open-task]');
  if (badge) openTaskAnywhere(badge.dataset.openTask);
});

// "Discuss" -- an open-ended conversation to add context to a captured entry before it
// gets sorted, without going through the more structured Grill Me flow (see
// discuss_sessions.py's own header for why that's a separate module, not a shared one).
// Reuses grill's .grill-transcript/.grill-msg-* CSS wholesale -- visually this IS the
// same "chat transcript" shape, no reason for a second, near-identical set of classes.
// "Discuss" for a vault note -- same open-ended, user-ended conversation as the Brain
// Dump tab's Discuss button (shares discuss_sessions.py and the generic /api/discuss/*
// endpoints; only /start and /for-note are note-vs-entry-specific), surfaced here
// alongside Grill Me/Grill With Docs per the actual ask: "adjacent to the grill me and
// grill with docs buttons." Structured as a single panel (grillRenderPanel's shape),
// not a per-card toggle like the Brain Dump tab's version -- there's only ever one note
// open here at a time, so no need for that version's brainDumpDiscussingId guard.
refresh();  // always -- populates counts + renders nav regardless of which tab is active
if (activeTab === 'project') enterProjectTab();
setInterval(refresh, 5000);
chatPanelInit();

// The graph iframe's CSS box resizes correctly on window resize (flex:1 fills whatever
// space main's own flex-column layout gives it), but a box change caused by the OUTER
// page's layout doesn't reliably fire a 'resize' event -- or wake vis-network's own
// autoResize -- inside the iframe's own window (confirmed: neither fired in testing).
// The top-level window always gets a real resize event, so push the new size into the
// iframe's network directly from here instead of relying on the iframe to notice on its
// own.
window.addEventListener('resize', () => {
  const iframe = document.querySelector('iframe.viz');
  const net = iframe && iframe.contentWindow && iframe.contentWindow.network;
  if (!net) return;
  const rect = iframe.getBoundingClientRect();
  net.setSize(rect.width + 'px', rect.height + 'px');
  net.redraw();
});
</script>
</body>
</html>
